<!DOCTYPE html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comprends ton chien</title>
<meta name="description" content="Observe, comprends et fais progresser ton chien : l'application lit tes balades, repère ce qui bloque et te dit quel exercice travailler aujourd'hui.">
<meta name="theme-color" content="#4B62F0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon chien">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%234B62F0'/><g fill='%23fff'><ellipse cx='7.1' cy='7.3' rx='2.35' ry='3.1'/><ellipse cx='13.1' cy='5.4' rx='2.35' ry='3.25'/><ellipse cx='18.5' cy='9.1' rx='2.2' ry='2.85'/><ellipse cx='2.6' cy='12.1' rx='2.15' ry='2.75'/><path d='M12.1 12.3c3.9 0 6.7 2.8 6.7 5.9 0 2.6-2 4-4.3 4-1.35 0-1.75-.55-3.1-.55s-1.75.55-3.1.55c-2.3 0-4.3-1.4-4.3-4 0-3.1 3-5.9 8.1-5.9Z'/></g></svg>">
<style>
:root{
  --paper:#F2F4FD; --surface:#FFFFFF; --surface-2:#F6F7FE; --surface-3:#EDF0FD;
  --ink:#141A33; --ink-2:#5B6486; --ink-3:#9AA2C0;
  --line:#E7EAF8; --line-2:#DDE2F5;
  --moss:#4B62F0; --moss-deep:#3446C6; --moss-soft:#EAEEFE; --moss-lite:#8B9BFF;
  --sky:#2E9BD6; --sky-soft:#E4F2FB;
  --ochre:#E8901B; --ochre-soft:#FDF0DC;
  --rouge:#EF4E62; --rouge-soft:#FDE7EA;
  --vert:#12A57A; --vert-soft:#E1F5EF;
  --violet:#7B62DE;
  --r-s:12px; --r-m:18px; --r-l:26px; --r-xl:32px;
  --shadow:0 2px 6px -2px rgba(30,42,95,.06), 0 12px 28px -18px rgba(30,42,95,.34);
  --shadow-lift:0 8px 24px -10px rgba(75,98,240,.42);
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --grad:linear-gradient(135deg,#5C73F5 0%,#4B62F0 45%,#3A4FD8 100%);
  --nav-h:0px;
}
html[data-theme="sombre"]{
  --paper:#0D1020; --surface:#171B2E; --surface-2:#1E2338; --surface-3:#252B44;
  --ink:#E9ECFA; --ink-2:#A9B1D0; --ink-3:#77809F;
  --line:#262C45; --line-2:#333B57;
  --moss:#7E92FF; --moss-deep:#9FADFF; --moss-soft:#232A4A; --moss-lite:#5C73F5;
  --sky:#63B6E8; --sky-soft:#17273A;
  --ochre:#E5AC55; --ochre-soft:#2E2718;
  --rouge:#F5808F; --rouge-soft:#311D24;
  --vert:#4CC69E; --vert-soft:#12312A;
  --violet:#A996CE;
  --shadow:0 2px 6px -2px rgba(0,0,0,.5), 0 14px 30px -20px rgba(0,0,0,.9);
  --shadow-lift:0 8px 24px -10px rgba(0,0,0,.7);
  --grad:linear-gradient(135deg,#4257CE 0%,#3A4CBC 50%,#2C3A96 100%);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  overscroll-behavior-y:none;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,h4{margin:0; line-height:1.18; font-weight:680; letter-spacing:-.02em}
h1{font-size:1.5rem} h2{font-size:1.2rem} h3{font-size:1rem} h4{font-size:.9rem}
p{margin:0 0 .7em}
a{color:var(--moss)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--moss); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Apparition des cartes : transform et opacity seulement, pour rester sur le compositeur */
@keyframes surgir{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){
  #view > *{animation:surgir .26s cubic-bezier(.22,.61,.36,1) both}
  #view > *:nth-child(2){animation-delay:.04s}
  #view > *:nth-child(3){animation-delay:.08s}
  #view > *:nth-child(4){animation-delay:.12s}
  #view > *:nth-child(n+5){animation-delay:.16s}
}

/* ---------- Shell ---------- */
.app{display:flex; min-height:100vh}
.side{
  width:246px; flex:0 0 246px; background:var(--surface); border-right:1px solid var(--line);
  position:sticky; top:0; height:100vh; overflow-y:auto; padding:20px 14px 24px;
}
.brand{display:flex; gap:11px; align-items:center; padding:4px 6px 18px}
.brand .dot{width:42px;height:42px;border-radius:14px;background:var(--grad);display:grid;place-items:center;
  font-size:21px;flex:0 0 auto;overflow:hidden;box-shadow:var(--shadow-lift)}
.brand .dot img{width:100%;height:100%;object-fit:cover;display:block}
.brand .dot .ico-svg{width:22px;height:22px;color:#fff}
.avatar .ico-svg{width:52%;height:52%;color:var(--moss)}
.brand b{display:block;font-size:1rem;letter-spacing:-.02em}
.brand span{display:block;font-size:.75rem;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;
  padding:10px 12px;border-radius:14px;cursor:pointer;color:var(--ink-2);font-size:.9rem;
}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--grad);color:#fff;font-weight:620;box-shadow:var(--shadow-lift)}
.nav button.on .ico{opacity:1}
.nav .ico{width:20px;display:grid;place-items:center;font-size:15px;flex:0 0 auto;opacity:.85}
.nav .ico .ico-svg{width:19px;height:19px}
.nav .sep{margin:16px 12px 6px;font-size:.72rem;color:var(--ink-3);font-weight:600}
.main{flex:1; min-width:0; display:flex; flex-direction:column}

/* Bandeau mobile */
.topbar{display:none; background:var(--grad); color:#fff; border-radius:0 0 var(--r-xl) var(--r-xl);
  padding:calc(14px + env(safe-area-inset-top,0px)) 18px 20px; box-shadow:var(--shadow-lift)}
.topbar .row1{display:flex;align-items:center;gap:12px}
.topbar .brand{padding:0;flex:1}
.topbar .brand .dot{background:rgba(255,255,255,.2);box-shadow:none}
.topbar .brand b{color:#fff;font-size:1.05rem}
.topbar .brand span{color:rgba(255,255,255,.72);order:-1}
.topbar .icon-btn{background:rgba(255,255,255,.16);color:#fff;width:38px;height:38px;border-radius:13px}
.topbar .icon-btn:hover{background:rgba(255,255,255,.28);color:#fff}

.view{padding:26px 30px 90px; max-width:1120px; width:100%}
.view-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.view-head .lede{color:var(--ink-2);font-size:.89rem;max-width:62ch;margin:6px 0 0}

/* Barre de navigation basse */
.botnav{display:none}
@media (max-width:900px){
  :root{--nav-h:76px}
  .side{display:none}
  .topbar{display:block}
  .view{padding:18px 16px calc(30px + var(--nav-h) + env(safe-area-inset-bottom,0px))}
  h1{font-size:1.3rem}
  .view-head{margin-bottom:18px}
  .view-head .lede{display:none}            /* le contexte tient dans les écrans vides */
  .desk-only{display:none}
  .view-head .row .btn{padding:8px 15px;font-size:.79rem}
  .tiles{gap:10px}
  .tile{padding:12px 6px 10px;gap:7px;font-size:.72rem}
  .tile .i{width:42px;height:42px;border-radius:14px}
  .seg{overflow-x:auto;max-width:100%;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .botnav{
    display:flex; position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:var(--surface); border-top:1px solid var(--line);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -6px 22px -14px rgba(30,42,95,.5);
  }
  .botnav button{
    flex:1; background:none; border:0; cursor:pointer; color:var(--ink-3);
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 2px;
    font-size:.66rem; font-weight:560; letter-spacing:-.01em; border-radius:14px;
  }
  .botnav button .i{display:grid;place-items:center;height:22px}
  .botnav button .i .ico-svg{width:21px;height:21px}
  .botnav button.on{color:var(--moss)}
  .botnav button.hole{visibility:hidden;pointer-events:none}
}

/* ---------- Cartes et blocs ---------- */
.card{background:var(--surface);border:0;border-radius:var(--r-m);padding:17px 18px;box-shadow:var(--shadow)}
.card.pad-lg{padding:22px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:820px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.g2,.g3{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--ink-3)}
.small{font-size:.82rem}
.tiny{font-size:.75rem}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.hr{height:1px;background:var(--line);border:0;margin:18px 0}

/* ---------- Carte de tête ---------- */
.hero{background:var(--grad);color:#fff;border-radius:var(--r-l);padding:22px 24px;
  box-shadow:var(--shadow-lift);position:relative;overflow:hidden;margin-bottom:18px}
.hero::after{content:"";position:absolute;right:-58px;top:-72px;width:210px;height:210px;
  border-radius:50%;background:rgba(255,255,255,.09)}
.hero::before{content:"";position:absolute;right:26px;bottom:-96px;width:170px;height:170px;
  border-radius:50%;background:rgba(255,255,255,.07)}
.hero .lb{font-size:.78rem;color:rgba(255,255,255,.75);margin-bottom:3px;position:relative;z-index:1}
.hero .big{font-size:2.7rem;font-weight:720;letter-spacing:-.035em;line-height:1;
  font-variant-numeric:tabular-nums;position:relative;z-index:1}
.hero .big small{font-size:1.05rem;font-weight:560;opacity:.72;letter-spacing:0}
.hero .foot{display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;position:relative;z-index:1}
.hero .foot div{font-size:.76rem;color:rgba(255,255,255,.75)}
.hero .foot b{display:block;font-size:1.02rem;color:#fff;font-weight:660;font-variant-numeric:tabular-nums}
.hero-in{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;position:relative;z-index:1}
.hero-spark{flex:0 0 42%;max-width:420px;display:none}
.hero-spark svg{width:100%;height:88px;display:block;overflow:visible}
.hero-spark .cap{font-size:.72rem;color:rgba(255,255,255,.7);margin-top:6px;text-align:right}
@media (min-width:901px){.hero-spark{display:block}}

/* ---------- Coach : jauge, à-faire, recommandation, axes ---------- */
.jauge{position:relative;height:8px;border-radius:999px;
  background:linear-gradient(90deg,rgba(255,255,255,.85),rgba(255,255,255,.5) 45%,rgba(255,255,255,.25))}
.jauge i{position:absolute;top:-5px;width:18px;height:18px;border-radius:50%;background:#fff;
  transform:translateX(-9px);box-shadow:0 2px 8px rgba(0,0,0,.28)}
.todo-card{padding:6px 16px}
.todo{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo .mark{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  border:2px solid var(--line-2);color:transparent;font-size:.8rem;font-weight:800}
.todo.ok .mark{background:var(--vert);border-color:var(--vert);color:#fff}
.todo.ok b{color:var(--ink-2)}
.reco{border-left:4px solid var(--moss)}
.pourquoi{background:var(--moss-soft);border-radius:var(--r-s);padding:11px 14px;margin-top:10px}
.pourquoi b{font-size:.78rem;color:var(--moss);font-weight:660}
.priorite{border-left:4px solid var(--ochre)}
.lien-expl{background:none;border:0;color:var(--moss);font-size:.81rem;font-weight:600;cursor:pointer;
  padding:10px 0 0;text-decoration:underline;text-underline-offset:3px}
.axes{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.axes{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .axe{padding:13px 14px}}
.axe{background:var(--surface);border:0;border-radius:var(--r-m);padding:15px 16px;box-shadow:var(--shadow);
  cursor:pointer;text-align:left;width:100%;display:block;transition:transform .1s}
.axe:hover{transform:translateY(-2px)}
.axe .spread{flex-wrap:nowrap;gap:8px}
.axe .spread b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.95rem}
.axe .progress i{background:var(--ink-3)}
.axe.bon .progress i{background:var(--vert)}
.axe.moyen .progress i{background:var(--grad)}
.axe.bas .progress i{background:var(--ochre)}
.axe.critique .progress i{background:var(--rouge)}
.axe.bon .num{color:var(--vert)} .axe.bas .num{color:var(--ochre)} .axe.critique .num{color:var(--rouge)}

/* ---------- Tuiles d'accès rapide ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--surface);border:0;border-radius:var(--r-m);padding:15px 8px 13px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:9px;box-shadow:var(--shadow);
  font-size:.74rem;font-weight:600;color:var(--ink-2);text-align:center;line-height:1.25;transition:transform .1s}
.tile .i{width:46px;height:46px;border-radius:16px;background:var(--moss-soft);color:var(--moss);
  display:grid;place-items:center}
.tile .i .ico-svg{width:23px;height:23px}
.tile.accent .i{background:var(--grad);color:#fff;box-shadow:var(--shadow-lift)}
.tile:active{transform:scale(.96)}
@media (min-width:901px){.tiles{grid-template-columns:repeat(6,minmax(0,1fr))} .desk-hide{display:none}}

/* ---------- Boutons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--moss);color:#fff;border:0;
  padding:11px 19px;border-radius:999px;cursor:pointer;font-size:.87rem;font-weight:600;
  box-shadow:var(--shadow-lift);transition:transform .08s
}
.btn:hover{background:var(--moss-deep)}
.btn:active{transform:scale(.97)}
html[data-theme="sombre"] .btn{color:#0C1024}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:none;border:1px solid var(--line-2)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--moss);color:var(--moss)}
.btn.danger{background:var(--rouge);box-shadow:none}
.btn.sm{padding:7px 14px;font-size:.79rem}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.icon-btn{background:var(--surface-2);border:0;border-radius:12px;width:36px;height:36px;
  display:inline-grid;place-items:center;cursor:pointer;color:var(--ink-2);font-size:.95rem;padding:0}
.icon-btn:hover{background:var(--surface-3);color:var(--ink)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:.74rem;font-weight:600;
  background:var(--surface-3);color:var(--ink-2)}
.pill.moss{background:var(--moss-soft);color:var(--moss)}
.pill.sky{background:var(--sky-soft);color:var(--sky)}
.pill.ochre{background:var(--ochre-soft);color:var(--ochre)}
.pill.rouge{background:var(--rouge-soft);color:var(--rouge)}
.pill.vert{background:var(--vert-soft);color:var(--vert)}
.ico-svg{width:1.35em;height:1.35em;display:block;flex:0 0 auto}
.x-mini{background:none;border:0;color:inherit;cursor:pointer;padding:0 0 0 3px;font-size:.9em;line-height:1;opacity:.6}
.x-mini:hover{opacity:1}

/* ---------- Formulaires ---------- */
label.f{display:block;margin-bottom:13px}
label.f > span{display:block;font-size:.78rem;color:var(--ink-2);margin-bottom:5px;font-weight:600}
label.f .hint{font-weight:400;color:var(--ink-3)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],input[type=email],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:14px;
  padding:11px 13px;font-size:.88rem
}
input:focus,select:focus,textarea:focus{border-color:var(--moss);background:var(--surface);outline:none}
html[data-theme="sombre"] input,html[data-theme="sombre"] select,html[data-theme="sombre"] textarea{background:var(--surface-2)}
textarea{min-height:80px;resize:vertical;line-height:1.5}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--moss)}
input[type=range]{width:100%;accent-color:var(--moss)}
.inline-check{display:flex;align-items:center;gap:9px;font-size:.86rem;margin-bottom:9px;cursor:pointer}

table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;font-weight:640;color:var(--ink-3);padding:9px 10px;border-bottom:1px solid var(--line);font-size:.76rem}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

.empty{background:var(--surface);border-radius:var(--r-m);padding:34px 22px;text-align:center;color:var(--ink-2);box-shadow:var(--shadow)}
.empty h3{margin-bottom:6px}

/* ---------- Échelle émotionnelle ---------- */
.scale{position:relative;height:12px;border-radius:999px;overflow:hidden;
  background:linear-gradient(90deg,#4B62F0 0%,#2E9BD6 32%,#E8901B 66%,#EF4E62 100%)}
.scale .mk{position:absolute;top:-4px;width:5px;height:20px;background:var(--surface);border-radius:3px;
  box-shadow:0 0 0 2px var(--ink);transform:translateX(-2.5px)}
.scale-legend{display:flex;justify-content:space-between;font-size:.71rem;color:var(--ink-3);margin-top:6px}
.emo-input{margin-bottom:14px}
.emo-input > span{display:block;font-size:.78rem;color:var(--ink-2);margin-bottom:5px;font-weight:600}
.emo-input .val{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem;color:var(--moss)}

/* ---------- KPI ---------- */
.kpi{background:var(--surface);border:0;border-radius:var(--r-m);padding:16px 17px;box-shadow:var(--shadow)}
.kpi .k{font-size:.75rem;color:var(--ink-3);margin-bottom:5px}
.kpi .v{font-size:1.75rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.05}
.kpi .u{font-size:.8rem;font-weight:560;color:var(--ink-3);margin-left:4px}
.kpi .d{font-size:.74rem;margin-top:6px;font-weight:560}
.up{color:var(--vert)} .down{color:var(--rouge)} .flat{color:var(--ink-3)}

/* ---------- Graphiques ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 5}
.chart .ax{fill:var(--ink-3);font-size:10px;font-family:var(--sans);font-weight:500}
.chart .ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chart .pt{stroke:var(--surface);stroke-width:2}
.chart .last{stroke:var(--surface);stroke-width:3.5}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--ink-2);margin-top:10px}
.chart-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}

/* ---------- Segments ---------- */
.seg{display:inline-flex;background:var(--surface-3);border-radius:999px;padding:4px;gap:2px}
.seg button{background:none;border:0;padding:7px 16px;font-size:.81rem;cursor:pointer;color:var(--ink-2);
  border-radius:999px;font-weight:560;white-space:nowrap;flex:0 0 auto}
.seg button.on{background:var(--surface);color:var(--moss);font-weight:660;box-shadow:var(--shadow)}
html[data-theme="sombre"] .seg button.on{background:var(--moss);color:#0C1024}

/* ---------- Fiches exercices ---------- */
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-left:-16px;
  margin-right:-16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chips .chip{flex:0 0 auto}
@media (min-width:901px){.chips{flex-wrap:wrap;overflow:visible;margin:0;padding-left:0;padding-right:0}}
.chip{white-space:nowrap;background:var(--surface);border:0;color:var(--ink-2);padding:8px 15px;
  border-radius:999px;font-size:.81rem;cursor:pointer;font-weight:560;box-shadow:var(--shadow)}
.chip:hover{color:var(--moss)}
.chip.on{background:var(--grad)!important;color:#fff;font-weight:640;box-shadow:var(--shadow-lift)}
.exo-list{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.exo{background:var(--surface);border:0;border-radius:var(--r-m);padding:17px;display:flex;flex-direction:column;
  gap:10px;cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:transform .1s}
.exo:hover{transform:translateY(-2px)}
.exo:active{transform:scale(.99)}
.exo h3{font-size:.97rem}
.exo .meta{display:flex;gap:6px;flex-wrap:wrap}
.exo .bar{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin-top:2px}
.exo .bar i{display:block;height:100%;background:var(--grad);border-radius:999px}

/* ---------- Onboarding : choix ---------- */
.choix{display:flex;flex-wrap:wrap;gap:9px}
.choix.col{flex-direction:column}
.opt{background:var(--surface);border:1.5px solid var(--line-2);border-radius:999px;padding:11px 18px;
  cursor:pointer;font-size:.88rem;font-weight:560;color:var(--ink-2);text-align:left;transition:transform .09s}
.choix.col .opt{border-radius:var(--r-m);width:100%}
.opt:active{transform:scale(.97)}
.opt.on{background:var(--moss-soft);border-color:var(--moss);color:var(--moss-deep);font-weight:640}
html[data-theme="sombre"] .opt.on{color:var(--moss)}

/* ---------- Objectif de la semaine + exercice du jour ---------- */
.objectif{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow);
  padding:20px 22px;margin-bottom:26px;border-top:4px solid var(--moss)}
.obj-head{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.objectif .lb{font-size:.73rem;color:var(--ink-3);font-weight:600}
.obj-score{text-align:right;line-height:1.1;flex:0 0 auto}
.obj-score b{font-size:1.7rem;font-weight:720;letter-spacing:-.03em}
.obj-score span{display:block;font-size:.72rem;color:var(--ink-3)}
.obj-score.ok b{color:var(--moss)} .obj-score.bas b{color:var(--ochre)}
.obj-exo{background:var(--surface-2);border-radius:var(--r-m);padding:17px 18px;margin-top:16px}
.btn.gros{padding:14px 26px;font-size:.95rem}
.axe .fl{font-size:.85rem;margin-left:2px;opacity:.75}
.axe .verdict{font-size:.76rem;font-weight:700;color:var(--ink-3);white-space:nowrap}
.axe.bon .verdict{color:var(--vert)} .axe.moyen .verdict{color:var(--moss)}
.axe.bas .verdict{color:var(--ochre)} .axe.critique .verdict{color:var(--rouge)}

/* ---------- Exercice guidé ---------- */
.guide{position:fixed;inset:0;z-index:130;background:var(--paper);display:flex;flex-direction:column}
.guide-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 8px}
.guide-mid{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:20px 22px}
.guide-foot{display:flex;gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);background:var(--surface)}
.guide-foot .btn{flex:1}
.guide-step{font-size:.76rem;color:var(--moss);font-weight:660;letter-spacing:.02em;margin-bottom:14px}
.guide-consigne{font-size:1.35rem;line-height:1.45;font-weight:560;max-width:22ch;margin:0;letter-spacing:-.01em}
.guide-jauge{height:4px;background:var(--surface-3)}
.guide-jauge i{display:block;height:100%;background:var(--grad);transition:width .28s ease}
.guide-meta{display:flex;gap:26px;justify-content:center;margin-top:22px}
.guide-meta div{text-align:center}
.guide-meta b{display:block;font-size:1.05rem;font-weight:680}
.guide-meta span{font-size:.72rem;color:var(--ink-3)}
.compteur{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;max-width:340px;
  padding:13px 0;border-bottom:1px solid var(--line)}
.compteur .lb{font-size:.9rem;font-weight:560}
.pm{display:flex;align-items:center;gap:14px}
.pm button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);
  font-size:1.3rem;line-height:1;cursor:pointer;color:var(--ink-2)}
.pm button:active{transform:scale(.92);background:var(--moss-soft)}
.pm b{min-width:34px;text-align:center;font-size:1.5rem;font-variant-numeric:tabular-nums;font-weight:720}
.rond{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;
  border:9px solid var(--moss-soft);color:var(--moss)}
.rond b{font-size:2.6rem;font-weight:720;letter-spacing:-.04em;line-height:1}
.rond span{font-size:.85rem;color:var(--ink-3)}
.rond.bon{border-color:var(--vert-soft);color:var(--vert)}
.rond.moyen{border-color:var(--ochre-soft);color:var(--ochre)}
.rond.bas{border-color:var(--rouge-soft);color:var(--rouge)}

/* ---------- Boîte de confirmation ---------- */
.dialog-mask{position:fixed;inset:0;z-index:150;background:rgba(14,20,45,.5);
  display:flex;align-items:center;justify-content:center;padding:20px}
.dialog{background:var(--surface);border-radius:var(--r-l);padding:24px;width:min(420px,100%);
  box-shadow:0 24px 60px -20px rgba(14,20,45,.6)}
.dialog h3{font-size:1.15rem}

/* ---------- Panneau latéral ---------- */
.sheet-mask{position:fixed;inset:0;background:rgba(14,20,45,.42);z-index:60;display:flex;justify-content:flex-end}
.sheet{background:var(--paper);width:min(680px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow)}
.sheet-head{position:sticky;top:0;background:var(--paper);padding:16px 18px 14px;z-index:2;display:flex;gap:12px;
  align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line)}
.sheet-body{padding:18px 18px 70px}
.sheet-body h4{margin:20px 0 8px;color:var(--ink)}
.sheet-body ol,.sheet-body ul{margin:0 0 4px;padding-left:20px}
.sheet-body li{margin-bottom:6px}
@media (max-width:900px){
  .sheet-mask{align-items:flex-end}
  .sheet{width:100%;height:94%;border-radius:var(--r-xl) var(--r-xl) 0 0}
  .sheet-head{border-radius:var(--r-xl) var(--r-xl) 0 0}
}
.branch{border-left:3px solid var(--line-2);padding:12px 0 12px 14px;margin-bottom:11px;background:var(--surface);
  border-radius:0 var(--r-s) var(--r-s) 0}
.branch.ok{border-left-color:var(--vert)}
.branch.ko{border-left-color:var(--ochre)}
.branch h4{margin:0 0 5px}
.palier{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.palier:last-child{border-bottom:0}
.palier .n{flex:0 0 28px;height:28px;border-radius:10px;background:var(--surface-3);display:grid;place-items:center;
  font-size:.79rem;font-weight:700;color:var(--ink-2)}
.palier.done .n{background:var(--grad);color:#fff}

/* ---------- Listes ---------- */
.log-item{background:var(--surface);border:0;border-radius:var(--r-m);padding:15px 17px;box-shadow:var(--shadow)}
.log-item + .log-item{margin-top:11px}
.log-head{display:flex;gap:9px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.stat-line{display:flex;gap:15px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);margin-top:9px}
.stat-line b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:660}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--nav-h));transform:translateX(-50%);background:var(--ink);
  color:var(--paper);padding:12px 20px;border-radius:999px;font-size:.85rem;z-index:200;box-shadow:var(--shadow);
  max-width:92vw;text-align:center}

/* ---------- Bouton d'action principal ---------- */
.fab{position:fixed;right:20px;bottom:20px;z-index:55;border-radius:999px;padding:14px 22px;font-size:.92rem}
.fab .fi{display:none}
@media (min-width:901px){.fab{display:none}}
@media (max-width:900px){
  .fab{left:50%;right:auto;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));
    width:60px;height:60px;padding:0;border:4px solid var(--paper);box-shadow:0 8px 20px -6px rgba(75,98,240,.6)}
  .fab .fi{display:block}
  .fab .fi .ico-svg{width:26px;height:26px;stroke-width:2}
  .fab .ft{display:none}
  .fab:active{transform:translateX(-50%) scale(.94)}
  .fab.actif{width:auto;min-width:76px;padding:0 16px;border-radius:999px}
  .fab.actif .ft{display:inline;font-size:.9rem;font-weight:700;font-variant-numeric:tabular-nums;margin-left:6px}
  .fab.actif .fi .ico-svg{width:19px;height:19px}
  @media (prefers-reduced-motion:no-preference){
    .fab.actif{animation:pulse 2.4s ease-in-out infinite}
  }
  @keyframes pulse{0%,100%{box-shadow:0 8px 20px -6px rgba(75,98,240,.6)}
    50%{box-shadow:0 8px 26px -4px rgba(75,98,240,.95)}}
}

details.acc{border:0;border-radius:var(--r-m);background:var(--surface);padding:14px 17px;margin-bottom:11px;box-shadow:var(--shadow)}
details.acc summary{cursor:pointer;font-weight:640;font-size:.92rem;list-style:none;display:flex;align-items:center;gap:9px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::before{content:"+";color:var(--moss);font-weight:700;width:21px;height:21px;border-radius:7px;
  background:var(--moss-soft);display:grid;place-items:center;font-size:.85rem;flex:0 0 auto}
details.acc[open] summary::before{content:"–"}
details.acc .in{padding-top:14px}
.badge-dot{width:8px;height:8px;border-radius:99px;display:inline-block}
.progress{height:9px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.progress i{display:block;height:100%;background:var(--grad);border-radius:999px;transition:width .3s}
.warn-row{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.warn-row:last-child{border-bottom:0}
code.k{background:var(--surface-3);border-radius:6px;padding:2px 6px;font-family:var(--mono);font-size:.82em}

/* ---------- Photo et avatar ---------- */
.avatar{border-radius:20px;background:var(--moss-soft);display:grid;place-items:center;overflow:hidden;flex:0 0 auto}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.sm{width:40px;height:40px;border-radius:14px;font-size:20px}
.avatar.md{width:58px;height:58px;font-size:28px}
.avatar.lg{width:104px;height:104px;border-radius:30px;font-size:48px;box-shadow:var(--shadow-lift)}
.photo-pick{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.photo-pick .col{display:flex;flex-direction:column;gap:8px;align-items:flex-start}

/* ---------- Mode terrain ---------- */
.terrain{position:fixed;inset:0;z-index:120;background:var(--paper);display:flex;flex-direction:column}
.terrain-head{background:var(--grad);color:#fff;border-radius:0 0 var(--r-xl) var(--r-xl);
  padding:calc(16px + env(safe-area-inset-top,0px)) 20px 20px;display:flex;gap:12px;
  align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:var(--shadow-lift)}
.terrain-head .icon-btn{background:rgba(255,255,255,.18);color:#fff}
.terrain-head .btn.ghost{background:rgba(255,255,255,.18);color:#fff;border:0}
.terrain-head .btn.ghost:hover{background:rgba(255,255,255,.3);color:#fff}
.chrono{font-variant-numeric:tabular-nums;font-size:2.5rem;font-weight:720;letter-spacing:-.04em;line-height:1.05}
.chrono.pause{opacity:.6}
.chrono-sub{font-size:.77rem;color:rgba(255,255,255,.78)}
.terrain-body{flex:1;overflow-y:auto;padding:18px 16px 34px;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain}
.terrain-foot{background:var(--surface);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.terrain-foot .btn{flex:1}
.tsec{font-size:.79rem;color:var(--ink-2);font-weight:640;margin:20px 0 10px}
.tsec:first-child{margin-top:0}
.tgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.tap{background:var(--surface);border:0;border-radius:var(--r-m);padding:13px 15px;cursor:pointer;
  text-align:left;display:flex;flex-direction:column;gap:4px;min-height:76px;justify-content:center;
  user-select:none;transition:transform .08s;box-shadow:var(--shadow)}
.tap:active{transform:scale(.95)}
.tap .lb{font-size:.8rem;color:var(--ink-2);font-weight:560;line-height:1.25}
.tap .ct{font-size:1.6rem;font-weight:720;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.03em}
.tap.hit{background:var(--moss-soft)}
.tap.moss .ct{color:var(--moss)}
.tap.rouge .ct{color:var(--rouge)}
.tap.wide{grid-column:1/-1;min-height:66px;flex-direction:row;align-items:center;justify-content:space-between}
.tap .ct .ico-svg{width:26px;height:26px;color:var(--moss)}
.tap.big{background:var(--grad);color:#fff;box-shadow:var(--shadow-lift)}
.tap.big .lb,.tap.big .ct{color:#fff}
.livebar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:var(--grad);color:#fff;border-radius:var(--r-m);padding:13px 17px;margin-bottom:18px;box-shadow:var(--shadow-lift)}
.livebar b{font-variant-numeric:tabular-nums}
.livebar .btn{background:rgba(255,255,255,.22);box-shadow:none;color:#fff}
.livebar .btn:hover{background:rgba(255,255,255,.34)}
.livebar .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff}

/* ---------- Carte du parcours ----------
   Le bloc prend la largeur de son conteneur et impose son ratio : plus aucune
   mesure de la fenêtre, donc plus de débordement sur les blocs voisins. */
.carte{position:relative;width:100%;overflow:hidden;border-radius:var(--r-l);
  background:var(--surface-2);margin:14px 0;
  box-shadow:0 1px 2px rgba(30,42,95,.06), 0 14px 34px -20px rgba(30,42,95,.45), inset 0 0 0 1px var(--line)}
.carte.sans-fond{background:var(--moss-soft)}
.carte-in{position:absolute;inset:0}
.carte .tuile{position:absolute;user-select:none;pointer-events:none;
  filter:saturate(1.15) brightness(1.03) contrast(1.02)}
/* Voile minimal : juste de quoi rattacher la carte à la palette, sans l'éteindre */
.carte-in::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:var(--moss);opacity:.05;mix-blend-mode:multiply}
html[data-theme="sombre"] .carte{background:#161B2E;box-shadow:inset 0 0 0 1px var(--line)}
html[data-theme="sombre"] .carte .tuile{filter:invert(1) hue-rotate(180deg) saturate(.85) brightness(.82) contrast(.95)}
html[data-theme="sombre"] .carte-in::after{opacity:.22;mix-blend-mode:screen;background:#26325E}
.carte svg{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.carte .trace-fond{opacity:.9}
html[data-theme="sombre"] .carte .trace-fond{stroke:#0D1020}
.carte-pied{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;gap:10px;
  justify-content:space-between;align-items:flex-end;padding:16px 18px;
  background:linear-gradient(transparent,rgba(255,255,255,.94) 60%)}
.carte-pied .stats{display:flex;flex-direction:column;line-height:1.1}
.carte-pied .s1{font-size:1.9rem;font-weight:760;letter-spacing:-.045em;color:var(--ink);
  font-variant-numeric:tabular-nums}
.carte-pied .s1 small{font-size:.85rem;font-weight:620;color:var(--ink-3);letter-spacing:0;margin-left:2px}
.carte-pied .s2{font-size:.76rem;font-weight:560;color:var(--ink-3);margin-top:2px}
html[data-theme="sombre"] .carte-pied{background:linear-gradient(transparent,rgba(13,16,32,.94) 60%)}
html[data-theme="sombre"] .carte-pied .s1{color:#fff}
.carte-live-badge{position:absolute;top:14px;left:14px;z-index:3;display:flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.94);color:var(--ink);border-radius:999px;padding:6px 13px 6px 10px;
  font-size:.72rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;
  box-shadow:0 4px 14px -6px rgba(30,42,95,.5)}
html[data-theme="sombre"] .carte-live-badge{background:rgba(23,27,46,.94);color:#fff}
.carte.gestes{touch-action:none;cursor:grab}
.carte.gestes:active{cursor:grabbing}
.carte.gestes .carte-in{will-change:transform}
.carte-outils{position:absolute;top:12px;right:12px;z-index:4;display:flex;flex-direction:column;gap:7px}
.carte-outils button{width:38px;height:38px;border-radius:13px;border:0;cursor:pointer;
  background:rgba(255,255,255,.94);color:var(--ink);font-size:1.05rem;font-weight:700;
  display:grid;place-items:center;box-shadow:0 4px 14px -6px rgba(30,42,95,.55)}
.carte-outils button:active{transform:scale(.92)}
html[data-theme="sombre"] .carte-outils button{background:rgba(23,27,46,.94);color:#fff}
.carte-live-badge i{width:8px;height:8px;border-radius:50%;background:var(--rouge);flex:0 0 auto}
@media (prefers-reduced-motion:no-preference){
  .carte-live-badge i{animation:battement 1.6s ease-in-out infinite}
}
@keyframes battement{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
.carte .trace-anim{filter:drop-shadow(0 2px 5px rgba(75,98,240,.45))}
.carte-pied .attr{font-weight:400;color:var(--ink-3);font-size:.66rem;display:none}
.carte.avec-tuiles .carte-pied .attr{display:inline}
.carte .pas{fill:#fff;opacity:.95}
.carte .pas-semis{filter:drop-shadow(0 1px 2.5px rgba(20,26,51,.5))}
html[data-theme="sombre"] .carte .pas{fill:#0D1020;opacity:.9}
@media (prefers-reduced-motion:no-preference){
  .carte.animable .pas{animation:poser .3s ease-out both}
}
@keyframes poser{from{opacity:0;transform:scale(.4)}to{opacity:.95;transform:none}}
.carte .pos-pt{filter:drop-shadow(0 2px 6px rgba(30,42,95,.55))}
@media (prefers-reduced-motion:no-preference){
  .carte .pos-halo{animation:respire 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
}

/* ---------- Balade : quatre grandes cibles ---------- */
.gros-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gros-grid .tap-wrap{min-width:0}
.gros-tap{min-height:112px;padding:16px 14px;gap:6px}
.gros-tap .ct{font-size:2.2rem}
.gros-tap .lb{font-size:.88rem;font-weight:640;color:var(--ink);white-space:normal;overflow-wrap:anywhere}
.intensite{position:fixed;left:0;right:0;bottom:0;z-index:135;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  .intensite{animation:monte .18s cubic-bezier(.22,.61,.36,1) both}
  .intensite.sort{animation:monte .16s reverse both}
}
@keyframes monte{from{opacity:0;transform:translate3d(0,26px,0)}to{opacity:1;transform:none}}
.int-in{background:var(--ink);color:var(--paper);border-radius:var(--r-l);padding:14px 18px;
  display:flex;align-items:center;gap:16px;pointer-events:auto;box-shadow:var(--shadow)}
.int-in .lb{font-size:.86rem;font-weight:600;white-space:nowrap}
.int-row{display:flex;gap:8px}
.int-row button{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.14);
  color:var(--paper);font-size:1rem;font-weight:700;cursor:pointer}
.int-row button:active{transform:scale(.9);background:var(--moss)}
.fin-ligne{margin-bottom:22px}
.fin-ligne input[type=range]{margin:4px 0 2px}

/* ---------- Préparation du signal ---------- */
.prep{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  flex:1;padding:24px 22px;gap:4px}
.viseur{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;margin-bottom:20px;
  background:var(--moss-soft);color:var(--moss);position:relative}
.viseur .ico-svg{width:42px;height:42px}
@media (prefers-reduced-motion:no-preference){
  .viseur.cherche::after{content:"";position:absolute;inset:-8px;border-radius:50%;
    border:2px solid var(--moss);animation:onde 1.5s ease-out infinite}
}
@keyframes onde{from{transform:scale(.85);opacity:.7}to{transform:scale(1.25);opacity:0}}
.viseur.pret{background:var(--vert-soft);color:var(--vert)}
.prep .etat{font-size:1.15rem;font-weight:700;letter-spacing:-.02em}
.prep .detail{font-size:.86rem;color:var(--ink-2);max-width:32ch}
.prep.avec-carte{justify-content:flex-start;padding-top:8px}
.prep.avec-carte .etat{margin-top:6px}
.carte .halo{animation:respire 2.2s ease-in-out infinite}
@keyframes respire{0%,100%{opacity:.16;transform:scale(.9)}50%{opacity:.3;transform:scale(1.1)}}
.carte .halo{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){.carte .halo{animation:none}}

/* ---------- Compteurs : correction d'un tap ---------- */
.tap-wrap{position:relative;display:flex}
.tap-wrap .tap{flex:1;padding-right:34px}
.tap-moins{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:10px;border:0;
  background:var(--surface-3);color:var(--ink-3);font-size:1.05rem;line-height:1;cursor:pointer;
  display:grid;place-items:center;padding:0;z-index:2}
.tap-moins:hover{background:var(--rouge-soft);color:var(--rouge)}
.tap-moins:active{transform:scale(.9)}
.tap.undo{background:var(--rouge-soft)}

/* ---------- Fiches mises en priorité ---------- */
.etoile{margin-left:auto;font-size:1.05rem;line-height:1;color:var(--ink-3);cursor:pointer;
  padding:2px 4px;border-radius:8px}
.etoile:hover{color:var(--ochre)}
.etoile.on{color:var(--ochre)}
.exo.epingle{box-shadow:var(--shadow), inset 3px 0 0 var(--ochre)}

/* ---------- Dictionnaire des ordres ---------- */
.ordre{background:var(--surface);border:0;border-radius:var(--r-m);padding:16px 17px;
  display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%;
  box-shadow:var(--shadow);transition:transform .1s}
.ordre:hover{transform:translateY(-2px)}
.ordre .mot{font-size:1.2rem;font-weight:720;letter-spacing:-.02em}
.ordre .sens{font-size:.83rem;color:var(--ink-2)}
.who{display:flex;gap:5px;flex-wrap:wrap}
.who span{font-size:.71rem;padding:3px 9px;border-radius:999px;background:var(--moss-soft);color:var(--moss);font-weight:600}
.who span.off{background:var(--surface-3);color:var(--ink-3);font-weight:400}
.alert{border-left:3px solid var(--ochre);background:var(--ochre-soft);border-radius:0 var(--r-s) var(--r-s) 0;
  padding:12px 15px;margin-bottom:10px;font-size:.85rem}
.alert.bad{border-left-color:var(--rouge);background:var(--rouge-soft)}
.alert b{font-weight:660}
.frigo td:first-child{font-weight:700;font-size:1rem;white-space:nowrap}

@media print{
  .side,.topbar,.fab,.botnav,.no-print,.terrain,.livebar{display:none!important}
  body{background:#fff}
  .view{padding:0;max-width:none}
  .card,.kpi,.log-item,.exo,.ordre,.empty{break-inside:avoid;box-shadow:none;border:1px solid #ddd}
  .hero{background:#fff!important;color:#000;box-shadow:none;border:1px solid #ddd}
  .hero .lb,.hero .foot div{color:#444}
  .hero .big,.hero .foot b{color:#000}
  html.sheet-open .app{display:none}
  html.sheet-open .sheet-mask{position:static;background:none;display:block}
  html.sheet-open .sheet{width:100%;height:auto;overflow:visible;box-shadow:none;background:#fff}
  html.sheet-open .sheet-head{position:static;border-bottom:2px solid #000;border-radius:0}
  html.sheet-open .sheet-head .row{display:none}
  html.sheet-open .sheet-body{padding:0}
}
