 obj:"Récompenser le chien chaque fois qu'il choisit, seul, de te regarder.",
 why:"Le regard offert est la base de la connexion : c'est ce qui rend le rappel possible plus tard.",
 mat:["Friandises"], duree:"2 à 5 min",
 env:"Maison, puis jardin, puis rue calme",
 etapes:["Reste immobile, friandises en poche, sans parler ni bouger.",
   "Attends. Ne prononce pas son nom.",
   "Dès qu'il tourne les yeux vers toi : marque (« oui ! ») et récompense.",
   "Laisse-le repartir, recommence.",
   "10 répétitions maximum par séance."],
 paliers:[{n:1,t:"Maison, sans distraction",crit:"10 regards en 3 min"},
   {n:2,t:"Jardin",crit:"10 regards en 5 min"},
   {n:3,t:"Rue calme, en laisse",crit:"8 regards sur 10 essais"},
   {n:4,t:"Rue passante",crit:"Il te regarde après avoir vu un stimulus"},
   {n:5,t:"Devant un chien au loin",crit:"Il décroche du chien pour te regarder, seul"}],
 ok:["Change d'environnement, pas de difficulté d'exercice.",
   "Récompense plus fort dans les environnements durs."],
 ko:["Aucun regard en 2 min : environnement trop dur, recule.",
   "Il fixe la poche : cache les friandises dans le dos ou une pochette."],
 err:["Appeler son nom : le but est le regard offert, pas le regard demandé.",
   "Agiter la friandise pour attirer le regard."],
 stop:[]},

{id:'jeu-controle', t:"Le jeu contrôlé", cat:'emo', ch:2, mode:'taux',
 obj:"Alterner quelques secondes de jeu et un retour au calme, pour apprendre à redescendre.",
 why:"Beaucoup de chiens savent monter mais pas redescendre. C'est la compétence qui manque le plus souvent.",
 mat:["Un jouet de traction (boudin, corde)"], duree:"5 min",
 env:"Maison ou jardin",
 etapes:["Joue 10 à 15 secondes, franchement.",
   "Arrête net : immobilise le jouet, cesse de bouger, silence.",
   "Attends le retour au calme (il lâche, s'assoit, souffle).",
   "Dès le calme : relance le jeu — le calme est ce qui redémarre le jeu.",
   "5 à 8 cycles, puis range le jouet."],
 paliers:[{n:1,t:"Retour au calme en 30 s",crit:"5 cycles sur 5 réussis"},
   {n:2,t:"Retour au calme en 15 s",crit:"5 cycles sur 5"},
   {n:3,t:"Il lâche seul à l'arrêt",crit:"4 cycles sur 5"},
   {n:4,t:"Cycles en extérieur calme",crit:"5 cycles réussis dehors"},
   {n:5,t:"Cycles en extérieur avec passage",crit:"4 cycles sur 5 dehors, en présence d'autres"}],
 ok:["Raccourcis le temps de jeu et allonge le temps de calme.",
   "Emporte le jeu dehors."],
 ko:["Il ne redescend jamais : le jouet est trop excitant, prends-en un plus neutre.",
   "Il saute sur toi à l'arrêt : tourne-toi, jouet contre le ventre, attends."],
 err:["Continuer à parler pendant la phase d'arrêt.",
   "Terminer sur un pic d'excitation : finis toujours sur du calme."],
 stop:["Grognement crispé, pupilles dilatées, corps raide : arrête la séance."]},

{id:'recompense-differee', t:"La récompense différée", cat:'emo', ch:2, mode:'duree',
 obj:"Montrer une récompense, attendre quelques secondes de calme, puis la donner.",
 why:"Développe la patience et l'autocontrôle, sans mettre le chien en échec.",
 mat:["Friandises"], duree:"3 min",
 env:"Maison",
 etapes:["Montre la friandise dans la main fermée.",
   "Attends 2 secondes de calme. Donne.",
   "Répète en augmentant : 3 s, 5 s, 8 s, 12 s.",
   "S'il saute ou aboie : ferme la main, attends, recommence au palier précédent.",
   "Termine toujours sur une réussite."],
 paliers:[{n:1,t:"3 secondes",crit:"5 réussites sur 5"},
   {n:2,t:"8 secondes",crit:"4 sur 5"},
   {n:3,t:"15 secondes",crit:"4 sur 5"},
   {n:4,t:"30 secondes",crit:"4 sur 5"},
   {n:5,t:"Friandise posée au sol, 15 s",crit:"Il attend sans la prendre"}],
 ok:["Ajoute 50 % de durée.",
   "Passe à la friandise visible au sol."],
 ko:["Redescends au palier précédent et fais 5 réussites avant de remonter.",
   "Baisse la valeur de la friandise."],
 err:["Augmenter trop vite : chaque échec renforce l'impatience.",
   "Le gronder : ça ajoute de la tension à un exercice de calme."],
 stop:[]},

{id:'marche-redescente', t:"La marche de redescente", cat:'bal', ch:2, mode:'duree',
 obj:"Ralentir volontairement la fin de balade, laisser du temps au flair, réduire les sollicitations.",
 why:"Beaucoup de chiens redescendent naturellement grâce à un rythme plus lent. Ça conditionne le retour au calme à la maison.",
 mat:["Longe ou laisse détendue"], duree:"10 min",
 env:"Fin de balade, retour vers la maison",
 etapes:["À 10 minutes de la maison, ralentis nettement le pas.",
   "Laisse-le renifler tout ce qu'il veut, sans le presser.",
   "Aucun ordre, aucun jeu, aucune balle.",
   "Parle peu, à voix basse.",
   "Note son état émotionnel à l'arrivée."],
 paliers:[{n:1,t:"10 min de ralenti",crit:"Il renifle plus qu'il ne marche"},
   {n:2,t:"Note de fin ≤ 4/10",crit:"3 balades d'affilée"},
   {n:3,t:"Note de fin ≤ 3/10",crit:"5 balades d'affilée"},
   {n:4,t:"Il se couche en rentrant",crit:"Dans les 10 min après le retour"},
   {n:5,t:"Redescente sans ralenti dédié",crit:"Il redescend seul en fin de balade"}],
 ok:["Note le temps de récupération à la maison : il devrait baisser.",
   "Applique le même principe après un jeu intense."],
 ko:["Il tire pour rentrer : fais des cercles, des allers-retours, ne rentre pas en ligne droite.",
   "La balade était trop intense : réduis le jeu en amont."],
 err:["Finir la balade sur une course ou un lancer de balle."],
 stop:[]},

/* ---------------------------------------------------------- CHAPITRE 3 */
{id:'croisement-calme', t:"Le croisement calme", cat:'soc', ch:3, mode:'taux',
 obj:"Croiser un chien à distance confortable, en récompensant le calme et les retours d'attention.",
 why:"L'objectif n'est pas d'empêcher le chien de regarder, mais qu'il puisse regarder sans perdre le contrôle.",
 mat:["Laisse 2 m ou longe","Friandises de haute valeur"], duree:"Sur la balade",
 env:"Chemin large, avec vue dégagée",
 etapes:["Repère le chien au loin, avant que le tien ne le fixe.",
   "Prends de la distance : trouve le point où il peut regarder sans exploser.",
   "Récompense chaque seconde de calme, et chaque regard vers toi.",
   "Reste en mouvement, laisse tomber la friandise au sol pour casser la fixation.",
   "Quand le chien est passé, éloigne-toi et note la distance qui a marché."],
 paliers:[{n:1,t:"50 m",crit:"Reste sous 5/10, 4 croisements sur 5"},
   {n:2,t:"30 m",crit:"4 sur 5"},
   {n:3,t:"15 m",crit:"4 sur 5, il te regarde au moins une fois"},
   {n:4,t:"8 m",crit:"4 sur 5, laisse détendue"},
   {n:5,t:"Croisement sur trottoir",crit:"4 sur 5, sans tirer ni fixer"}],
 ok:["Réduis la distance de 20 %, pas plus, à la séance suivante.",
   "Garde toujours une distance de secours possible."],
 ko:["Il explose : tu es trop près. Double la distance immédiatement.",
   "Il refuse la friandise : c'est le signe qu'il est au-dessus du seuil. Éloigne-toi.",
   "Fais 3 séances faciles avant de retenter la distance ratée."],
 err:["Tendre la laisse en anticipation : ça ajoute de la tension.",
   "Vouloir « l'habituer » en restant près malgré les signaux."],
 stop:["Aboiements en rafale, tension au bout de la laisse : coupe court, demi-tour."]},

{id:'banc-obs', t:"Le banc d'observation", cat:'soc', ch:3, mode:'duree',
 obj:"S'installer à distance d'un lieu fréquenté par des chiens et laisser observer, sans aucune interaction.",
 why:"C'est l'exercice qui développe le plus la gestion émotionnelle : le chien apprend que voir ≠ interagir.",
 mat:["Banc ou tapis","Friandises"], duree:"5 à 15 min",
 env:"Abord d'un parc à chiens, place, terrain de sport",
 etapes:["Installe-toi assez loin pour qu'il puisse regarder sans monter au-dessus de 5/10.",
   "Assieds-toi. Ne demande rien.",
   "Récompense le calme et les décrochages spontanés.",
   "Aucune rencontre. On regarde, on part.",
   "Note la distance et le temps tenu."],
 paliers:[{n:1,t:"5 min à 60 m",crit:"Reste sous 5/10"},
   {n:2,t:"10 min à 40 m",crit:"Il se couche au moins une fois"},
   {n:3,t:"10 min à 25 m",crit:"3 décrochages spontanés"},
   {n:4,t:"15 min à 15 m",crit:"Il soupire, se détend, ne fixe plus"},
   {n:5,t:"15 min à 10 m",crit:"Il s'installe seul en moins de 2 min"}],
 ok:["Rapproche-toi de 20 % maximum.",
   "Allonge la durée avant de réduire la distance : jamais les deux en même temps."],
 ko:["Recule jusqu'à retrouver un chien capable de manger.",
   "Choisis une heure plus calme.",
   "Sépare en 2 séances de 5 min."],
 err:["Finir par une rencontre : ça enseigne « regarder = obtenir ».",
   "Changer distance et durée dans la même séance."],
 stop:["Il ne mange plus, halète, ne peut pas s'asseoir : trop près."]},

{id:'rencontre-courte', t:"La rencontre courte", cat:'soc', ch:3, mode:'taux',
 obj:"Autoriser quelques secondes d'interaction et repartir avant que l'excitation ne monte.",
 why:"Toutes les rencontres n'ont pas besoin de durer. Repartir tôt évite les mauvaises expériences.",
 mat:["Laisse détendue ou lâcher en zone sûre"], duree:"5 à 15 s d'interaction",
 env:"Zone dégagée, avec un chien connu et bien codé",
 etapes:["Vérifie que l'autre chien est calme et que son humain est d'accord.",
   "Approche en courbe, jamais de face.",
   "Laisse 5 à 10 secondes de reniflage.",
   "Appelle joyeusement et éloigne-toi, récompense.",
   "Si tout est fluide, tu peux relancer une seconde fois."],
 paliers:[{n:1,t:"5 s puis départ",crit:"Il te suit sans résistance, 4 fois sur 5"},
   {n:2,t:"10 s puis départ",crit:"4 sur 5"},
   {n:3,t:"2 rencontres courtes dans la balade",crit:"Il redescend entre les deux"},
   {n:4,t:"Avec un chien inconnu calme",crit:"4 sur 5"},
   {n:5,t:"Il se détache seul avant toi",crit:"Observé 3 fois"}],
 ok:["Allonge à 15 secondes maximum, jamais plus au début.",
   "Varie les partenaires, en gardant des chiens bien codés."],
 ko:["Il ne se détache pas : reviens à 3 secondes, longe attachée.",
   "L'autre chien est raide ou fonce : n'engage pas la rencontre."],
 err:["Laisser durer « parce qu'ils s'amusent bien ».",
   "Rencontres en laisse tendue, face à face."],
 stop:["Corps raide, queue haute figée, l'un fuit : sépare calmement."]},

{id:'recompenser-detachement', t:"Récompenser le détachement", cat:'soc', ch:3, mode:'taux',
 obj:"Féliciter chaque fois que le chien regarde un stimulus puis revient naturellement vers toi.",
 why:"Le détachement volontaire est le comportement le plus précieux à construire : il précède tout le reste.",
 mat:["Friandises accessibles rapidement"], duree:"Sur toute la balade",
 env:"Partout",
 etapes:["Guette le moment où il regarde quelque chose puis tourne la tête vers toi.",
   "Marque immédiatement (« oui ! ») dans la demi-seconde.",
   "Récompense généreusement.",
   "Laisse-le retourner à son activité.",
   "Compte le nombre de décrochages dans la balade."],
 paliers:[{n:1,t:"3 décrochages / balade",crit:"Sur 3 balades"},
   {n:2,t:"6 décrochages / balade",crit:"Sur 3 balades"},
   {n:3,t:"10 décrochages / balade",crit:"Sur 3 balades"},
   {n:4,t:"Décrochage face à un chien",crit:"Observé 3 fois"},
   {n:5,t:"Décrochage face à son pire déclencheur",crit:"Observé 2 fois"}],
 ok:["Rien à changer : cet exercice ne se durcit pas, il se répète à vie.",
   "Réduis progressivement la friandise, garde la voix."],
 ko:["Aucun décrochage : environnement trop dur, ou tu n'es pas assez rapide à marquer."],
 err:["Marquer trop tard : après 2 secondes, il ne fait plus le lien."],
 stop:[]},

{id:'demi-tour', t:"Le demi-tour positif", cat:'soc', ch:3, mode:'taux',
 obj:"Interrompre une montée émotionnelle en changeant de direction, sans tension ni reproche.",
 why:"Casser la fixation avant l'explosion est cent fois plus simple que de gérer après.",
 mat:["Laisse détendue"], duree:"5 s par répétition",
 env:"Partout",
 etapes:["Dès qu'il commence à fixer, dis son nom d'une voix légère.",
   "Ne tire pas. Tourne ton corps et avance dans l'autre sens.",
   "Récompense dès qu'il te suit, même d'un pas.",
   "Continue quelques mètres, puis reprends le cours normal.",
   "Entraîne-le aussi sans raison, pour qu'il devienne banal."],
 paliers:[{n:1,t:"Sans stimulus",crit:"Il suit sans tension, 5 sur 5"},
   {n:2,t:"Stimulus faible et lointain",crit:"4 sur 5"},
   {n:3,t:"Chien à 30 m",crit:"4 sur 5"},
   {n:4,t:"Chien à 15 m",crit:"4 sur 5"},
   {n:5,t:"Début de fixation forte",crit:"3 sur 5, sans traction"}],
 ok:["Réduis la distance de déclenchement.",
   "Ajoute des demi-tours gratuits pour le garder neutre."],
 ko:["Il ne décroche pas : tu interviens trop tard, guette les premiers signes.",
   "Utilise un son inhabituel (clic de langue) avant le demi-tour."],
 err:["Tirer d'un coup sec : le demi-tour devient désagréable.",
   "L'utiliser uniquement en crise : il l'associera au stress."],
 stop:[]},

/* ---------------------------------------------------------- CHAPITRE 4 */
{id:'balade-lente', t:"La balade lente", cat:'bal', ch:4, mode:'duree',
 obj:"Ralentir volontairement 10 à 15 minutes et laisser le chien sentir bien plus que d'habitude.",
 why:"Le flair dépense mentalement plus qu'une marche rapide et fait redescendre l'excitation.",
 mat:["Longe 5 m recommandée","Harnais"], duree:"10 à 15 min",
 env:"Chemin, herbe, sous-bois",
 etapes:["Attache la longe au harnais, pas au collier.",
   "Marche deux fois moins vite que d'habitude.",
   "Arrête-toi dès qu'il renifle et attends qu'il ait fini.",
   "Ne l'appelle pas, ne le presse pas.",
   "Note le temps de flair réel."],
 paliers:[{n:1,t:"10 min, 3 min de flair",crit:"Tu as respecté chaque arrêt"},
   {n:2,t:"15 min, 6 min de flair",crit:"Idem"},
   {n:3,t:"20 min, 10 min de flair",crit:"Il baisse la tête sans que tu ralentisses"},
   {n:4,t:"Note de fin ≤ 4/10",crit:"3 balades"},
   {n:5,t:"Il redescend seul en 5 min",crit:"Observé 3 fois"}],
 ok:["Allonge la partie lente, ou augmente la proportion de flair.",
   "Passe à un terrain plus riche en odeurs (herbe haute, bois)."],
 ko:["Il ne renifle pas : le lieu est trop stimulant, ou il est trop excité.",
   "Trop de traction sur la longe : raccourcis à 3 m au début."],
 err:["Regarder son téléphone : tu rateras tout ce qu'il te dit.",
   "Le tirer quand il renifle « trop longtemps »."],
 stop:[]},

{id:'quart-heure', t:"Le quart d'heure sans objectif", cat:'bal', ch:4, mode:'duree',
 obj:"Quinze minutes sans destination, sans exercice, sans consigne.",
 why:"Une balade équilibrée doit laisser de la place à l'autonomie. Trop de contrôle empêche le chien d'apprendre seul.",
 mat:["Longe"], duree:"15 min",
 env:"Terrain varié, peu fréquenté",
 etapes:["Choisis un lieu sûr et pars sans itinéraire.",
   "Suis-le, plutôt que l'inverse, tant que c'est sûr.",
   "Aucun ordre pendant 15 minutes.",
   "Récompense uniquement les retours spontanés.",
   "Note ce qu'il a choisi de faire."],
 paliers:[{n:1,t:"15 min sans ordre",crit:"Tu as tenu, zéro consigne"},
   {n:2,t:"Il revient 2 fois seul",crit:"Sur la séance"},
   {n:3,t:"Il revient 5 fois seul",crit:"Sur la séance"},
   {n:4,t:"Il alterne exploration et vérification",crit:"Observé"},
   {n:5,t:"Même chose en milieu moyennement animé",crit:"Il reste connecté"}],
 ok:["Augmente légèrement le niveau du lieu.",
   "Passe de la longe à la liberté si le rappel est au palier 4."],
 ko:["Il part loin et ne revient pas : longe obligatoire, travaille le rappel d'abord.",
   "Tu n'arrives pas à te taire : le vrai exercice est pour toi."],
 err:["Glisser un « assis » « pour vérifier » : ça casse tout l'exercice."],
 stop:[]},

{id:'chasse-friandises', t:"La chasse aux friandises", cat:'bal', ch:4, mode:'duree',
 obj:"Disperser des friandises dans l'herbe et laisser le chien les chercher au flair.",
 why:"Stimule mentalement, canalise la concentration et fait très souvent redescendre l'excitation en quelques minutes.",
 mat:["10 à 20 petites friandises","Herbe ou feuilles"], duree:"3 à 10 min",
 env:"Zone d'herbe, sans autre chien à proximité",
 etapes:["Choisis un carré de 2 x 2 m.",
   "Disperse les friandises pendant qu'il attend (ou pendant qu'il regarde, au début).",
   "Libère-le d'un mot, puis tais-toi.",
   "Laisse-le chercher jusqu'au bout, sans l'aider.",
   "Note son état avant / après."],
 paliers:[{n:1,t:"Carré 2 m, il regarde la dispersion",crit:"Il trouve tout"},
   {n:2,t:"Carré 4 m, dispersion cachée",crit:"Il trouve tout en moins de 5 min"},
   {n:3,t:"Herbe plus haute",crit:"Il cherche méthodiquement"},
   {n:4,t:"Après une excitation",crit:"Sa note baisse d'au moins 2 points"},
   {n:5,t:"En lieu moyennement animé",crit:"Il reste concentré sur la recherche"}],
 ok:["Agrandis la zone, ou passe à des cachettes en hauteur.",
   "Utilise-le comme outil de redescente après une rencontre."],
 ko:["Il abandonne : moins de friandises, herbe plus courte.",
   "Il est trop excité pour chercher : éloigne-toi d'abord."],
 err:["Le faire là où d'autres chiens peuvent arriver : risque de conflit sur ressource."],
 stop:[]},

{id:'fin-balade-calme', t:"Fin de balade calme", cat:'bal', ch:4, mode:'obs',
 obj:"Consacrer les 5 à 10 dernières minutes de la balade au calme et au flair.",
 why:"La transition facilite le retour au calme à la maison. Un chien qui rentre à 8/10 restera agité.",
 mat:["Rien"], duree:"5 à 10 min",
 env:"Retour",
 etapes:["Range la balle et les jouets 10 minutes avant la fin.",
   "Ralentis nettement.",
   "Laisse-le sentir sur les derniers mètres.",
   "Rentre en silence, sans effusion.",
   "Note le temps qu'il met à se coucher une fois rentré."],
 paliers:[{n:1,t:"Il se couche en 20 min",crit:"3 fois"},
   {n:2,t:"En 10 min",crit:"3 fois"},
   {n:3,t:"En 5 min",crit:"3 fois"},
   {n:4,t:"Immédiatement",crit:"3 fois"},
   {n:5,t:"Il va seul à son panier",crit:"Observé régulièrement"}],
 ok:["Rien à durcir : c'est une habitude à garder à vie."],
 ko:["Il rentre à 8/10 : la balade était trop intense, revois le contenu global."],
 err:["Le grand jeu de retrouvailles en rentrant : ça relance tout."],
 stop:[]},

/* ---------------------------------------------------------- CHAPITRE 5 */
{id:'rappel-positif', t:"Le rappel positif", cat:'rap', ch:5, mode:'taux',
 obj:"Appeler, récompenser généreusement, puis laisser repartir — pour que revenir ne signifie jamais la fin de la liberté.",
 why:"La plupart des chiens qui ne reviennent plus ont appris que le rappel annonce la laisse et le retour à la maison.",
 mat:["Friandises de très haute valeur (fromage, poulet)","Longe 10 m au début"], duree:"5 à 10 min",
 env:"Jardin, puis lieu calme, puis lieu animé",
 etapes:["Attends un moment où il n'est pas absorbé par autre chose.",
   "Appelle une seule fois, d'une voix enjouée.",
   "Recule ou accroupis-toi pour l'attirer.",
   "À son arrivée : 3 à 5 friandises d'affilée, en le félicitant.",
   "Libère-le aussitôt : « va jouer ! ». C'est cette libération qui fait la valeur du rappel."],
 paliers:[{n:1,t:"Maison / jardin, sans distraction",crit:"9 réussites sur 10"},
   {n:2,t:"Lieu calme, longe 10 m",crit:"9 sur 10"},
   {n:3,t:"Lieu calme, distraction légère",crit:"8 sur 10"},
   {n:4,t:"Lieu animé, longe",crit:"8 sur 10"},
   {n:5,t:"Liberté, distraction moyenne",crit:"8 sur 10 sur 3 séances"}],
 ok:["Monte d'un palier après 3 séances consécutives au-dessus du critère.",
   "Ajoute une distraction, ou de la distance, mais jamais les deux à la fois.",
   "Une à deux fois par semaine, transforme un rappel en jackpot."],
 ko:["Sous 50 % : redescends d'un palier et fais 3 séances faciles.",
   "Ne répète jamais le mot : rapproche-toi, recrée la connexion, facilite.",
   "Change de récompense : elle doit valoir plus que l'environnement.",
   "Remets la longe sans culpabiliser — c'est un outil, pas un échec."],
 err:["Rappeler uniquement pour rentrer ou remettre la laisse.",
   "Répéter « viens ! viens ! viens ! » : le mot perd sa valeur à chaque échec.",
   "Gronder le chien quand il finit par arriver."],
 stop:["Il est en fixation forte sur une proie : ne rappelle pas, va le chercher."]},

{id:'rappel-facile', t:"Le rappel facile", cat:'rap', ch:5, mode:'taux',
 obj:"Construire le rappel dans un environnement simple avant d'augmenter progressivement les distractions.",
 why:"Le rappel n'est pas un interrupteur : c'est une compétence qui se généralise contexte par contexte.",
 mat:["Longe","Friandises"], duree:"5 min",
 env:"Maison → jardin → parking calme → chemin → parc",
 etapes:["Commence là où il réussit 9 fois sur 10.",
   "Fais 10 rappels par séance, pas plus.",
   "Ne change qu'un paramètre à la fois : lieu, distance, ou distraction.",
   "Note le taux dans l'app à chaque séance.",
   "Ne monte de niveau qu'après 3 séances au-dessus de 80 %."],
 paliers:[{n:1,t:"Maison, 3 m",crit:"10/10"},
   {n:2,t:"Jardin, 10 m",crit:"9/10"},
   {n:3,t:"Lieu calme, 15 m",crit:"9/10"},
   {n:4,t:"Lieu moyen, 20 m",crit:"8/10"},
   {n:5,t:"Lieu animé, 25 m",crit:"8/10"}],
 ok:["Augmente un seul paramètre de 20 à 30 %.",
   "Reviens régulièrement à un palier facile pour entretenir."],
 ko:["Deux échecs d'affilée : la séance est finie, on redescend.",
   "Réduis la distance de moitié.",
   "Repasse en longe."],
 err:["Vouloir tester « pour voir » dans un endroit trop dur : chaque échec coûte cher."],
 stop:[]},

{id:'jackpot', t:"Le jackpot", cat:'rap', ch:5, mode:'taux',
 obj:"Une à deux fois par semaine, transformer un rappel rapide en récompense exceptionnelle.",
 why:"Un renforcement imprévisible et énorme augmente durablement la valeur du comportement.",
 mat:["Une friandise exceptionnelle réservée à ça (jambon, fromage frais)"], duree:"1 min",
 env:"N'importe où, quand il revient vite",
 etapes:["Attends un rappel où il revient franchement et vite.",
   "Donne 8 à 10 friandises d'affilée, une par une, en le félicitant chaudement.",
   "Fais durer 15 à 20 secondes.",
   "Puis libère-le.",
   "Maximum 2 fois par semaine, sinon l'effet s'use."],
 paliers:[{n:1,t:"1 jackpot / semaine",crit:"Fait"},
   {n:2,t:"2 jackpots / semaine",crit:"Fait 3 semaines"},
   {n:3,t:"Jackpot en lieu moyen",crit:"Il revient plus vite après"},
   {n:4,t:"Jackpot après un décrochage difficile",crit:"Fait"},
   {n:5,t:"La vitesse de retour a nettement augmenté",crit:"Observé sur 2 semaines"}],
 ok:["Garde le rythme, ne surexploite pas.",
   "Réserve cette friandise exclusivement au jackpot."],
 ko:["Il n'est pas plus rapide : la friandise n'est pas assez exceptionnelle, change."],
 err:["En faire à chaque rappel : ça devient la norme et l'effet disparaît."],
 stop:[]},

{id:'retours-spontanes', t:"Récompenser les retours spontanés", cat:'rap', ch:5, mode:'taux',
 obj:"Récompenser chaque fois que le chien revient vers toi sans avoir été appelé.",
 why:"C'est le rappel du quotidien : celui qui tient quand tout le reste échoue.",
 mat:["Friandises toujours en poche"], duree:"Toute la balade",
 env:"Partout",
 etapes:["Ne l'appelle pas.",
   "Dès qu'il revient de lui-même : marque et récompense.",
   "Laisse-le repartir tout de suite.",
   "Compte le nombre de retours spontanés par balade.",
   "Note-le : c'est un excellent indicateur de connexion."],
 paliers:[{n:1,t:"3 retours / balade",crit:"Sur 3 balades"},
   {n:2,t:"6 retours / balade",crit:"Sur 3 balades"},
   {n:3,t:"10 retours / balade",crit:"Sur 3 balades"},
   {n:4,t:"Retours en lieu animé",crit:"5 par balade"},
   {n:5,t:"Il te vérifie régulièrement sans récompense",crit:"Observé"}],
 ok:["Passe au renforcement variable : 1 fois sur 2, puis 1 sur 3."],
 ko:["Zéro retour : ta présence n'est pas assez intéressante. Bouge, cache-toi, change de direction."],
 err:["Ignorer les retours spontanés parce qu'ils n'ont pas été demandés : c'est le comportement le plus précieux."],
 stop:[]},

{id:'longe', t:"Travailler avec la longe", cat:'rap', ch:5, mode:'obs',
 obj:"Utiliser une longe pour sécuriser, guider, et éviter d'accumuler des échecs de rappel.",
 why:"La longe n'est pas un aveu d'échec : c'est l'outil qui permet d'apprendre sans danger et sans mauvaise habitude.",
 mat:["Longe 5 à 15 m","Harnais obligatoire (jamais sur le collier)","Gants fins conseillés"], duree:"Toute la balade",
 env:"Chemins dégagés, sans obstacles à enrouler",
 etapes:["Attache la longe au harnais.",
   "Laisse-la traîner, ne la garde pas tendue.",
   "Marche en gardant du mou : la longe est une sécurité, pas un guide.",
   "Utilise-la pour empêcher un départ, jamais pour ramener de force.",
   "Retire-la seulement quand le rappel est au palier 4 depuis 2 semaines."],
 paliers:[{n:1,t:"Longe 5 m",crit:"Il marche sans traction permanente"},
   {n:2,t:"Longe 10 m",crit:"Il revient dans le champ sans y être forcé"},
   {n:3,t:"Longe 15 m",crit:"Rappel réussi à 80 % à cette distance"},
   {n:4,t:"Longe traînante non tenue",crit:"Rappel réussi à 80 %"},
   {n:5,t:"Liberté en zone sûre",crit:"Rappel 80 % sur 3 sorties"}],
 ok:["Allonge la longe avant de la retirer.",
   "Fais une transition : longe traînante non tenue pendant 2 semaines."],
 ko:["Il s'emmêle : longe plus courte, terrain plus dégagé.",
   "Il tire en permanence : travaille la marche avant d'allonger."],
 err:["Attacher la longe au collier : risque de blessure cervicale en cas d'arrêt brutal.",
   "Retirer la longe trop tôt : chaque fugue renforce l'habitude de partir."],
 stop:["Longe autour des pattes ou d'un obstacle : arrête tout et démêle calmement."]},

{id:'cache-cache', t:"Le cache-cache", cat:'rap', ch:5, mode:'taux',
 obj:"Se cacher brièvement pendant la balade et laisser le chien te retrouver.",
 why:"Développe naturellement l'attention envers toi et rend ta présence intéressante à surveiller.",
 mat:["Un arbre, un buisson","Friandises"], duree:"1 min par répétition",
 env:"Lieu sécurisé et clos si possible",
 etapes:["Attends qu'il soit absorbé par une odeur, à 10 m.",
   "Cache-toi derrière un obstacle, sans bruit.",
   "Attends. S'il ne cherche pas au bout de 20 s, fais un petit bruit.",
   "Quand il te trouve : grande fête, friandises.",
   "3 répétitions maximum par balade."],
 paliers:[{n:1,t:"Caché à 10 m, avec un bruit",crit:"Il te trouve, 3 sur 3"},
   {n:2,t:"Caché à 10 m, sans bruit",crit:"3 sur 3"},
   {n:3,t:"Caché à 20 m",crit:"3 sur 3"},
   {n:4,t:"Il te cherche en moins de 10 s",crit:"3 sur 3"},
   {n:5,t:"Il te vérifie tout seul, plus souvent",crit:"Observé en balade"}],
 ok:["Augmente la distance ou le temps avant le bruit."],
 ko:["Il panique : réduis la distance, réapparais vite. On ne veut pas de stress.",
   "Il ne te cherche pas : sa connexion est faible, travaille les retours spontanés."],
 err:["Le faire dans un lieu non sécurisé : s'il panique, il peut partir loin.",
   "En abuser : 3 fois par balade, pas plus."],
 stop:["Signes de panique (course désordonnée, vocalises) : sors immédiatement."]},

{id:'seuil-rappel', t:"Observer le seuil avant d'appeler", cat:'rap', ch:5, mode:'taux',
 obj:"Vérifier le niveau d'excitation et de fixation avant de prononcer le rappel.",
 why:"Plus le rappel est demandé tôt, plus il réussit. Appeler un chien déjà en fixation, c'est programmer l'échec.",
 mat:["Rien"], duree:"Toute la balade",
 env:"Partout",
 etapes:["Avant chaque rappel, prends une seconde : où est son attention ?",
   "S'il est déjà fixé : ne dis rien. Rapproche-toi, ou change de direction.",
   "S'il est disponible (oreilles mobiles, corps souple) : appelle.",
   "Note le taux de réussite quand tu appliques la règle vs quand tu l'oublies.",
   "L'objectif : ne prononcer le rappel que quand il a des chances de réussir."],
 paliers:[{n:1,t:"Tu vérifies avant d'appeler",crit:"8 fois sur 10"},
   {n:2,t:"Taux de rappel > 80 %",crit:"Sur 3 balades"},
   {n:3,t:"Tu renonces à appeler quand c'est trop dur",crit:"3 fois observées"},
   {n:4,t:"Tu appelles avant la fixation",crit:"Anticipé 5 fois"},
   {n:5,t:"Il décroche seul avant que tu appelles",crit:"Observé régulièrement"}],
 ok:["Rien à durcir : c'est une règle de conduite permanente."],
 ko:["Tu appelles trop tard : ralentis, observe davantage, éloigne-toi plus tôt."],
 err:["Appeler « pour voir ce que ça donne » quand il est à 9/10."],
 stop:[]},

/* ---------------------------------------------------------- CHAPITRE 6 */
{id:'auto-observation', t:"Observer ses propres réactions", cat:'rel', ch:6, mode:'obs',
 obj:"Vérifier sa propre respiration, sa posture et sa tension dans les situations du quotidien.",
 why:"Le chien capte notre tension avant même l'événement. La régulation du chien commence souvent par celle de l'humain.",
 mat:["Rien"], duree:"Ponctuel",
 env:"Situations qui te crispent (croisement, ascenseur, vétérinaire)",
 etapes:["Repère la situation qui te tend.",
   "Avant qu'elle arrive : expire longuement, relâche les épaules.",
   "Vérifie ta main : la laisse est-elle tendue ?",
   "Parle plus bas et plus lentement que d'habitude.",
   "Note après coup : étais-tu tendu ? Comment a réagi le chien ?"],
 paliers:[{n:1,t:"Tu identifies 3 situations qui te crispent",crit:"Notées"},
   {n:2,t:"Tu relâches la laisse consciemment",crit:"5 fois"},
   {n:3,t:"Tu respires avant le croisement",crit:"5 fois"},
   {n:4,t:"Le chien réagit moins dans ces situations",crit:"Observé 3 fois"},
   {n:5,t:"C'est devenu automatique",crit:"Tu n'y penses plus"}],
 ok:["Applique la même chose dans une situation plus difficile."],
 ko:["Trop dur à distance courte : élargis la distance jusqu'à être à l'aise toi aussi."],
 err:["Se concentrer uniquement sur le chien et oublier qu'on tient l'autre bout de la laisse."],
 stop:[]},

{id:'regles-constantes', t:"Rester constant dans les règles", cat:'rel', ch:6, mode:'obs',
 obj:"Choisir peu de règles, simples, et les appliquer toujours de la même façon.",
 why:"Le chien a besoin de cohérence, pas de perfection. Un cadre qui change selon l'humeur crée de l'incertitude.",
 mat:["Une feuille affichée sur le frigo"], duree:"Permanent",
 env:"Maison",
 etapes:["Écris 4 ou 5 règles maximum (canapé, lit, table, saut sur les visiteurs, gamelle).",
   "Vérifie que toute la maison est d'accord.",
   "Applique-les toujours, y compris quand c'est pénible.",
   "Note les écarts pendant une semaine.",
   "Revois la règle si elle est intenable : mieux vaut la changer que l'appliquer une fois sur deux."],
 paliers:[{n:1,t:"Les règles sont écrites",crit:"Fait"},
   {n:2,t:"Tout le foyer les applique",crit:"1 semaine sans écart"},
   {n:3,t:"2 semaines sans écart",crit:"Fait"},
   {n:4,t:"Le chien ne teste plus",crit:"Observé"},
   {n:5,t:"Les règles tiennent chez les autres aussi",crit:"Observé"}],
 ok:["Rien à durcir : la constance est l'objectif."],
 ko:["Une règle saute toujours : elle est irréaliste, remplace-la."],
 err:["Vingt règles : personne ne les tiendra."],
 stop:[]},

{id:'laisser-reflechir', t:"Laisser le chien réfléchir", cat:'rel', ch:6, mode:'taux',
 obj:"Attendre quelques secondes avant d'intervenir et récompenser les bonnes initiatives.",
 why:"Intervenir sans arrêt empêche le chien d'analyser par lui-même. L'apprentissage passe aussi par l'expérience.",
 mat:["Friandises"], duree:"5 min",
 env:"Situations simples et sûres",
 etapes:["Face à une situation banale (une porte fermée, un jouet coincé, une hésitation), ne dis rien.",
   "Compte mentalement jusqu'à 5.",
   "S'il propose quelque chose de correct : récompense.",
   "S'il se trompe sans danger : laisse-le essayer autre chose.",
   "N'interviens qu'après."],
 paliers:[{n:1,t:"Tu attends 5 s",crit:"5 fois sur 5"},
   {n:2,t:"Il propose un comportement",crit:"3 fois sur 5"},
   {n:3,t:"Il propose le bon",crit:"3 fois sur 5"},
   {n:4,t:"Il propose dans une situation nouvelle",crit:"3 fois"},
   {n:5,t:"Il propose sans hésiter",crit:"Observé régulièrement"}],
 ok:["Complexifie légèrement la situation."],
 ko:["Il abandonne vite : le problème est trop dur, simplifie.",
   "Tu interviens trop tôt : compte à voix basse."],
 err:["Laisser durer une situation qu'il ne sait manifestement pas gérer : ça construit de l'anxiété, pas de l'autonomie."],
 stop:["Signes de détresse : interviens tout de suite."]},

{id:'micro-progres', t:"Valoriser les micro-progrès", cat:'rel', ch:6, mode:'obs',
 obj:"Repérer et noter les petites évolutions plutôt que d'attendre les grandes réussites.",
 why:"Les grandes transformations sont faites de micro-progrès répétés. Ne voir que le résultat final démotive tout le monde.",
 mat:["Le journal de l'app"], duree:"2 min par jour",
 env:"Partout",
 etapes:["Chaque soir, note une seule chose qui a mieux marché aujourd'hui.",
   "Ça peut être minuscule : un regard, une récupération plus rapide, un croisement passé.",
   "Ne note pas ce qui a raté.",
   "Relis la semaine complète le dimanche.",
   "Compare avec le mois précédent."],
 paliers:[{n:1,t:"7 notes en 7 jours",crit:"Fait"},
   {n:2,t:"1 mois de notes",crit:"Fait"},
   {n:3,t:"Tu vois une tendance",crit:"Identifiée"},
   {n:4,t:"3 mois",crit:"Fait"},
   {n:5,t:"Tu repères les progrès en direct",crit:"Sans avoir à relire"}],
 ok:["Rien à durcir."],
 ko:["Rien à noter aujourd'hui : note simplement « journée neutre ». C'est aussi une donnée."],
 err:["Ne noter que les échecs : le carnet devient décourageant."],
 stop:[]},

{id:'journees-difficiles', t:"Accepter les journées difficiles", cat:'rel', ch:6, mode:'obs',
 obj:"Réduire les exigences les jours où rien ne marche, et rester cohérent quand même.",
 why:"L'apprentissage n'est jamais linéaire. Une rechute fait partie du processus, ce n'est pas un échec.",
 mat:["Rien"], duree:"Une journée",
 env:"Partout",
 etapes:["Repère les signes : il ne répond pas comme d'habitude, tu t'agaces.",
   "Annule les séances d'entraînement du jour.",
   "Privilégie flair, pause, calme.",
   "Garde les règles, baisse les attentes.",
   "Note la journée comme « allégée » dans le journal."],
 paliers:[{n:1,t:"Tu identifies une journée difficile",crit:"Notée"},
   {n:2,t:"Tu allèges au lieu d'insister",crit:"3 fois"},
   {n:3,t:"Ça repart le lendemain",crit:"Observé 3 fois"},
   {n:4,t:"Tu anticipes (chaleur, fatigue, chaleurs, période de mue)",crit:"Fait"},
   {n:5,t:"Les journées difficiles se raréfient",crit:"Sur 2 mois"}],
 ok:["Rien à durcir."],
 ko:["Trop de journées difficiles d'affilée : cherche une cause physique, prends rendez-vous chez le vétérinaire."],
 err:["Insister « pour ne pas céder » : ça ne construit que de la tension."],
 stop:[]},

/* ---------------------------------------------------------- CHAPITRE 7 */
{id:'carnet-signaux', t:"Le carnet de signaux", cat:'sig', ch:7, mode:'obs',
 obj:"Noter après chaque balade un signal observé : détournement de regard, position de la queue, fixation.",
 why:"Ce n'est pas une performance : c'est un entraînement de l'œil, pour repérer de plus en plus tôt.",
 mat:["L'onglet Signaux de l'app"], duree:"1 min après la balade",
 env:"Partout",
 etapes:["Après la balade, choisis un moment précis.",
   "Note le signal observé, le contexte et ce que tu as fait.",
   "Un seul signal par balade suffit au début.",
   "Au bout d'une semaine, relis : lesquels reviennent ?",
   "Identifie l'ordre habituel des signaux chez ton chien."],
 paliers:[{n:1,t:"7 notes en 7 jours",crit:"Fait"},
   {n:2,t:"Tu reconnais 3 signaux de ton chien",crit:"Identifiés"},
   {n:3,t:"Tu repères le signal en direct",crit:"3 fois"},
   {n:4,t:"Tu agis avant le signal suivant",crit:"3 fois"},
   {n:5,t:"Il n'a plus besoin de monter dans l'échelle",crit:"Observé sur un mois"}],
 ok:["Note deux signaux par balade, avec leur ordre d'apparition."],
 ko:["Tu ne vois rien : filme 2 minutes de balade et regarde au ralenti."],
 err:["Chercher uniquement les gros signaux : ce sont les discrets qui comptent."],
 stop:[]},

{id:'obs-distance', t:"L'observation à distance", cat:'sig', ch:7, mode:'taux',
 obj:"Avant toute interaction, prendre trois secondes pour lire la posture des deux chiens.",
 why:"Cette habitude devient vite un réflexe et évite la majorité des mauvaises rencontres.",
 mat:["Rien"], duree:"3 s par croisement",
 env:"Chaque croisement",
 etapes:["Arrête-toi ou ralentis dès que tu vois l'autre chien.",
   "Corps souple ou raide ? Queue détendue ou figée ?",
   "L'approche est-elle en courbe ou en ligne droite ?",
   "Décide : on croise, on s'écarte, ou on fait demi-tour.",
   "Note ta décision et ce qui s'est passé."],
 paliers:[{n:1,t:"Tu prends les 3 s",crit:"5 croisements sur 5"},
   {n:2,t:"Tu décris la posture de l'autre chien",crit:"5 sur 5"},
   {n:3,t:"Tu évites une rencontre à risque",crit:"3 fois"},
   {n:4,t:"Ta décision s'avère juste",crit:"8 fois sur 10"},
   {n:5,t:"C'est devenu un réflexe",crit:"Tu n'y penses plus"}],
 ok:["Rien à durcir."],
 ko:["Tu n'as pas le temps : ralentis plus tôt, dès que le chien apparaît."],
 err:["Ne regarder que si les chiens jouent, sans lire les postures."],
 stop:[]},

{id:'retrait-sans-drame', t:"Le retrait sans drame", cat:'sig', ch:7, mode:'taux',
 obj:"S'entraîner à s'éloigner calmement d'une situation, même sans danger, pour que ça devienne banal.",
 why:"Le but est que « s'éloigner avec toi » soit une option agréable et familière, pas une réaction de crise.",
 mat:["Friandises"], duree:"10 s par répétition",
 env:"Partout, y compris sans stimulus",
 etapes:["Dis son nom d'une voix légère, presque joyeuse.",
   "Fais quelques pas dans une autre direction, sans tirer.",
   "Récompense dès qu'il te suit.",
   "Reprends la balade normalement.",
   "Fais-le 5 fois par balade, même sans raison."],
 paliers:[{n:1,t:"Sans stimulus",crit:"5 sur 5"},
   {n:2,t:"Stimulus lointain",crit:"4 sur 5"},
   {n:3,t:"Stimulus moyen",crit:"4 sur 5"},
   {n:4,t:"Il te suit avant la friandise",crit:"4 sur 5"},
   {n:5,t:"Il propose de s'éloigner seul",crit:"Observé"}],
 ok:["Réduis la distance au stimulus."],
 ko:["Il résiste : tu es trop près, ou l'exercice n'a été fait qu'en crise. Refais-le à vide."],
 err:["N'utiliser le retrait qu'en situation tendue : il devient un signal de stress."],
 stop:[]},

{id:'bons-compagnons', t:"Choisir les bons compagnons de jeu", cat:'sig', ch:7, mode:'obs',
 obj:"Identifier les chiens calmes, respectueux des pauses, et privilégier ces rencontres.",
 why:"Un chien bien codé est un excellent professeur. Un chien mal codé peut installer des mauvaises habitudes en quelques séances.",
 mat:["L'onglet Contacts de l'app"], duree:"Permanent",
 env:"Lieux de balade habituels",
 etapes:["Liste les chiens que tu croises régulièrement.",
   "Pour chacun : fait-il des pauses ? Respecte-t-il les signaux ? Sait-il s'arrêter ?",
   "Classe-les : à privilégier / neutre / à éviter.",
   "Organise les balades pour croiser les bons.",
   "Évite systématiquement les chiens qui foncent et ignorent les signaux."],
 paliers:[{n:1,t:"Liste de 5 chiens évalués",crit:"Faite"},
   {n:2,t:"2 partenaires réguliers identifiés",crit:"Faits"},
   {n:3,t:"Balades organisées avec eux",crit:"1 par semaine"},
   {n:4,t:"Ton chien joue mieux",crit:"Pauses observées pendant le jeu"},
   {n:5,t:"Il choisit lui-même ses partenaires",crit:"Observé"}],
 ok:["Élargis le cercle, prudemment."],
 ko:["Aucun bon partenaire dans le coin : privilégie l'observation à distance plutôt que des rencontres médiocres."],
 err:["Accepter toutes les rencontres pour ne pas vexer l'autre propriétaire."],
 stop:[]},

/* ---------------------------------------------------------- CHAPITRE 8 */
{id:'piece-refuge', t:"La pièce refuge", cat:'chiot', ch:8, mode:'obs',
 obj:"Installer un espace calme où le chiot peut se retirer, et ne jamais l'y déranger.",
 why:"Un chiot qui a un endroit à lui, respecté, apprend qu'il peut se mettre en sécurité seul.",
 mat:["Panier ou caisse ouverte","Un tapis","Coin sans passage"], duree:"Permanent",
 env:"Maison",
 etapes:["Choisis un coin calme, hors du passage, d'où il peut voir sans être au milieu.",
   "Installe le couchage et laisse-le libre d'y aller.",
   "Ne l'y envoie jamais en punition.",
   "N'y va jamais le chercher, ne le caresse pas quand il y est.",
   "Explique la règle à toute la maison, enfants compris."],
 paliers:[{n:1,t:"Il y va spontanément",crit:"3 fois par jour"},
   {n:2,t:"Il y dort",crit:"Observé quotidiennement"},
   {n:3,t:"Il s'y retire quand c'est agité",crit:"Observé 3 fois"},
   {n:4,t:"Il s'y calme seul après une excitation",crit:"Observé 3 fois"},
   {n:5,t:"C'est son repère de récupération",crit:"Installé durablement"}],
 ok:["Ajoute un second couchage dans une autre pièce."],
 ko:["Il n'y va pas : le coin est mal placé, trop passant ou trop isolé.",
   "Sème des friandises dessus pour créer l'association, sans jamais l'y forcer."],
 err:["L'y envoyer quand il fait une bêtise : le refuge perd tout son sens.",
   "Laisser les enfants le déranger dedans."],
 stop:[]},

{id:'micro-seances', t:"Les micro-séances", cat:'chiot', ch:8, mode:'taux',
 obj:"Remplacer les longues séances par plusieurs séances de 2 à 3 minutes, toujours terminées sur une réussite.",
 why:"La concentration d'un chiot se compte en minutes. Une séance trop longue crée de la frustration des deux côtés.",
 mat:["Friandises","Minuteur"], duree:"2 à 3 min, 3 à 5 fois par jour",
 env:"Maison, endroit calme",
 etapes:["Règle un minuteur sur 2 minutes.",
   "Travaille un seul comportement.",
   "Arrête au signal, même si ça marchait bien.",
   "Termine toujours sur une répétition réussie.",
   "Laisse au moins une heure entre deux séances."],
 paliers:[{n:1,t:"2 min, 3 fois par jour",crit:"5 jours d'affilée"},
   {n:2,t:"3 min, 4 fois par jour",crit:"5 jours"},
   {n:3,t:"Il reste concentré toute la séance",crit:"4 séances sur 5"},
   {n:4,t:"5 min chez le chien adulte",crit:"4 sur 5"},
   {n:5,t:"Séances en extérieur calme",crit:"4 sur 5"}],
 ok:["Ajoute 1 minute, ou une séance par jour.",
   "Ne fais jamais les deux en même temps."],
 ko:["Il décroche avant la fin : réduis à 1 minute.",
   "Il n'a rien réussi : baisse le critère pour finir sur un succès, toujours."],
 err:["Continuer « parce que ça marche bien » : c'est comme ça qu'on finit sur un échec."],
 stop:["Il s'assoit et regarde ailleurs, bâille, se gratte : la séance est finie."]},

{id:'substitution', t:"Le jeu de la substitution", cat:'chiot', ch:8, mode:'taux',
 obj:"Proposer immédiatement un jouet dès que le chiot mordille les mains, les vêtements ou les pieds.",
 why:"Le mordillement est normal. Il ne s'agit pas de le supprimer mais de le rediriger vers un support acceptable.",
 mat:["Un jouet à mâchouiller dans chaque pièce"], duree:"Toute la journée",
 env:"Maison",
 etapes:["Dès que la bouche se pose sur toi : petit son aigu et bref (« aïe ! »).",
   "Interromps le jeu 3 à 5 secondes, sans drame.",
   "Propose immédiatement le jouet.",
   "Joue avec lui sur le jouet : il doit être plus intéressant que ta main.",
   "Ne retire jamais la main d'un geste brusque : ça déclenche la poursuite."],
 paliers:[{n:1,t:"Il prend le jouet",crit:"5 fois sur 10"},
   {n:2,t:"Il prend le jouet",crit:"8 fois sur 10"},
   {n:3,t:"Il va chercher le jouet seul",crit:"3 fois"},
   {n:4,t:"Le mordillement baisse en intensité",crit:"Observé sur une semaine"},
   {n:5,t:"Il ne mordille presque plus les mains",crit:"Observé sur un mois"}],
 ok:["Espace les jouets, laisse-le les chercher.",
   "Ajoute des jouets de textures différentes."],
 ko:["Il s'excite encore plus au son aigu : passe à l'arrêt silencieux, tourne-toi et quitte la pièce 10 s.",
   "Il mordille beaucoup en soirée : il est probablement fatigué ou surstimulé, propose une pause plutôt qu'une correction."],
 err:["Jouer avec les mains ou les pieds comme jouet.",
   "Retirer la main d'un geste vif : ça amplifie tout."],

{id:'sortie-decouverte', t:"La sortie découverte courte", cat:'chiot', ch:8, mode:'duree',

<script>
/* =========================================================================
   1. STOCKAGE  —  fonctionne dans l'aperçu Claude, sur GitHub Pages,
      et même en ouvrant le fichier en local (file://).
   ========================================================================= */
const KEY = 'carnet-chien-v1';
/* Trois niveaux, essayés dans l'ordre et non exclusifs : l'aperçu Claude expose
   window.storage mais bloque localStorage, un navigateur normal fait l'inverse.
   Si le niveau courant lâche en cours de route, on redescend au suivant au lieu
   de tomber directement en mémoire volatile. */
/* Trois niveaux, essayés dans l'ordre : l'aperçu Claude expose window.storage
   mais bloque localStorage, un navigateur normal fait l'inverse. Le niveau est
   choisi au démarrage par un aller-retour réel sur une clé témoin — tester la
   simple présence de l'API ne suffit pas, elle peut répondre puis échouer. */
const Store = (() => {
  let mem = null, prevenu = false;
  const win = (typeof window !== 'undefined' && window.storage
    && typeof window.storage.get === 'function') ? window.storage : null;
  let ls = null;
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ls = localStorage; } catch(e){ ls = null; }

  const api = {
    mode: win ? 'window' : ls ? 'local' : 'memory',
    degrade: '',
    /* Vérifie que le niveau retenu sait vraiment écrire puis relire. */
    async choisir(){
      if (api.mode !== 'window') return api.mode;
      try {
        const t = '__essai__' + Date.now();
        await win.set(KEY + ':essai', t);
        const r = await win.get(KEY + ':essai');
        if (!r || r.value !== t) throw new Error('aller-retour incohérent');
        /* On ne laisse pas traîner la clé témoin ; à défaut de suppression, on la vide. */
        try { if (win.delete) await win.delete(KEY + ':essai'); else await win.set(KEY + ':essai', ''); } catch(e){}
      } catch(e){
        api.mode = ls ? 'local' : 'memory';
        if (api.mode === 'memory')
          api.degrade = "Aucun stockage disponible ici. Les données tiendront jusqu'au rechargement : exporte le JSON.";
      }
      return api.mode;
    },
    async load(){
      if (api.mode === 'window'){
        try { const r = await win.get(KEY); return r ? JSON.parse(r.value) : null; }
        catch(e){ return null; }   // clé absente au premier lancement
      }
      if (api.mode === 'local'){
        try { const r = ls.getItem(KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; }
      }
      return mem;
    },
    async save(data){
      const s = JSON.stringify(data);
      if (api.mode === 'window'){
        try { await win.set(KEY, s); return true; }
        catch(e){ api.mode = ls ? 'local' : 'memory'; }
      }
      if (api.mode === 'local'){
        try { ls.setItem(KEY, s); return true; }
        catch(e){
          api.degrade = /quota|exceed/i.test(String(e && e.name) + String(e && e.message))
            ? "Stockage plein. Exporte le JSON, puis efface d'anciennes balades ou coupe les tracés GPS."
            : "Le navigateur refuse d'écrire (navigation privée ?). Exporte le JSON pour ne rien perdre.";
          api.mode = 'memory';
        }
      }
      if (api.mode === 'memory' && api.degrade && !prevenu){
        prevenu = true; setTimeout(()=>toast(api.degrade), 300);
      }
      mem = data; return api.mode !== 'memory';
    }
  };
  return api;
})();

/* =========================================================================
   2. ÉTAT
   ========================================================================= */
const blank = () => ({
  version: 1,
  chien: {nom:'', surnom:'', sexe:'', race:'', groupe:'', taille:'', naissance:'', adoption:'', origine:'',
    poidsCible:'', puce:'', tatouage:'', passeport:'', couleur:'', sterilise:'', assureur:'', numContrat:'',
    veto:'', vetoTel:'', regime:'', particularites:'', peurs:'', motivations:'', photo:''},
  objectifs: {baladesSem:10, minutesSem:420, sessionsSem:5, flairPct:35},
  balades:[], sessions:[], poids:[], sante:[], repas:[], journal:[], signaux:[],
  contacts:[], taches:[], depenses:[], notes:[], ordres:[], foyer:[],
  terrain: null, epingles: [], depart: null, objectifsRegles: false,
  reglages:{theme:'clair', unite:'km', carte:'osm'}
});
const COLLS = ['balades','sessions','poids','sante','repas','journal','signaux',
  'contacts','taches','depenses','notes','ordres','foyer'];
let S = blank();
let dirty = false;

async function boot(){
  await Store.choisir();
  const loaded = await Store.load();
  if (loaded && typeof loaded === 'object') S = Object.assign(blank(), loaded);
  for (const k of COLLS)
    if (!Array.isArray(S[k])) S[k] = [];

/* Score de balade : 0-100, pondéré sur le contenu réel de la sortie */
function scoreBalade(b){
  let s = 50;
  const d = num(b.duree)||1;
  const flair = Math.min(1, num(b.flair)/d);
  s += flair*22;                                   // le flair pèse lourd
  s -= (num(b.tirage)/5)*16;                       // tirage 0-5
  s -= (num(b.emoPic)/10)*10;                      // pic émotionnel
  s += (10-num(b.emoFin))/10*10;                   // état de fin
  if (num(b.rappelsDem) > 0) s += (num(b.rappelsOk)/num(b.rappelsDem))*12;
  s += Math.min(6, num(b.retours)*1.2);            // retours spontanés
  s += Math.min(6, num(b.croisCalmes)*1.5);
  s -= num(b.incidents)*6;
  s -= (num(b.reactivite)/5)*8;
  /* Une sortie se juge par rapport aux besoins de la lignée : 3 km suffisent à
     un carlin, ils sont maigres pour un husky. */
  if (num(b.distance) && typeof refDistance === 'function'){
    const r = refDistance();
    if (r) s += Math.max(-7, Math.min(7, (num(b.distance)/r - 1) * 9));
  }
  return Math.max(0, Math.min(100, Math.round(s)));
}
function verdictSession(s){
  const e = num(s.essais), r = num(s.reussites);
  if (!e) return {k:'obs', t:'Observation', c:'sky'};
  const p = r/e*100;
  if (p >= 80 && e >= 5) return {k:'up', t:'Monter d\'un palier', c:'moss'};
  if (p >= 50) return {k:'hold', t:'Consolider ce palier', c:'ochre'};
  return {k:'down', t:'Redescendre / faciliter', c:'rouge'};
}

function palierCourant(exoId){

  let p = 0;
  for (const s of ss) if (num(s.palier) > p && verdictSession(s).k === 'up') p = num(s.palier);
  return p;
}

let _gid = 0;
/* Courbe lissée (Catmull-Rom converti en Bézier), aire en dégradé, dernier point mis en avant */
function smoothPath(pts){
  if (pts.length < 3) return pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  let d = 'M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for (let i=0;i<pts.length-1;i++){
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    const c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
    const c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
    d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}
function lineChart(series, labels, opt){
  opt = Object.assign({h:190, min:null, max:null, fill:true, dots:true, yfmt:v=>v}, opt||{});
  const W = 620, H = opt.h, PL = 38, PR = 12, PT = 16, PB = 28;
  const all = series.flatMap(s=>s.data.filter(v=>v!==null&&v!==undefined));
  if (!all.length) return '<p class="muted small">Pas encore de données à afficher.</p>';
  let lo = opt.min !== null ? opt.min : Math.min(...all), hi = opt.max !== null ? opt.max : Math.max(...all);
  if (hi === lo) { hi = lo + 1; lo = Math.max(0, lo - 1); }
  const pad = (hi-lo)*0.14; if (opt.min===null) lo -= pad; if (opt.max===null) hi += pad;
  if (lo > 0 && lo < (hi-lo)) lo = 0;
  const n = labels.length;
  const X = i => PL + (n<=1 ? (W-PL-PR)/2 : i*(W-PL-PR)/(n-1));
  const Y = v => PT + (1-(v-lo)/(hi-lo))*(H-PT-PB);
  let defs = '', g = '';
  for (let t=0;t<=3;t++){ const v = lo + (hi-lo)*t/3, y = Y(v);
    g += `<line class="gl" x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}"/>`+
         `<text class="ax" x="${PL-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${esc(opt.yfmt(Math.round(v*10)/10))}</text>`;
  }
  const step = Math.max(1, Math.ceil(n/7));
  labels.forEach((l,i)=>{ if(i%step===0||i===n-1) g += `<text class="ax" x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`; });
  series.forEach(s=>{
    const pts = s.data.map((v,i)=> v===null||v===undefined ? null : [X(i),Y(v)]).filter(Boolean);
    if (!pts.length) return;
    const d = smoothPath(pts);
    if (opt.fill && series.length===1){
      const id = 'ar'+(++_gid);
      defs += `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${s.color}" stop-opacity=".30"/>
        <stop offset="100%" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`;
      g += `<path d="${d} L ${pts[pts.length-1][0].toFixed(1)} ${H-PB} L ${pts[0][0].toFixed(1)} ${H-PB} Z" fill="url(#${id})"/>`;
    }
    g += `<path class="ln" d="${d}" stroke="${s.color}"/>`;
    if (opt.dots && pts.length <= 40) pts.forEach((p,i)=>{
      const dernier = i === pts.length-1;
      if (dernier)
        g += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="8" fill="${s.color}" opacity=".18"/>`+
             `<circle class="last" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5" fill="${s.color}"/>`;
      else g += `<circle class="pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="${s.color}"/>`;
    });
  });
  const leg = series.length>1 ? '<div class="chart-legend">'+series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')+'</div>' : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique">${defs?`<defs>${defs}</defs>`:''}${g}</svg>${leg}`;
}
/* Courbe nue, sans axes, pour poser dans la carte de tête */
function sparkline(data){
  const pts0 = data.map((v,i)=>[i,v]).filter(p=>p[1]!==null&&p[1]!==undefined);
  if (pts0.length < 2) return '';
  const W = 420, H = 88, P = 6;
  const vals = pts0.map(p=>p[1]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo){ hi = lo + 1; lo = Math.max(0, lo - 1); }
  const n = data.length - 1 || 1;
  const X = i => P + i*(W-2*P)/n;
  const Y = v => P + (1-(v-lo)/(hi-lo))*(H-2*P);
  const pts = pts0.map(p=>[X(p[0]), Y(p[1])]);
  const d = smoothPath(pts), last = pts[pts.length-1];
  const id = 'sp'+(++_gid);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L ${last[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5" fill="#fff"/>

}
function barChart(data, labels, opt){
  opt = Object.assign({h:170, color:'var(--moss)', target:null, yfmt:v=>v}, opt||{});
  if (!data.length) return '<p class="muted small">Pas encore de données à afficher.</p>';
  const W=620,H=opt.h,PL=38,PR=10,PT=12,PB=26;
  const hi = Math.max(...data, opt.target||0, 1)*1.15;
  const bw = (W-PL-PR)/data.length;
  const Y = v => PT + (1-v/hi)*(H-PT-PB);
  let g='';
  for(let t=0;t<=3;t++){ const v=hi*t/3, y=Y(v);
    g += `<line class="gl" x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}"/>`+
         `<text class="ax" x="${PL-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${esc(opt.yfmt(Math.round(v)))}</text>`; }
  data.forEach((v,i)=>{
    const x = PL + i*bw + bw*0.20, w = bw*0.60, y = Y(v), h = Math.max(0,(H-PB-y));
    const r = Math.min(w/2, 7);
    g += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${r.toFixed(1)}" fill="${opt.color}" opacity="${v ? (i===data.length-1 ? 1 : 0.55) : 0.18}"/>`;
  });

  labels.forEach((l,i)=>{ if(i%step===0||i===data.length-1)
    g += `<text class="ax" x="${(PL+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`; });
  if (opt.target){ const y=Y(opt.target);
    g += `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="var(--ochre)" stroke-width="1.5" stroke-dasharray="5 4"/>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique">${g}</svg>`;
}

/* Séries hebdomadaires (n dernières semaines) */
function weeks(n){
  const out = [];
  const t = new Date(); t.setHours(0,0,0,0);
  const dow = (t.getDay()+6)%7; t.setDate(t.getDate()-dow);   // lundi de cette semaine
  for (let i=n-1;i>=0;i--){
    const s = new Date(t); s.setDate(s.getDate()-i*7);
    const e = new Date(s); e.setDate(e.getDate()+6);
    out.push({from:s.toISOString().slice(0,10), to:e.toISOString().slice(0,10),
      label: s.getDate()+'/'+String(s.getMonth()+1).padStart(2,'0')});
  }
  return out;
}

/* ---- Lecture + compression d'une photo : carré centré, 512 px, JPEG ---- */
function readSquareImage(file, cb, side){
  if (!file || !/^image\//.test(file.type||'')){ cb(null, "Ce fichier n'est pas une image."); return; }
  const S2 = side || 512, fr = new FileReader();
  fr.onerror = () => cb(null, 'Lecture du fichier impossible.');
  fr.onload = () => {
    const img = new Image();
    img.onerror = () => cb(null, 'Image illisible.');
    img.onload = () => {
      try {
        const m = Math.min(img.width, img.height);
        const sx = (img.width - m)/2, sy = (img.height - m)/2;
        const c = document.createElement('canvas'); c.width = S2; c.height = S2;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,S2,S2);
        ctx.drawImage(img, sx, sy, m, m, 0, 0, S2, S2);
        let q = 0.72, out = c.toDataURL('image/jpeg', q);
        while (out.length > 260000 && q > 0.35){ q -= 0.12; out = c.toDataURL('image/jpeg', q); }
        cb(out, null);
      } catch(e){ cb(null, 'Conversion impossible sur ce navigateur.'); }
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function markNav(){
  const c = currentPage();
  document.querySelectorAll('[data-go]').forEach(b=> b.classList.toggle('on', b.dataset.go===c));
  const sb = $('#suiviBtn'); if (sb) sb.classList.toggle('on', NAV_SUIVI.indexOf(c) >= 0);
  const mb = $('#moreBtn'); if (mb) mb.classList.toggle('on', NAV_PROFIL.indexOf(c) >= 0);
}
function toggleTheme(){
  S.reglages.theme = S.reglages.theme === 'sombre' ? 'clair' : 'sombre';
  document.documentElement.dataset.theme = S.reglages.theme; persist(true);
}
document.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]'); if (g){ go(g.dataset.go); return; }
  if (e.target.closest('#themeBtn') || e.target.closest('#themeBtn2')) toggleTheme();

window.addEventListener('hashchange', () => route());
