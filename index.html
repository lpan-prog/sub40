<script>
/* =========================================================================
   TRACÉ GPS
   Relevé du parcours pendant la balade, distance réelle calculée depuis les
   points, carte affichable et export GPX.

   Un point est stocké en tableau plat [lat, lon, secondes depuis le départ]
   avec 5 décimales (≈ 1 m) : un objet nommé par point ferait tripler la
   taille en mémoire pour rien.
   ========================================================================= */

const GPS = { watch:null, refus:false, dernierMsg:'', perm:'?' };

/* Diagnostic lisible : sans tracé il n'y a pas de carte, autant dire pourquoi */
function diagGeo(){
  const c = contexteGeo();
  const l = [];
  l.push(navigator.geolocation ? ['ok','Le navigateur sait donner la position']
                               : ['ko','Ce navigateur ne gère pas la géolocalisation']);
  l.push(c.httpsOk ? ['ok','Adresse sécurisée (https)']
                   : ['ko','Adresse non sécurisée : la position est refusée par le navigateur. Ouvre l\'application depuis ton adresse GitHub Pages, pas depuis un fichier téléchargé.']);
  l.push(!c.cadre ? ['ok','Page ouverte directement']
                  : ['ko','Page affichée dans un cadre : la position y est souvent bloquée. Ouvre-la dans un onglet à part.']);
  if (GPS.perm === 'granted')  l.push(['ok','Autorisation accordée']);
  else if (GPS.perm === 'denied') l.push(['ko','Autorisation refusée. Réglages du navigateur, puis autorise la position pour ce site.']);
  else if (GPS.perm === 'prompt') l.push(['att','Autorisation pas encore demandée. Touche « Tester la position ».']);
  l.push(GPS.watch !== null ? ['ok','Suivi actif'] : ['att','Suivi arrêté']);
  return l;
}
function majPermission(){
  try {
    if (navigator.permissions && navigator.permissions.query)
      navigator.permissions.query({name:'geolocation'}).then(r=>{
        GPS.perm = r.state;
        const el = document.getElementById('gpsDiag');
        if (el) el.innerHTML = diagHTML();
      }).catch(()=>{});
  } catch(e){}
}
function diagHTML(){
  return diagGeo().map(x=>`<div class="warn-row"><span class="pill ${x[0]==='ok'?'vert':x[0]==='ko'?'rouge':'ochre'}">${x[0]==='ok'?'ok':x[0]==='ko'?'bloqué':'à voir'}</span>
    <div class="small">${esc(x[1])}</div></div>`).join('');
}
/* Demande explicite, déclenchée par un tap : certains navigateurs mobiles
   ignorent watchPosition s'il n'est pas lié à un geste de l'utilisateur. */
function testerPosition(){
  const el = document.getElementById('gpsTestRes');
  if (el) el.innerHTML = '<span class="muted">Recherche en cours…</span>';
  if (!navigator.geolocation){ if (el) el.innerHTML = '<span style="color:var(--rouge)">Géolocalisation indisponible.</span>'; return; }
  navigator.geolocation.getCurrentPosition(
    pos => { GPS.perm = 'granted'; GPS.refus = false; GPS.dernierMsg = '';
      if (el) el.innerHTML = `<span style="color:var(--vert)">Position trouvée, précision ${Math.round(pos.coords.accuracy)} m. Le tracé fonctionnera.</span>`;
      const d = document.getElementById('gpsDiag'); if (d) d.innerHTML = diagHTML();
      if (S.terrain) gpsDemarrer();
    },
    err => { GPS.perm = err.code === 1 ? 'denied' : GPS.perm;
      if (el) el.innerHTML = `<span style="color:var(--rouge)">${esc(err.code===1
        ? "Refusé. Autorise la position pour ce site dans les réglages du navigateur, puis réessaie."
        : err.code===2 ? "Position indisponible. Vérifie que la localisation est activée sur l'appareil."
        : "Trop long. Réessaie à l'extérieur, le signal passe mal en intérieur.")}</span>`;
      const d = document.getElementById('gpsDiag'); if (d) d.innerHTML = diagHTML();
    },
    {enableHighAccuracy:true, timeout:15000, maximumAge:0});
}

/* ---- Distance entre deux points, formule de Haversine, en mètres ---- */
function distM(a, b){
  const R = 6371000, rad = Math.PI/180;
  const dLat = (b[0]-a[0])*rad, dLon = (b[1]-a[1])*rad;
  const la1 = a[0]*rad, la2 = b[0]*rad;
  const x = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1, Math.sqrt(x)));
}
function longueurTrace(pts){
  let d = 0;
  for (let i=1;i<pts.length;i++) d += distM(pts[i-1], pts[i]);
  return d;
}

/* ---- Simplification Douglas-Peucker : garde la forme, jette le bruit ---- */
function simplifier(pts, tol){
  if (pts.length < 3) return pts.slice();
  const garde = new Array(pts.length).fill(false);
  garde[0] = garde[pts.length-1] = true;
  const pile = [[0, pts.length-1]];
  while (pile.length){
    const [i0, i1] = pile.pop();
    let maxD = 0, idx = -1;
    for (let i=i0+1;i<i1;i++){
      const d = distSegment(pts[i], pts[i0], pts[i1]);
      if (d > maxD){ maxD = d; idx = i; }
    }
    if (maxD > tol && idx > 0){ garde[idx] = true; pile.push([i0, idx], [idx, i1]); }
  }
  return pts.filter((p,i)=>garde[i]);
}
function distSegment(p, a, b){
  const la = (a[0]+b[0])/2 * Math.PI/180;
  const mx = 111320*Math.cos(la), my = 110540;
  const px = (p[1]-a[1])*mx, py = (p[0]-a[0])*my;
  const bx = (b[1]-a[1])*mx, by = (b[0]-a[0])*my;
  const l2 = bx*bx + by*by;
  if (!l2) return Math.hypot(px, py);
  let t = (px*bx + py*by)/l2; t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - t*bx, py - t*by);
}

/* ---- Suivi pendant la balade ---- */
function contexteGeo(){
  const httpsOk = location.protocol === 'https:' || location.hostname === 'localhost';
  let cadre = false; try { cadre = window.self !== window.top; } catch(e){ cadre = true; }
  return {httpsOk, cadre};
}
function gpsDemarrer(){
  if (!navigator.geolocation){ GPS.dernierMsg = "Ce navigateur ne donne pas accès à la position."; return; }
  const c = contexteGeo();
  if (!c.httpsOk){
    GPS.refus = true;
    GPS.dernierMsg = "Le tracé demande une adresse en https. Ouvre l'application depuis ton dépôt GitHub Pages plutôt que depuis un fichier local.";
    return;
  }
  if (GPS.watch !== null) return;
  try {
    GPS.watch = navigator.geolocation.watchPosition(gpsPoint, gpsErreur,
      {enableHighAccuracy:true, maximumAge:4000, timeout:20000});
  } catch(e){ GPS.dernierMsg = "Impossible de démarrer le suivi."; }
}
function gpsArreter(){
  if (GPS.watch !== null){ try { navigator.geolocation.clearWatch(GPS.watch); } catch(e){} GPS.watch = null; }
}
function gpsPoint(pos){
  const c = pos.coords;
  /* Avant le départ : on se contente de confirmer que le signal est là */
  if (typeof PREP !== 'undefined' && PREP){
    if (c.accuracy <= 60){
      PREP.points.push(1); PREP.acc = Math.round(c.accuracy); PREP.err = '';
      PREP.pos = [+c.latitude.toFixed(5), +c.longitude.toFixed(5), 0];
      if (PREP.points.length <= 2) rendrePrep();   // la carte est posée, on ne la reconstruit plus
    }
    return;
  }
  const t = S.terrain; if (!t) { gpsArreter(); return; }
  if (c.accuracy > 60) return;                         // relevé trop imprécis
  const p = [ +c.latitude.toFixed(5), +c.longitude.toFixed(5),
              Math.round((Date.now() - t.t0)/1000) ];
  t.gps = t.gps || [];
  const prec = t.gps[t.gps.length-1];
  if (prec && distM(prec, p) < 4) return;              // il est à l'arrêt
  if (prec){
    const dt = p[2] - prec[2], saut = distM(prec, p);
    if (dt > 0 && saut / dt > 14) return;              // plus de 50 km/h : saut GPS, pas une balade
    if (dt <= 0 && saut > 50) return;                  // deux relevés au même instant, très éloignés
  }
  t.gps.push(p);
  GPS.refus = false; GPS.dernierMsg = '';
  const el = document.getElementById('gpsInfo');
  if (el) el.innerHTML = gpsResume(t.gps);
  /* On ne reconstruit la carte que de loin en loin : entre deux, on ne touche
     qu'au tracé et à la position du chien. */
  const hote = document.getElementById('carte-live');
  if (!hote){ if (document.querySelector('.terrain')) openTerrain(); }
  else if (typeof avancerLive === 'function') avancerLive(hote, t.gps);
  persistSoon();
}
function gpsErreur(e){
  GPS.refus = (e && e.code === 1);
  if (typeof PREP !== 'undefined' && PREP){
    PREP.err = GPS.refus ? "Position refusée pour ce site. Tu peux quand même noter la balade, sans tracé."
      : "Signal introuvable pour l'instant.";
    setTimeout(()=>{ if (PREP) rendrePrep(); }, 0);
  }
  const c = contexteGeo();
  GPS.dernierMsg = !GPS.refus ? "Signal GPS indisponible pour le moment."
    : c.cadre ? "La position est bloquée dans cet aperçu. Sur ton dépôt GitHub Pages, le tracé fonctionnera."
    : "Position refusée. Autorise la localisation pour ce site dans les réglages du navigateur.";
  const el = document.getElementById('gpsInfo');
  if (el) el.innerHTML = gpsResume(S.terrain && S.terrain.gps);
}
function gpsResume(pts){
  if (GPS.dernierMsg && (!pts || pts.length < 2)) return `<span class="muted">${esc(GPS.dernierMsg)}</span>`;
  if (!pts || !pts.length) return '<span class="muted">Recherche du signal…</span>';
  if (pts.length < 2) return '<span class="muted">Position trouvée, en attente du déplacement…</span>';
  return `<b>${(longueurTrace(pts)/1000).toFixed(2)} km</b> relevés · ${pts.length} points`;
}

/* ---- Carte : tuiles OpenStreetMap en fond, tracé en SVG par-dessus ---- */
function bbox(pts){
  let laMin=90, laMax=-90, loMin=180, loMax=-180;
  pts.forEach(p=>{ laMin=Math.min(laMin,p[0]); laMax=Math.max(laMax,p[0]);
                   loMin=Math.min(loMin,p[1]); loMax=Math.max(loMax,p[1]); });
  return {laMin, laMax, loMin, loMax};
}
const merX = lo => (lo + 180) / 360;
const merY = la => { const s = Math.sin(la*Math.PI/180);
  return 0.5 - Math.log((1+s)/(1-s)) / (4*Math.PI); };

/* Lissage : moyenne glissante pondérée sur trois points. Assez pour effacer les
   zigzags de mauvais signal, trop faible pour déformer un vrai virage. */
function lisser(pts){
  if (pts.length < 4) return pts.slice();
  const out = [pts[0]];
  for (let i=1;i<pts.length-1;i++){
    const a = pts[i-1], b = pts[i], c = pts[i+1];
    out.push([ +(a[0]*0.25 + b[0]*0.5 + c[0]*0.25).toFixed(6),
               +(a[1]*0.25 + b[1]*0.5 + c[1]*0.25).toFixed(6), b[2] ]);
  }
  out.push(pts[pts.length-1]);
  return out;
}
/* Écarte les points qui s'éloignent brutalement de leurs voisins */
function nettoyer(pts){
  if (pts.length < 5) return pts.slice();
  const out = [pts[0]];
  for (let i=1;i<pts.length-1;i++){
    const d1 = distM(pts[i-1], pts[i]), d2 = distM(pts[i], pts[i+1]), direct = distM(pts[i-1], pts[i+1]);
    if (d1 + d2 > 4 * Math.max(direct, 8) && d1 > 25) continue;   // aller-retour aberrant
    out.push(pts[i]);
  }
  out.push(pts[pts.length-1]);
  return out;
}

/* ---- Carte ----
   Le rendu est entièrement proportionnel : le SVG et les tuiles sont exprimés
   en pourcentages d'un repère logique, et le bloc prend la largeur de son
   conteneur. Aucune mesure de la fenêtre, donc aucun débordement possible. */
function carteHTML(pts, opt){
  opt = Object.assign({ratio:'4 / 3', fond:true, id:'', anim:false, minWin:0.0006}, opt||{});
  if (!pts || !pts.length) return '';
  const seul = pts.length < 2;
  const [rw, rh] = opt.ratio.split('/').map(x=>parseFloat(x));
  const W = 800, H = Math.round(800 * rh / rw), PAD = Math.round(W * 0.11);

  const b = bbox(pts);
  const MIN = opt.minWin;                               // fenêtre plancher
  const cLa = (b.laMin + b.laMax)/2, cLo = (b.loMin + b.loMax)/2;
  const eLa = Math.max(b.laMax - b.laMin, MIN)/2;
  const eLo = Math.max(b.loMax - b.loMin, MIN / Math.max(0.25, Math.cos(cLa*Math.PI/180)))/2;
  b.laMin = cLa - eLa; b.laMax = cLa + eLa;
  b.loMin = cLo - eLo; b.loMax = cLo + eLo;

  const dx = Math.max(1e-7, merX(b.loMax) - merX(b.loMin));
  const dy = Math.max(1e-7, merY(b.laMin) - merY(b.laMax));
  let z = Math.floor(Math.min(Math.log2((W-2*PAD)/(dx*256)), Math.log2((H-2*PAD)/(dy*256))));
  z = Math.max(1, Math.min(19, z + (opt.dz||0)));
  const S2 = 256 * Math.pow(2, z);
  let cx, cy;
  if (opt.cx !== undefined && opt.cx !== null){ cx = opt.cx * S2; cy = opt.cy * S2; }
  else { cx = (merX(b.loMin)+merX(b.loMax))/2 * S2; cy = (merY(b.laMin)+merY(b.laMax))/2 * S2; }
  const ox = cx - W/2, oy = cy - H/2;
  const PX = p => [merX(p[1])*S2 - ox, merY(p[0])*S2 - oy];
  const pc = (v, tot) => (v/tot*100).toFixed(4) + '%';

  let tuiles = '';
  const fond = opt.fond && S.reglages.carte !== 'off';
  if (fond){
    const t0x = Math.floor(ox/256), t1x = Math.floor((ox+W)/256);
    const t0y = Math.floor(oy/256), t1y = Math.floor((oy+H)/256);
    const max = Math.pow(2, z);
    for (let tx=t0x; tx<=t1x; tx++) for (let ty=t0y; ty<=t1y; ty++){
      if (ty < 0 || ty >= max) continue;
      const wx = ((tx % max) + max) % max;
      tuiles += `<img class="tuile" src="https://tile.openstreetmap.org/${z}/${wx}/${ty}.png"
        style="left:${pc(tx*256-ox, W)};top:${pc(ty*256-oy, H)};width:${pc(256, W)};height:${pc(256, H)}"
        alt="" loading="lazy" onload="this.closest('.carte').classList.add('avec-tuiles')"
        onerror="this.style.display='none'">`;
    }
  }

  const d = pts.map((p,i)=>{ const q = PX(p); return (i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1); }).join(' ');
  const a = PX(pts[0]), f = PX(pts[pts.length-1]);
  const km = (longueurTrace(pts)/1000).toFixed(2);
  const halo = seul ? `<circle class="halo" cx="${f[0].toFixed(1)}" cy="${f[1].toFixed(1)}" r="26"
      fill="var(--moss)" opacity=".18"/>` : '';
  const tr = (typeof preparerTrace === 'function') ? preparerTrace(pts, PX) : null;
  const anim = !!opt.anim;

  return `<div class="carte${fond?'':' sans-fond'}${anim?' animable':''}${opt.gestes?' gestes':''}" style="aspect-ratio:${opt.ratio}"
      ${opt.id?`id="${opt.id}"`:''} data-proj='${JSON.stringify({S:S2, ox, oy})}'
      data-vue='${JSON.stringify({z, dz:opt.dz||0, cx:opt.cx||null, cy:opt.cy||null})}'
      ${tr?`data-tr='${JSON.stringify({p:tr.p.map(q=>[+q[0].toFixed(1),+q[1].toFixed(1)]),d:tr.d.map(x=>+x.toFixed(1)),total:+tr.total.toFixed(1)})}'`:''}>
    <div class="carte-in">
      ${tuiles}
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        ${halo}
        <path class="trace-fond" d="${d}" fill="none" stroke="#fff" stroke-width="20"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path class="trace-anim" d="${d}" fill="none" stroke="var(--moss)" stroke-width="12"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path class="trace-live" d="" fill="none" stroke="#fff" stroke-width="20"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path class="trace-live2" d="" fill="none" stroke="var(--moss)" stroke-width="12"
              stroke-linecap="round" stroke-linejoin="round"/>
        ${seul ? '' : `<circle cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="14" fill="#fff"/>
        <circle cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="14" fill="none" stroke="var(--moss)" stroke-width="5"/>`}
        <g class="pas-semis">${(tr && !seul && typeof empreintes === 'function') ? empreintes(tr) : ''}</g>
        <g class="chien" transform="translate(${f[0].toFixed(1)} ${f[1].toFixed(1)})">
          <circle class="pos-halo" r="17" fill="var(--moss)" opacity=".22"/>
          <circle class="pos-pt" r="9" fill="var(--moss)" stroke="#fff" stroke-width="4.5"/>
        </g>
      </svg>
    </div>
    ${opt.direct?'<div class="carte-live-badge"><i></i>en direct</div>':''}
    ${opt.gestes?`<div class="carte-outils">
      <button data-zoom="1" aria-label="Zoomer">+</button>
      <button data-zoom="-1" aria-label="Dézoomer">−</button>
      <button data-recentrer aria-label="Recentrer">⌖</button></div>`:''}
    <div class="carte-pied">
      <div class="stats">
        ${seul ? '<span class="s1">Prêt</span><span class="s2">position trouvée</span>'
               : `<span class="s1">${km}<small> km</small></span>${opt.sous?`<span class="s2">${esc(opt.sous)}</span>`:''}`}
      </div>
      ${fond?'<span class="attr">© OpenStreetMap</span>':''}
    </div>
  </div>`;
}

/* ---- Export GPX, ouvrable dans n'importe quelle appli de rando ---- */
function exportGPX(id){
  const b = S.balades.find(x=>x.id===id);
  if (!b || !b.gps || b.gps.length < 2){ toast('Cette balade n\'a pas de tracé.'); return; }
  const t0 = new Date((b.date||todayISO()) + 'T' + (b.heure||'12:00') + ':00');
  const pts = b.gps.map(p=>{
    const d = new Date(t0.getTime() + (p[2]||0)*1000);
    return `   <trkpt lat="${p[0]}" lon="${p[1]}"><time>${d.toISOString()}</time></trkpt>`;
  }).join('\n');
  const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Carnet de chien" xmlns="http://www.topografix.com/GPX/1/1">
 <trk><name>${esc((S.chien.nom||'Balade')+' — '+fdate(b.date))}</name>
  <trkseg>
${pts}
  </trkseg></trk>
</gpx>`;
  download('balade-' + (b.date||'') + '.gpx', gpx, 'application/gpx+xml');
  toast('Tracé exporté en GPX.');
}
</script>

<script>
/* ---- Gestes sur la carte ----
   Pendant le geste on ne touche qu'au transform du conteneur, donc rien n'est
   rechargé ni recalculé ; les tuiles ne sont régénérées qu'au relâchement. */
const VUES = {};
function activerGestes(hote, refaire){
  if (!hote || hote.dataset.gestesOk) return;
  hote.dataset.gestesOk = '1';
  const inner = hote.querySelector('.carte-in');
  let dx = 0, dy = 0, k = 1, x0 = 0, y0 = 0, d0 = 0, actif = false;

  const appliquer = () => { inner.style.transform = `translate3d(${dx}px,${dy}px,0) scale(${k})`; };
  const dist = t => Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);

  hote.addEventListener('touchstart', e => {
    if (e.touches.length === 1){ actif = true; x0 = e.touches[0].clientX - dx; y0 = e.touches[0].clientY - dy; }
    else if (e.touches.length === 2){ actif = true; d0 = dist(e.touches) / k; }
  }, {passive:true});

  hote.addEventListener('touchmove', e => {
    if (!actif) return;
    e.preventDefault();
    if (e.touches.length === 1){ dx = e.touches[0].clientX - x0; dy = e.touches[0].clientY - y0; }
    else if (e.touches.length === 2 && d0){ k = Math.max(0.5, Math.min(4, dist(e.touches)/d0)); }
    appliquer();
  }, {passive:false});

  const fin = () => {
    if (!actif) return;
    actif = false;
    if (Math.abs(dx) < 4 && Math.abs(dy) < 4 && Math.abs(k-1) < 0.06){ dx=dy=0; k=1; appliquer(); return; }
    const r = hote.getBoundingClientRect();
    const proj = JSON.parse(hote.dataset.proj), vue = JSON.parse(hote.dataset.vue);
    const ech = r.width / 800;                       // repère logique vers pixels réels
    const S2 = proj.S;
    /* Le centre visé, exprimé en fraction de la projection courante */
    const cxPx = proj.ox + (400 - dx/ech/k);
    const cyPx = proj.oy + (300*(vue.hLog||1) - dy/ech/k);
    const dz = vue.dz + Math.round(Math.log2(k));
    dx=dy=0; k=1; appliquer();
    refaire({cx: cxPx/S2, cy: cyPx/S2, dz});
  };
  hote.addEventListener('touchend', fin, {passive:true});
  hote.addEventListener('touchcancel', fin, {passive:true});

  hote.querySelectorAll('[data-zoom]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const proj = JSON.parse(hote.dataset.proj), vue = JSON.parse(hote.dataset.vue);
    refaire({cx:(proj.ox+400)/proj.S, cy:(proj.oy+300)/proj.S, dz: vue.dz + Number(b.dataset.zoom)});
  });
  const rc = hote.querySelector('[data-recentrer]');
  if (rc) rc.onclick = e => { e.stopPropagation(); refaire({cx:null, cy:null, dz:0}); };
}
</script><script>
/* =========================================================================
   CHIEN ANIMÉ SUR LE TRACÉ
   Le chien est la tête du tracé : il avance le long du parcours, s'oriente
   dans le sens de la marche, et la ligne se dessine derrière lui.

   Deux contraintes de performance :
   — on ne reconstruit jamais la carte, on ne touche qu'à deux attributs
     (le transform du chien et le stroke-dashoffset du tracé) ;
   — l'animation s'arrête dès que la carte sort de l'écran ou que l'onglet
     passe en arrière-plan.
   ========================================================================= */

/* Empreinte, reprise du logo : quatre coussinets et une pelote, orientée vers
   le haut dans son repère pour qu'une rotation la pointe dans le sens du pas. */
const PATTE_SVG = `<g class="patte-g">
  <ellipse cx="-3.1" cy="-2.2" rx="1.15" ry="1.55"/>
  <ellipse cx="-0.9" cy="-3.4" rx="1.15" ry="1.6"/>
  <ellipse cx="1.5" cy="-2.9" rx="1.1" ry="1.45"/>
  <ellipse cx="3.4" cy="-1.1" rx="1.05" ry="1.35"/>
  <path d="M0 0.1c1.95 0 3.35 1.4 3.35 2.95 0 1.3-1 2-2.15 2-.68 0-.88-.28-1.55-.28s-.88.28-1.55.28c-1.15 0-2.15-.7-2.15-2C-4.05 1.5-2.55.1 0 .1Z"/>
</g>`;
const CHIEN_SVG = PATTE_SVG;   // compatibilité avec l'ancien nom

const ANIM = {actifs:new Map()};

/* Longueurs cumulées, pour avancer à vitesse constante quel que soit l'espacement */
/* Semis d'empreintes le long du tracé : une tous les 46 px, décalées
   alternativement de part et d'autre de l'axe, comme une vraie foulée. */
function empreintes(tr, opt){
  opt = Object.assign({pas:58, ecart:9, depuis:0}, opt||{});
  let out = '', i = 0;
  for (let d = opt.depuis; d <= tr.total; d += opt.pas, i++){
    const q = pointA(tr, d);
    const cote = (i % 2 ? 1 : -1) * opt.ecart;
    const r = (q.ang + 90) * Math.PI/180;
    const x = q.x + Math.cos(r)*cote, y = q.y + Math.sin(r)*cote;
    out += `<g class="pas" style="animation-delay:${(i*0.045).toFixed(2)}s"
      transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(q.ang+90).toFixed(1)}) scale(1.7)">${PATTE_SVG}</g>`;
  }
  return out;
}
function preparerTrace(pts, PX){
  const p = pts.map(PX), d = [0];
  for (let i=1;i<p.length;i++) d.push(d[i-1] + Math.hypot(p[i][0]-p[i-1][0], p[i][1]-p[i-1][1]));
  return {p, d, total:d[d.length-1] || 1};
}
function pointA(tr, dist){
  const {p, d} = tr;
  let i = 1;
  while (i < d.length-1 && d[i] < dist) i++;
  const t = (d[i] - d[i-1]) ? (dist - d[i-1]) / (d[i] - d[i-1]) : 0;
  const x = p[i-1][0] + (p[i][0]-p[i-1][0])*t, y = p[i-1][1] + (p[i][1]-p[i-1][1])*t;
  const ang = Math.atan2(p[i][1]-p[i-1][1], p[i][0]-p[i-1][0]) * 180/Math.PI;
  return {x, y, ang};
}

/* ---- Rejeu d'une balade terminée ---- */
function rejouer(baladeId){
  const b = S.balades.find(x=>x.id===baladeId);
  if (!b || !b.gps || b.gps.length < 2) return;
  const hote = document.getElementById('carte-'+baladeId);
  if (!hote) return;
  const svg = hote.querySelector('svg');
  const ligne = svg.querySelector('.trace-anim');
  const fond = svg.querySelector('.trace-fond');
  const chien = svg.querySelector('.chien');
  if (!ligne || !chien) return;

  arreterAnim(baladeId);
  chien.style.opacity = 0;
  const lg = ligne.getTotalLength();
  const tr = JSON.parse(hote.dataset.tr);
  const reduit = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduit){                                    /* version instantanée */
    [ligne, fond].forEach(l=>{ if(!l) return; l.style.strokeDasharray = 'none'; l.style.strokeDashoffset = 0; });
    const f = pointA(tr, tr.total);
    chien.setAttribute('transform', `translate(${f.x} ${f.y}) rotate(${f.ang})`);
    chien.style.opacity = 1;
    return;
  }

  /* Entre 3 et 8 s selon la longueur, comme demandé */
  const duree = Math.min(8000, Math.max(3000, tr.total * 6));
  [ligne, fond].forEach(l=>{ if(!l) return; l.style.strokeDasharray = lg; l.style.strokeDashoffset = lg; });
  chien.style.opacity = 1;
  const t0 = performance.now();

  const pas = (t) => {
    const e = Math.min(1, (t - t0) / duree);
    const k = e < .5 ? 2*e*e : 1 - Math.pow(-2*e+2, 2)/2;   // accélère puis ralentit
    const off = lg * (1 - k);
    ligne.style.strokeDashoffset = off;
    if (fond) fond.style.strokeDashoffset = off;
    const q = pointA(tr, tr.total * k);
    chien.setAttribute('transform', `translate(${q.x.toFixed(2)} ${q.y.toFixed(2)}) rotate(${q.ang.toFixed(1)})`);
    if (e < 1) ANIM.actifs.set(baladeId, requestAnimationFrame(pas));
    else { ANIM.actifs.delete(baladeId); chien.classList.add('arrive'); }
  };
  ANIM.actifs.set(baladeId, requestAnimationFrame(pas));
}
function arreterAnim(id){
  const h = ANIM.actifs.get(id);
  if (h){ cancelAnimationFrame(h); ANIM.actifs.delete(id); }
}
function arreterToutesAnims(){ ANIM.actifs.forEach((h)=>cancelAnimationFrame(h)); ANIM.actifs.clear(); }

/* Un onglet en arrière-plan ne doit rien animer */
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ arreterToutesAnims();
    if (LIVE.raf){ cancelAnimationFrame(LIVE.raf); LIVE.raf = null; } }
});

/* ---- Tracé en direct ----
   Le GPS ne livre un point que toutes les quelques secondes : sans
   interpolation, le chien saute. On anime donc chaque segment image par image,
   en n'écrivant que deux attributs de path et le transform du chien. */
const LIVE = {raf:null, fin:0};
function avancerLive(hote, pts){
  const proj = JSON.parse(hote.dataset.proj || 'null');
  if (!proj || pts.length < 2) return;
  const PX = p => [merX(p[1])*proj.S - proj.ox, merY(p[0])*proj.S - proj.oy];
  const svg = hote.querySelector('svg');
  const base = svg.querySelector('.trace-anim'), baseF = svg.querySelector('.trace-fond');
  const seg = svg.querySelector('.trace-live2'), segF = svg.querySelector('.trace-live');
  const chien = svg.querySelector('.chien');
  if (!base || !seg || !chien) return;

  const px = pts.map(PX);
  /* Recadrer seulement si l'on sort de la zone utile, sinon on reconstruirait
     la carte à chaque pas et l'animation sauterait. */
  const vb = (svg.getAttribute('viewBox')||'0 0 800 600').split(' ').map(Number);
  const d0 = px[px.length-1];
  if (d0[0] < vb[2]*0.08 || d0[0] > vb[2]*0.92 || d0[1] < vb[3]*0.08 || d0[1] > vb[3]*0.92){
    if (typeof openTerrain === 'function') openTerrain();
    return;
  }

  const fige = px.slice(0, -1);
  const dFige = fige.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  base.setAttribute('d', dFige); if (baseF) baseF.setAttribute('d', dFige);

  const a = px[px.length-2], b = px[px.length-1];
  const ang = Math.atan2(b[1]-a[1], b[0]-a[0]) * 180/Math.PI;
  const reduit = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduit){
    poser(seg, segF, a, b, 1); placer(chien, b, ang);
    hote.dataset.tr = trDe(px);
    return;
  }
  if (LIVE.raf) cancelAnimationFrame(LIVE.raf);
  const t0 = performance.now(), duree = 900;
  const pas = (t) => {
    const e = Math.min(1, (t - t0)/duree);
    const k = 1 - Math.pow(1 - e, 3);                     // ralenti en fin de course
    poser(seg, segF, a, b, k);
    placer(chien, [a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k], ang);
    if (e < 1) LIVE.raf = requestAnimationFrame(pas);
    else { LIVE.raf = null; hote.dataset.tr = trDe(px); }
  };
  LIVE.raf = requestAnimationFrame(pas);
}
function poser(seg, segF, a, b, k){
  const d = `M${a[0].toFixed(1)} ${a[1].toFixed(1)} L${(a[0]+(b[0]-a[0])*k).toFixed(1)} ${(a[1]+(b[1]-a[1])*k).toFixed(1)}`;
  seg.setAttribute('d', d); if (segF) segF.setAttribute('d', d);
}
function placer(chien, p, ang){
  chien.setAttribute('transform', `translate(${p[0].toFixed(2)} ${p[1].toFixed(2)}) rotate(${ang.toFixed(1)})`);
  chien.style.opacity = 1;
}
function trDe(px){
  const d = [0];
  for (let i=1;i<px.length;i++) d.push(d[i-1] + Math.hypot(px[i][0]-px[i-1][0], px[i][1]-px[i-1][1]));
  return JSON.stringify({p:px.map(q=>[+q[0].toFixed(1),+q[1].toFixed(1)]),
    d:d.map(x=>+x.toFixed(1)), total:+(d[d.length-1]||1).toFixed(1)});
}

/* Allonge le tracé et déplace le chien sans redessiner la carte */
function allongerTraceLive(hote, pts){
  const tr = JSON.parse(hote.dataset.tr || 'null');
  if (!tr || pts.length <= tr.p.length) { majChienDirect(); return; }
  const svg = hote.querySelector('svg');
  const lignes = svg.querySelectorAll('path');
  if (!lignes.length) return;
  /* La projection est figée par la carte en place : on la retrouve depuis deux
     points connus, ce qui évite de recalculer le zoom à chaque relevé. */
  const proj = JSON.parse(hote.dataset.proj || 'null');
  if (!proj) return;
  const PX = p => [merX(p[1])*proj.S - proj.ox, merY(p[0])*proj.S - proj.oy];
  const t2 = preparerTrace(pts, PX);
  const d = t2.p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  lignes.forEach(l=> l.setAttribute('d', d));
  hote.dataset.tr = JSON.stringify({p:t2.p.map(q=>[+q[0].toFixed(1),+q[1].toFixed(1)]),
    d:t2.d.map(x=>+x.toFixed(1)), total:+t2.total.toFixed(1)});
  majChienDirect();
}

/* ---- Chien en tête du tracé pendant la balade ---- */
function majChienDirect(){
  const t = S.terrain;
  const hote = document.getElementById('carte-live');
  if (!t || !t.gps || t.gps.length < 2 || !hote) return;
  const chien = hote.querySelector('.chien');
  if (!chien) return;
  const tr = JSON.parse(hote.dataset.tr || 'null');
  if (!tr) return;
  const f = pointA(tr, tr.total);
  chien.setAttribute('transform', `translate(${f.x.toFixed(2)} ${f.y.toFixed(2)}) rotate(${f.ang.toFixed(1)})`);
  chien.style.opacity = 1;
}

<script>
/* =========================================================================
   6. FORMULAIRES GÉNÉRIQUES
   ========================================================================= */
function fld(d, data){
  const v = data && data[d.k] !== undefined ? data[d.k] : (d.def !== undefined ? d.def : '');
  const hint = d.hint ? ` <span class="hint">${esc(d.hint)}</span>` : '';
  const head = `<span>${esc(d.l)}${hint}</span>`;
  const A = `data-k="${d.k}"`;
  switch(d.t){
    case 'select':
      return `<label class="f">${head}<select ${A}>${d.opts.map(o=>{
        const [val,lab] = Array.isArray(o)?o:[o,o];
        return `<option value="${esc(val)}"${String(v)===String(val)?' selected':''}>${esc(lab)}</option>`;}).join('')}</select></label>`;
    case 'textarea':
      return `<label class="f">${head}<textarea ${A} placeholder="${esc(d.ph||'')}" rows="${d.rows||3}">${esc(v)}</textarea></label>`;
    case 'check':
      return `<label class="inline-check"><input type="checkbox" ${A}${v?' checked':''}> ${esc(d.l)}</label>`;
    case 'emo':
      return `<div class="emo-input" data-emo="${d.k}">${head}
        <input type="range" min="0" max="10" step="1" ${A} value="${num(v)||0}">
        <div class="scale"><span class="mk" style="left:${(num(v)||0)*10}%"></span></div>
        <div class="scale-legend"><span>0 détendu</span><span class="val num">${num(v)||0}/10</span><span>10 débordé</span></div></div>`;
    case 'range':
      return `<div class="emo-input" data-emo="${d.k}">${head}
        <input type="range" min="${d.min||0}" max="${d.max||5}" step="1" ${A} value="${num(v)||0}">
        <div class="scale-legend"><span>${esc(d.lo||'0')}</span><span class="val num">${num(v)||0}</span><span>${esc(d.hi||d.max||'5')}</span></div></div>`;
    default:
      return `<label class="f">${head}<input type="${d.t||'text'}" ${A} value="${esc(v)}" placeholder="${esc(d.ph||'')}"${d.step?` step="${d.step}"`:''}${d.min!==undefined?` min="${d.min}"`:''}></label>`;
  }
}
function group(title, defs, data, cols){
  return `<details class="acc"${title.open?' open':''}><summary>${esc(title.t||title)}</summary><div class="in">
    <div class="grid ${cols||'g2'}">${defs.map(d=>fld(d,data)).join('')}</div></div></details>`;
}
function plain(defs, data, cols){ return `<div class="grid ${cols||'g2'}">${defs.map(d=>fld(d,data)).join('')}</div>`; }
function readForm(root){
  const o = {};
  root.querySelectorAll('[data-k]').forEach(el=>{
    if (el.type === 'checkbox') o[el.dataset.k] = el.checked;
    else if (el.type === 'number' || el.type === 'range') o[el.dataset.k] = el.value === '' ? '' : num(el.value);
    else o[el.dataset.k] = el.value;
  });
  return o;
}
/* Sliders vivants */
document.addEventListener('input', e=>{
  const w = e.target.closest('[data-emo]'); if (!w || e.target.type !== 'range') return;
  const v = num(e.target.value), mk = w.querySelector('.mk'), val = w.querySelector('.val');
  const max = num(e.target.max)||10;
  if (mk) mk.style.left = (v/max*100)+'%';
  if (val) val.textContent = w.dataset.emo && e.target.max === '10' ? v+'/10' : v;
});

/* =========================================================================
   7. PANNEAU LATÉRAL
   ========================================================================= */
let sheetSave = null;
function openSheet(title, sub, body, onSave, saveLabel){
  sheetSave = onSave;
  $('#sheetHost').innerHTML = `<div class="sheet-mask" id="mask"><div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <div><h2>${esc(title)}</h2>${sub?`<p class="small muted" style="margin:3px 0 0">${sub}</p>`:''}</div>
      <div class="row" style="flex-wrap:nowrap">
        ${onSave?`<button class="btn sm" id="sheetSaveBtn">${esc(saveLabel||'Enregistrer')}</button>`:''}
        <button class="icon-btn" id="sheetClose" aria-label="Fermer">✕</button>
      </div>
    </div>
    <div class="sheet-body" id="sheetBody">${body}</div></div></div>`;
  document.body.style.overflow = 'hidden';
  document.documentElement.classList.add('sheet-open');
  $('#sheetClose').onclick = closeSheet;
  $('#mask').addEventListener('mousedown', e=>{ if(e.target.id==='mask') closeSheet(); });
  const b = $('#sheetSaveBtn'); if (b) b.onclick = ()=>{ const d = readForm($('#sheetBody')); if (sheetSave(d) !== false) closeSheet(); };
}
function closeSheet(){ $('#sheetHost').innerHTML=''; document.body.style.overflow='';
  document.documentElement.classList.remove('sheet-open'); sheetSave=null; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('#sheetHost').innerHTML) closeSheet(); });

/* Suppression générique */
/* Confirmation maison : confirm() est bloqué dans les iframes sans allow-modals,
   ce qui rendait tous les boutons de suppression silencieusement inopérants. */
function demander(opt, onOui){
  const o = Object.assign({titre:'Confirmer', texte:'', ok:'Confirmer', danger:false}, opt||{});
  const h = document.createElement('div');
  h.className = 'dialog-mask';
  h.innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(o.titre)}">
    <h3>${esc(o.titre)}</h3>
    ${o.texte?`<p class="small" style="margin:8px 0 0;color:var(--ink-2)">${esc(o.texte)}</p>`:''}
    <div class="row" style="margin-top:20px;justify-content:flex-end">
      <button class="btn ghost" data-non>Annuler</button>
      <button class="btn${o.danger?' danger':''}" data-oui>${esc(o.ok)}</button>
    </div></div>`;
  document.body.appendChild(h);
  const fermer = () => { h.remove(); document.removeEventListener('keydown', touche); };
  function touche(e){ if (e.key === 'Escape') fermer(); }
  document.addEventListener('keydown', touche);
  h.querySelector('[data-non]').onclick = fermer;
  h.onclick = e => { if (e.target === h) fermer(); };
  h.querySelector('[data-oui]').onclick = () => { fermer(); onOui(); };
  try { h.querySelector('[data-oui]').focus(); } catch(e){}
}

function del(coll, id, label){
  demander({titre:'Supprimer ' + (label||'cet élément') + ' ?',
    texte:'Cette action est définitive.', ok:'Supprimer', danger:true},
    () => delMaintenant(coll, id));
}
function delMaintenant(coll, id){
  S[coll] = S[coll].filter(x=>x.id!==id); commit('Supprimé.');
}
function upsert(coll, obj){
  const i = S[coll].findIndex(x=>x.id===obj.id);
  if (i>=0) S[coll][i] = obj; else S[coll].push(obj);
}

/* =========================================================================
   8. ROUTEUR
   ========================================================================= */
const VIEWS = {};
/* On ne remonte en haut qu'en changeant de page. Cocher une tâche, épingler une
   fiche ou supprimer une ligne redessine la vue : rester là où on lisait. */
let pagePrec = null;
function route(){
  const p = currentPage();
  const y = (p === pagePrec) ? (window.scrollY || window.pageYOffset || 0) : 0;
  $('#view').innerHTML = (typeof liveBar === 'function' ? liveBar() : '') + (VIEWS[p] || VIEWS.accueil)();
  markNav();
  if (typeof brancherCartes === 'function') brancherCartes();
  try { window.scrollTo(0, y); } catch(e){}
  pagePrec = p;
  const fab = $('#fab');
  const setFab = (txt, name, fn) => {
    fab.innerHTML = `<span class="fi">${ico(name)}</span><span class="ft">${esc(txt)}</span>`;
    fab.setAttribute('aria-label', txt); fab.onclick = fn;
  };
  fab.classList.toggle('actif', !!S.terrain);
  if (S.terrain)            setFab(hms(tElapsed()), 'chrono', ()=>openTerrain());
  else if (p==='ordres')    setFab('Nouvel ordre',  'plus', ()=>formOrdre());
  else if (p==='sessions')  setFab('Nouvelle séance','plus', ()=>formSession());
  else if (p==='journal')   setFab('Ajouter la journée','plus', ()=>formJournal());
  else if (p==='sante')     setFab('Nouveau soin',  'plus', ()=>formSante());
  else if (p==='poids')     setFab('Nouvelle pesée','plus', ()=>formPoids());
  else                      setFab('Démarrer une balade', 'play', ()=>terrainStart());
}
function head(t, lede, actions){
  return `<div class="view-head"><div><h1>${esc(t)}</h1>${lede?`<p class="lede">${lede}</p>`:''}</div>
    <div class="row no-print">${actions||''}</div></div>`;
}
function empty(titre, txt, btn){
  return `<div class="empty"><h3>${esc(titre)}</h3><p class="small">${txt}</p>${btn||''}</div>`;
}
function kpi(k, v, u, d, cls){
  return `<div class="kpi"><div class="k">${esc(k)}</div><div class="v">${v}${u?`<span class="u">${esc(u)}</span>`:''}</div>
    ${d?`<div class="d ${cls||'flat'}">${d}</div>`:''}</div>`;
}

<script>
/* =========================================================================
   RACE ET GROUPE FONCTIONNEL

   Une race ne dit pas ce qu'un chien est, elle dit ce pour quoi sa lignée a
   été sélectionnée. Un beagle a été retenu pendant des siècles pour suivre
   une piste en se coupant du reste : lui reprocher un rappel moyen avec la
   même exigence qu'à un border collie n'a pas de sens.

   On module donc trois choses, et rien d'autre :
   — les objectifs hebdomadaires par défaut (durée, part de flair) ;
   — la distance et la durée de référence du score de balade ;
   — la tolérance de notation sur trois axes (rappel, marche, calme).

   Aucune modulation ne dépasse ±25 %. Le chien réel prime toujours : ces
   valeurs ne servent qu'à fixer un point de départ raisonnable.
   ========================================================================= */

const GROUPES = [
  {id:'berger',   t:'Chien de berger et de conduite',
   min:75, flair:30, km:5.0, rappel:1.10, laisse:1.05, calme:0.90,
   note:"Sélectionné pour travailler en lien constant avec l'humain : le rappel vient vite, le besoin d'occupation mentale est élevé et l'ennui se transforme vite en agitation."},
  {id:'courant',  t:'Chien courant et de chasse',
   min:80, flair:50, km:6.0, rappel:0.78, laisse:0.92, calme:1.00,
   note:"Sélectionné pour suivre une piste loin du maître. Un rappel imparfait n'est pas un échec d'éducation, c'est une lignée : la longe reste la règle plus longtemps, et le flair est un besoin, pas un loisir."},
  {id:'rapporteur',t:'Retriever et chien d\'eau',
   min:70, flair:35, km:5.0, rappel:1.12, laisse:1.00, calme:0.95,
   note:"Sélectionné pour rapporter au maître : le retour est naturel, mais l'excitation monte vite sur les objets en mouvement et le contrôle de l'impulsion demande du travail."},
  {id:'terrier',  t:'Terrier',

const groupeById = id => GROUPES.find(g=>g.id===id) || GROUPES[GROUPES.length-1];

/* Races courantes en France, rattachées à leur groupe fonctionnel */
const RACES = [
  ['Berger australien','berger'], ['Border collie','berger'], ['Berger allemand','utilite'],
  ['Berger belge malinois','utilite'], ['Beauceron','berger'], ['Bouvier bernois','garde'],
  ['Labrador retriever','rapporteur'], ['Golden retriever','rapporteur'], ['Épagneul breton','courant'],
  ['Cocker spaniel','courant'], ['Beagle','courant'], ['Braque','courant'], ['Setter','courant'],
  ['Teckel','terrier'], ['Jack russell','terrier'], ['Fox terrier','terrier'],

  ['Croisé','inconnu'], ['Autre ou inconnue','inconnu']
];

/* Groupe retenu : celui choisi explicitement, sinon déduit du nom de la race */
function groupeChien(){
  if (S.chien.groupe) return groupeById(S.chien.groupe);
  const r = (S.chien.race||'').toLowerCase().trim();
  if (!r) return groupeById('inconnu');
  const t = RACES.find(x=>r.includes(x[0].toLowerCase()) || x[0].toLowerCase().includes(r));
  return groupeById(t ? t[1] : 'inconnu');
}

/* Objectifs de départ, tant que l'utilisateur ne les a pas réglés lui-même */
function objectifsDefaut(){
  const g = groupeChien();
  return {baladesSem:10, minutesSem:Math.round(g.min*7/10)*10, sessionsSem:5, flairPct:g.flair};
}
/* Facteur appliqué à la note d'un axe : au-dessus de 1, on est plus indulgent */
function toleranceAxe(id){
  const g = groupeChien();
  if (id === 'rappel') return g.rappel;
  if (id === 'laisse') return g.laisse;
  if (id === 'calme')  return g.calme;
  return 1;
}
function refDistance(){ return groupeChien().km; }

/* Phrase affichée quand la lignée explique une difficulté */
function motGroupe(axeId){
  const g = groupeChien();
  const f = toleranceAxe(axeId);
  if (g.id === 'inconnu' || Math.abs(f-1) < 0.06) return '';
  return f > 1
    ? `Sa lignée (${g.t.toLowerCase()}) le prédispose plutôt bien sur cet axe : l'exigence est donc un cran plus haute.`
    : `Sa lignée (${g.t.toLowerCase()}) joue contre lui sur cet axe : la note est ajustée en conséquence, il n'y a pas de retard à rattraper.`;
}

<script>
/* =========================================================================
   COACH
   Six axes de comportement, notés sur les données réelles, comparés à la
   période précédente. L'axe le plus en difficulté détermine l'exercice
   recommandé — et surtout la raison, qui doit être vérifiable par
   l'utilisateur dans ses propres chiffres.

   Chaque axe expose : score 0-100, tendance, volume de données, phrase
   d'explication, exercices rattachés.
   ========================================================================= */

const AXES = [
  {id:'calme',       t:'Calme',        lg:'Calme et gestion émotionnelle',
   cats:['emo','sig'],  exos:['tapis','valoriser-calme','calme-avant','marche-redescente','fin-balade-calme']},
  {id:'rappel',      t:'Rappel',       lg:'Rappel et liberté',
   cats:['rap'],        exos:['rappel-positif','rappel-facile','jackpot','longe','seuil-rappel','cache-cache']},
  {id:'croisements', t:'Croisements',  lg:'Croisements et socialisation',
   cats:['soc'],        exos:['croisement-calme','banc-obs','rencontre-courte','obs-distance','bons-compagnons']},
  {id:'laisse',      t:'Marche',       lg:'Marche en laisse',
   cats:['bal'],        exos:['marche-laisse','demi-tour','balade-lente','quart-heure','chasse-friandises']},
  {id:'connexion',   t:'Connexion',    lg:'Attention et connexion',
   cats:['rel'],        exos:['regard-volontaire','retours-spontanes','recompenser-detachement','regles-constantes']},
  {id:'quotidien',   t:'Quotidien',    lg:'Autonomie et vie à la maison',
   cats:['quot','base','chiot'], exos:['solitude','assis','couche','pas-bouger','piece-refuge','manipulation']}
];
const axeById = id => AXES.find(a=>a.id===id) || AXES[0];

/* Les exercices d'un axe, quels que soient les identifiants réellement présents */
function exosAxe(a){
  const ids = new Set();
  (a.exos||[]).forEach(id=>{ if (EXOS.some(e=>e.id===id)) ids.add(id); });
  EXOS.forEach(e=>{ if ((a.cats||[]).includes(e.cat)) ids.add(e.id); });
  return [...ids].map(id=>EXOS.find(e=>e.id===id));
}

/* ---- Mesure d'un axe sur une fenêtre de jours ---- */
function mesureAxe(id, jours, decalage){
  const fin = addDays(todayISO(), -(decalage||0));
  const debut = addDays(fin, -jours + 1);
  const B = S.balades.filter(b=>b.date >= debut && b.date <= fin);
  const J = S.journal.filter(j=>j.date >= debut && j.date <= fin);
  const G = S.signaux.filter(s=>s.date >= debut && s.date <= fin);
  const moy = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
  const som = (arr, k) => arr.reduce((a,x)=>a+num(x[k]), 0);

  if (id === 'calme'){
    const fins = B.filter(b=>b.emoFin!=='' && b.emoFin!==undefined).map(b=>num(b.emoFin));
    const jours_ = J.filter(j=>j.emo!=='' && j.emo!==undefined).map(j=>num(j.emo));
    const vals = fins.concat(jours_);
    if (!vals.length) return {n:0};
    let sc = (10 - moy(vals)) / 10 * 100;
    const recups = B.filter(b=>num(b.recup)).map(b=>num(b.recup));
    if (recups.length && moy(recups) > 20) sc -= Math.min(15, (moy(recups)-20)/2);
    const forts = G.filter(s=>num(s.niveau) >= 4).length;
    if (forts) sc -= Math.min(20, forts * 5);
    return {n:vals.length, sc:Math.max(0, Math.min(100, sc)),
            det:`état de fin de balade ${moy(vals).toFixed(1)}/10${forts?`, ${forts} signal${forts>1?'s':''} marqué${forts>1?'s':''}`:''}`,
            brut:{emo:moy(vals), forts}};
  }
  if (id === 'rappel'){
    const dem = som(B,'rappelsDem'), ok = som(B,'rappelsOk');
    if (!dem) return {n:0};
    let sc = ok/dem*100;
    const ret = som(B,'retours');
    if (ret >= B.length) sc = Math.min(100, sc + 4);
    return {n:dem, sc, det:`${ok} rappels réussis sur ${dem}`, brut:{dem, ok}};
  }
  if (id === 'croisements'){
    const cr = som(B,'chiensCroises'), calmes = som(B,'croisCalmes'), tendues = som(B,'rencontresTendues');
    if (!cr) return {n:0};
    let sc = calmes/cr*100 - tendues*6;
    return {n:cr, sc:Math.max(0, Math.min(100, sc)),
            det:`${calmes} croisements calmes sur ${cr}${tendues?`, ${tendues} rencontre${tendues>1?'s':''} tendue${tendues>1?'s':''}`:''}`,
            brut:{cr, calmes, tendues}};
  }
  if (id === 'laisse'){
    const t = B.filter(b=>b.tirage!=='' && b.tirage!==undefined).map(b=>num(b.tirage));
    if (!t.length) return {n:0};
    return {n:t.length, sc:(5 - moy(t))/5*100,
            det:`tirage moyen ${moy(t).toFixed(1)}/5`, brut:{tirage:moy(t)}};
  }
  if (id === 'connexion'){
    const h = som(B,'duree')/60;
    if (!h || !B.length) return {n:0};
    const par = (som(B,'regards') + som(B,'retours')) / h;   // marques d'attention par heure
    return {n:B.length, sc:Math.max(0, Math.min(100, par/12*100)),
            det:`${(par).toFixed(1)} regards ou retours spontanés par heure`, brut:{par}};
  }
  if (id === 'quotidien'){
    const pieces = [], dits = [];
    const cal = J.filter(j=>num(j.calme)).map(j=>num(j.calme));
    if (cal.length){ pieces.push(Math.min(100, moy(cal)/180*100));       // 3 h de calme volontaire = plein
      dits.push(`${Math.round(moy(cal))} min de calme volontaire par jour`); }
    const seuls = J.filter(j=>j.seulOk!=='' && j.seulOk!==undefined).map(j=>num(j.seulOk));
    if (seuls.length){ pieces.push(moy(seuls)/5*100);
      dits.push(`solitude vécue à ${moy(seuls).toFixed(1)}/5`); }
    const acc = J.filter(j=>j.proprete!=='' && j.proprete!==undefined).map(j=>num(j.proprete));
    if (acc.length){ pieces.push(moy(acc)===0?100:Math.max(0, 100 - moy(acc)*25));
      const tot = acc.reduce((a,b)=>a+b,0);
      dits.push(tot ? `${tot} accident${tot>1?'s':''} de propreté` : 'propreté acquise'); }
    const mord = J.filter(j=>num(j.mordillements)).map(j=>num(j.mordillements));
    if (mord.length && moy(mord) > 2) dits.push(`mordillements à ${moy(mord).toFixed(1)}/5`);
    if (!pieces.length) return {n:0};
    // c'est le point le plus faible qui doit être nommé, pas la moyenne
    const faible = pieces.indexOf(Math.min(...pieces));
    return {n:J.length, sc:moy(pieces),
            det:dits.length ? dits[Math.min(faible, dits.length-1)] + (dits.length>1?`, sur ${J.length} journées notées`:'') : `${J.length} journées notées`,
            brut:{}};
  }
  return {n:0};
}

/* ---- État complet d'un axe : score, tendance, verdict ---- */
function etatAxe(id){
  const a = axeById(id);
  const m = mesureAxe(id, 14, 0), p = mesureAxe(id, 14, 14);
  if (!m.n && S.depart){
    /* Déclaré à l'inscription : sert de point de départ jusqu'aux premières mesures */
    let d = null;
    if (id === 'croisements' && S.depart.chiens) d = (S.depart.chiens-1)/4*100;
    else if (id === 'rappel' && S.depart.rappel) d = (S.depart.rappel-1)/4*100;
    else if ((S.depart.axes||[]).includes(id)) d = 45;
    if (d !== null) return {axe:a, vide:false, sc:Math.round(d), n:0, delta:null, tend:null,
      det:'niveau que tu as déclaré au départ', declare:true,
      verdict: d>=80?'Solide':d>=60?'En progrès':d>=40?'Fragile':'En difficulté',
      lecture:'Estimation de départ, elle s\'ajustera dès tes premières balades.'};
  }
  if (!m.n) return {axe:a, vide:true, sc:null, n:0,
    verdict:'Pas encore de données', conseil:`Note quelques balades pour que ${esc(S.chien.nom||'ton chien')} ait un point de départ sur cet axe.`};
  const tol = (typeof toleranceAxe === 'function') ? toleranceAxe(id) : 1;
  const ajuste = v => Math.max(0, Math.min(100, Math.round(v / (tol || 1))));
  const sc = ajuste(m.sc);
  const delta = p.n ? sc - ajuste(p.sc) : null;
  const verdict = sc >= 80 ? 'Solide' : sc >= 60 ? 'En progrès' : sc >= 40 ? 'Fragile' : 'En difficulté';
  const tend = delta === null ? null : delta >= 5 ? 'up' : delta <= -5 ? 'down' : 'flat';
  const nom = S.chien.nom || 'ton chien';
  const LECTURE = {
    calme:      {up:`${nom} redescend plus vite qu'avant.`, down:'Les fins de balade sont plus agitées qu\'il y a deux semaines.', flat:'Le niveau de calme reste stable.'},
    rappel:     {up:'Le rappel répond mieux qu\'avant.', down:'Le rappel accroche moins bien que la quinzaine précédente.', flat:'Le rappel se maintient.'},
    croisements:{up:'Les croisements se passent mieux.', down:'Les réactions sont plus fortes qu\'il y a deux semaines.', flat:'Les croisements restent au même niveau.'},
    laisse:     {up:'Il tire moins qu\'avant.', down:'Il tire davantage que la quinzaine précédente.', flat:'La marche en laisse reste stable.'},
    connexion:  {up:`${nom} te sollicite plus souvent en balade.`, down:'Il se tourne moins souvent vers toi qu\'avant.', flat:'La connexion se maintient.'},
    quotidien:  {up:'La vie à la maison se passe mieux.', down:'Le quotidien est plus difficile qu\'avant.', flat:'Le quotidien reste stable.'}
  };
  const base = sc >= 80 ? 'C\'est un point solide.' : sc >= 60 ? 'C\'est en bonne voie.'
    : sc >= 40 ? 'C\'est encore fragile.' : 'C\'est le point le plus difficile en ce moment.';
  const lecture = (tend && LECTURE[id] && LECTURE[id][tend]) ? LECTURE[id][tend] : base;
  const lignee = (typeof motGroupe === 'function') ? motGroupe(id) : '';
  return {axe:a, vide:false, sc, n:m.n, delta, det:m.det, brut:m.brut, verdict, tend, lecture, base, lignee, tol};
}
function tousLesAxes(){ return AXES.map(a=>etatAxe(a.id)); }

/* ---- Priorité de la semaine ---- */
function axePrioritaire(){
  const E = tousLesAxes().filter(e=>!e.vide);
  if (!E.length) return null;
  // le plus bas d'abord, une régression nette compte comme 12 points de moins
  const note = e => e.sc + (e.tend === 'down' ? -12 : e.tend === 'up' ? 4 : 0);
  return E.slice().sort((a,b)=>note(a)-note(b))[0];
}

/* ---- Exercice recommandé, avec sa raison ---- */
function recommandation(){
  const pr = axePrioritaire();

  // Démarrage à froid : on suit l'ordre des bases plutôt que d'inventer une priorité
  if (!pr){
    const ordre = ['assis','couche','pas-bouger','marche-laisse','rappel-positif'];
    for (const id of ordre){
      const e = EXOS.find(x=>x.id===id);
      if (e && !S.sessions.some(s=>s.exoId===id))
        return {exo:e, palier:1, axe:null, premier:true,
          raison:"Première fiche du parcours de base : elle pose le vocabulaire et la posture d'attente sur lesquels tout le reste s'appuie."};
    }
  }

  const candidats = pr ? exosAxe(pr.axe) : EXOS.filter(e=>e.cat==='base');
  if (!candidats.length) return null;

  const aujourdhui = todayISO();
  const scored = candidats.map(e=>{
    const st = statsExo(e.id);
    const ss = S.sessions.filter(s=>s.exoId===e.id).sort((a,b)=>b.date.localeCompare(a.date));
    const derniere = ss[0] ? ss[0].date : null;
    const depuis = derniere ? Math.round((new Date(aujourdhui) - new Date(derniere))/86400000) : 999;
    let p = 0; const det = [];
    if ((S.epingles||[]).includes(e.id)){ p += 40; det.push(['Mise en priorité par toi', 40]); }
    if (!ss.length){ p += 22; det.push(['Jamais travaillée', 22]); }
    const anc = Math.min(28, Math.round(depuis * 2.5));
    if (anc && ss.length){ p += anc; det.push([`Pas travaillée depuis ${depuis} j`, anc]); }
    else if (anc) p += anc;
    if (st.n && st.taux < 60){ p += 18; det.push([`Réussite encore basse (${st.taux} %)`, 18]); }
    if (st.palier >= e.paliers.length){ p -= 45; det.push(['Tous les paliers validés', -45]); }
    if (derniere === aujourdhui){ p -= 60; det.push(['Déjà travaillée aujourd\'hui', -60]); }
    return {e, p:Math.round(p), st, depuis, derniere, det};
  }).sort((a,b)=>b.p-a.p);

  const c = scored[0];
  const palier = Math.min(c.e.paliers.length, Math.max(1, c.st.palier + (c.st.palier && c.st.taux >= 80 ? 1 : 0)));

  let raison;
  if (pr && pr.tend === 'down')
    raison = `${pr.axe.lg} recule : ${pr.det} sur 14 jours, soit ${Math.abs(pr.delta)} points de moins que la quinzaine d'avant.`;
  else if (pr && pr.sc < 60)
    raison = `C'est l'axe le plus fragile en ce moment : ${pr.det}.`;
  else if (pr)
    raison = `${pr.axe.lg} tient (${pr.sc}/100), c'est le bon moment pour durcir d'un cran : ${pr.det}.`;
  else
    raison = 'Fiche de base à poser en premier.';
  if (c.derniere && c.depuis > 10) raison += ` Cette fiche n'a pas été travaillée depuis ${c.depuis} jours.`;
  if (!c.st.n) raison += ' Elle n\'a encore jamais été travaillée.';

  return {exo:c.e, palier, axe:pr ? pr.axe : null, etat:pr, raison,
          crit:(c.e.paliers[palier-1]||{}).crit || '', classement:scored.slice(0,6)};
}

/* ---- Ce qu'il reste à faire aujourd'hui ---- */
function pointDuJour(){
  const j = todayISO();
  return {
    balade: S.balades.some(b=>b.date===j),
    seance: S.sessions.some(s=>s.date===j),
    journal: S.journal.some(x=>x.date===j),
    nbBalades: S.balades.filter(b=>b.date===j).length
  };
}

/* ---- Phrase de synthèse : comment va le chien aujourd'hui ---- */
function humeurDuJour(){
  const nom = S.chien.nom || 'Ton chien';
  const j = todayISO(), hier = addDays(j,-1);
  const recent = S.balades.filter(b=>b.date===j || b.date===hier).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const jr = S.journal.find(x=>x.date===j);
  let emo = null, source = '';
  if (jr && jr.emo !== '' && jr.emo !== undefined){ emo = num(jr.emo); source = 'journal du jour'; }
  else if (recent && recent.emoFin !== '' && recent.emoFin !== undefined){
    emo = num(recent.emoFin); source = recent.date===j ? 'dernière balade' : 'balade d\'hier'; }

  if (emo === null) return {emo:null, titre:`Comment va ${nom} ?`,
    phrase:'Note une balade ou une ligne de journal et cette page se remplit toute seule.'};
  const t = emo <= 2 ? 'posé' : emo <= 4 ? 'plutôt calme' : emo <= 6 ? 'un peu monté' : emo <= 8 ? 'tendu' : 'débordé';
  const suite = emo <= 4 ? 'Bon moment pour travailler quelque chose de nouveau.'
    : emo <= 6 ? 'Reste sur du connu et termine sur une réussite.'
    : 'Aujourd\'hui, décompression plutôt qu\'exercice : flair, calme, et rien à réussir.';
  return {emo, titre:`${nom} est ${t}`, phrase:suite, source};
}

<script>
/* Rend le choix vérifiable : d'où vient l'axe, puis comment l'exercice est classé */
function expliquerChoix(){
  const r = recommandation();
  if (!r){ toast('Aucune recommandation pour le moment.'); return; }
  const axes = tousLesAxes().filter(a=>!a.vide)
    .sort((a,b)=>(a.sc+(a.tend==='down'?-12:a.tend==='up'?4:0)) - (b.sc+(b.tend==='down'?-12:b.tend==='up'?4:0)));

  const body = `
    <p class="small">Le choix se fait en deux temps, uniquement à partir de ce que tu as noté. Rien n'est aléatoire, et l'étoile n'est qu'un critère parmi d'autres.</p>

    <h4>1. Quel axe est le plus en difficulté</h4>
    ${axes.length ? `<p class="small muted">Les six axes sont notés sur les 14 derniers jours. Le plus bas devient la priorité ; un axe qui recule nettement est pénalisé de 12 points de plus, pour qu'une dégradation passe devant un score bas mais stable.</p>
    <div class="table-wrap"><table><thead><tr><th>Axe</th><th>Note</th><th>Tendance</th><th>Sur quoi</th></tr></thead><tbody>
    ${axes.map((a,i)=>`<tr${i===0?' style="background:var(--moss-soft)"':''}>
      <td><b>${esc(a.axe.t)}</b>${i===0?' <span class="pill moss">priorité</span>':''}</td>
      <td class="num">${a.sc}</td>
      <td class="${a.tend==='up'?'up':a.tend==='down'?'down':'flat'}">${a.delta===null?'—':(a.delta>0?'+':'')+a.delta}</td>
      <td class="small">${esc(a.det)}</td></tr>`).join('')}
    </tbody></table></div>`
    : `<p class="small muted">Aucun axe n'a encore assez de données : l'application suit alors le parcours de base, dans l'ordre assis, couché, pas bouger, marche en laisse, rappel.</p>`}

    <h4>2. Quelle fiche de cet axe</h4>
    <p class="small muted">Chaque fiche de l'axe reçoit des points. Celle qui en a le plus est proposée.</p>

</script><script>
/* =========================================================================
   EXERCICE GUIDÉ
   Une consigne à la fois, puis trois champs à la fin. Le but est qu'une
   séance se fasse le téléphone dans la poche, pas les yeux sur l'écran.
   ========================================================================= */

let SEANCE = null;

function lancerSeance(exoId, palier){
  const e = exoById(exoId); if (!e) return;
  const st = statsExo(exoId);
  SEANCE = {exo:e, palier: palier || Math.max(1, st.palier || 1), etape:-1,
            t0:null, essais:'', reussites:'', emoPic:''};
  rendreSeance();
}
function fermerSeance(){
  SEANCE = null;
  $('#guideHost').innerHTML = '';
  document.body.style.overflow = '';
  route();
}

function rendreSeance(){
  const S2 = SEANCE; if (!S2) return;
  const e = S2.exo, pal = e.paliers[S2.palier-1] || e.paliers[0];
  const n = e.etapes.length;
  let corps;

  if (S2.etape === -1){                        /* ---- écran d'entrée ---- */
    corps = `
      <div class="guide-mid">
        <span class="pill moss">${esc(catOf(e.cat).t)}</span>
        <h1 style="margin:12px 0 6px;font-size:1.7rem">${esc(e.t)}</h1>
        <p class="small" style="color:var(--ink-2);max-width:36ch;margin:0 auto">${esc(e.obj)}</p>
        <div class="guide-meta">
          <div><b>Palier ${S2.palier}</b><span>sur ${e.paliers.length}</span></div>
          <div><b>${esc(e.duree||'5 min')}</b><span>durée</span></div>
          <div><b>${n}</b><span>étape${n>1?'s':''}</span></div>
        </div>
        ${pal&&pal.crit?`<div class="pourquoi" style="text-align:left;max-width:38ch;margin:18px auto 0">
          <b>Objectif du palier</b><p class="small" style="margin:4px 0 0">${esc(pal.crit)}</p></div>`:''}
        ${e.mat&&e.mat.length?`<p class="tiny muted" style="margin-top:14px">À prévoir : ${esc(e.mat.join(', '))}</p>`:''}
      </div>`;
  } else if (S2.etape < n){                    /* ---- déroulé ---- */
    const pc = Math.round((S2.etape+1)/n*100);
    corps = `
      <div class="guide-mid">
        <div class="guide-step">Étape ${S2.etape+1} sur ${n}</div>
        <p class="guide-consigne">${esc(e.etapes[S2.etape])}</p>
        ${S2.etape===n-1 && e.stop && e.stop.length ? `<div class="alert" style="text-align:left;max-width:38ch;margin:20px auto 0">
          <b>On arrête si</b><br>${esc(e.stop[0])}</div>` : ''}
      </div>
      <div class="guide-jauge"><i style="width:${pc}%"></i></div>`;
  } else if (S2.etape === n){                  /* ---- bilan ---- */
    corps = `
      <div class="guide-mid" style="justify-content:flex-start;padding-top:8px">
        <h2 style="margin-bottom:4px">Comment ça s'est passé ?</h2>
        <p class="small muted" style="margin-bottom:22px">Trois chiffres suffisent.</p>
        <div class="compteur">
          <span class="lb">Essais proposés</span>
          <div class="pm"><button data-pm="essais,-1">−</button>
            <b id="vEssais">${num(S2.essais)||0}</b>
            <button data-pm="essais,1">+</button></div>
        </div>
        <div class="compteur">
          <span class="lb">Réussites</span>
          <div class="pm"><button data-pm="reussites,-1">−</button>
            <b id="vReussites">${num(S2.reussites)||0}</b>
            <button data-pm="reussites,1">+</button></div>
        </div>
        <div style="margin-top:18px;width:100%;max-width:340px">
          <div class="spread small" style="margin-bottom:6px">
            <span>Excitation maximum</span><b class="num" id="vEmo">${S2.emoPic===''?'—':S2.emoPic+'/10'}</b></div>
          <input type="range" min="0" max="10" step="1" id="rEmo" value="${S2.emoPic===''?5:S2.emoPic}">
          <div class="spread tiny muted"><span>posé</span><span>débordé</span></div>
        </div>
      </div>`;
  } else {                                     /* ---- résultat ---- */
    const taux = num(S2.essais) ? Math.round(num(S2.reussites)/num(S2.essais)*100) : 0;
    const v = verdictSession({essais:S2.essais, reussites:S2.reussites});
    const suite = v.k==='up'
      ? `${esc(S2.exo.t)} est acquis au palier ${S2.palier}. Tu peux passer au palier ${Math.min(S2.palier+1, e.paliers.length)} à la prochaine séance.`
      : v.k==='hold' ? `Reste sur le palier ${S2.palier} encore une séance ou deux avant de durcir.`
      : v.k==='down' ? `C'était trop dur aujourd'hui. Redescends d'un cran, ou refais la même chose dans un endroit plus calme.`
      : `Séance d'observation notée.`;
    const conseil = (taux >= 80 ? (e.ok||[]) : (e.ko||[]))[0];
    corps = `
      <div class="guide-mid">
        <div class="rond ${taux>=80?'bon':taux>=50?'moyen':'bas'}">
          <b>${taux}</b><span>%</span></div>
        <h2 style="margin:18px 0 6px">${num(S2.reussites)} réussite${num(S2.reussites)>1?'s':''} sur ${num(S2.essais)}</h2>
        <p class="small" style="color:var(--ink-2);max-width:36ch">${esc(suite)}</p>
        ${conseil?`<div class="pourquoi" style="text-align:left;max-width:38ch;margin-top:18px">
          <b>${taux>=80?'Puisque ça a marché':'Pour la prochaine fois'}</b>
          <p class="small" style="margin:4px 0 0">${esc(conseil)}</p></div>`:''}
      </div>`;
  }

  const pied = S2.etape === -1
    ? `<button class="btn ghost" onclick="fermerSeance()">Plus tard</button>
       <button class="btn" data-suivant>Commencer</button>`
    : S2.etape < n
    ? `<button class="btn ghost" data-precedent>Retour</button>
       <button class="btn" data-suivant>${S2.etape===n-1?'Terminé':'Suivant'}</button>`
    : S2.etape === n
    ? `<button class="btn ghost" data-precedent>Retour</button>
       <button class="btn" data-suivant>Enregistrer</button>`
    : `<button class="btn ghost" onclick="fermerSeance()">Fermer</button>
       <button class="btn" onclick="closeGuideEtFiche()">Voir la fiche</button>`;

  $('#guideHost').innerHTML = `<div class="guide">
    <div class="guide-head">
      <button class="icon-btn" onclick="fermerSeance()" aria-label="Quitter">✕</button>
      <span class="small muted">${esc(S2.exo.t)}</span>
      <span style="width:36px"></span>
    </div>
    ${corps}
    <div class="guide-foot">${pied}</div>
  </div>`;
  document.body.style.overflow = 'hidden';

  const av = $('#guideHost').querySelector('[data-suivant]');
  if (av) av.onclick = seanceSuivant;
  const ar = $('#guideHost').querySelector('[data-precedent]');
  if (ar) ar.onclick = () => { SEANCE.etape--; rendreSeance(); };
  $('#guideHost').querySelectorAll('[data-pm]').forEach(b=> b.onclick = () => {
    const [k, d] = b.dataset.pm.split(',');
    SEANCE[k] = Math.max(0, (num(SEANCE[k])||0) + Number(d));
    if (k==='reussites' && num(SEANCE.reussites) > num(SEANCE.essais)) SEANCE.essais = SEANCE.reussites;
    if (k==='essais' && num(SEANCE.reussites) > num(SEANCE.essais)) SEANCE.reussites = SEANCE.essais;
    $('#vEssais').textContent = num(SEANCE.essais)||0;
    $('#vReussites').textContent = num(SEANCE.reussites)||0;
    vibrer(10);
  });
  const r = $('#rEmo');
  if (r) r.oninput = () => { SEANCE.emoPic = num(r.value); $('#vEmo').textContent = r.value + '/10'; };
}

function seanceSuivant(){
  const S2 = SEANCE, n = S2.exo.etapes.length;
  if (S2.etape === -1){ S2.t0 = Date.now(); S2.etape = 0; vibrer(12); rendreSeance(); return; }
  if (S2.etape < n){ S2.etape++; vibrer(10); rendreSeance(); return; }
  if (S2.etape === n){                                   /* enregistrement */
    if (!num(S2.essais)){ toast('Indique au moins un essai.'); return; }
    const mins = S2.t0 ? Math.max(1, Math.round((Date.now()-S2.t0)/60000)) : num(S2.exo.duree) || 5;
    upsert('sessions', {id:uid(), date:todayISO(), exoId:S2.exo.id, palier:S2.palier,
      duree:mins, essais:num(S2.essais), reussites:num(S2.reussites), distraction:1,
      emoAvant:'', emoApres:S2.emoPic, lieu:'', recompense:'', notes:'Séance guidée'});
    persist(true);
    S2.etape = n+1; vibrer(30); rendreSeance(); return;
  }
  fermerSeance();
}
function closeGuideEtFiche(){ const id = SEANCE && SEANCE.exo.id; fermerSeance(); if (id) ficheExo(id); }
function vibrer(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} }
</script>
<script>
/* =========================================================================
   ONBOARDING
   Cinq écrans qui produisent une priorité et un premier exercice, sans
   attendre 14 jours de données. Les réponses servent de note de départ aux
   axes concernés, remplacée dès que les vraies mesures arrivent.
   ========================================================================= */

const DIFFICULTES = [
  ['rappel',      'Le rappel',              'rappel'],
  ['laisse',      'La marche en laisse',    'laisse'],
  ['calme',       'Le calme à la maison',   'calme'],
  ['croisements', 'Les croisements',        'croisements'],
  ['peur',        'Les peurs',              'calme'],
  ['excitation',  "L'excitation",           'calme'],
  ['solitude',    'La solitude',            'quotidien'],
  ['bases',       "L'obéissance de base",   'quotidien']
];

let ONB = null;

function demarrerOnboarding(){
  ONB = {i:0, nom:'', naissance:'', race:'', sexe:'', difficultes:[], chiens:3, rappel:3, objectif:''};
  rendreOnb();
}
function fermerOnb(){ ONB = null; $('#guideHost').innerHTML = ''; document.body.style.overflow = ''; route(); }

function rendreOnb(){
  const o = ONB; if (!o) return;
  const N = 5;
  let corps, titre = '', peut = true;

  if (o.i === 0){
    titre = 'Ton chien';
    corps = `
      ${plain([
        {k:'nom', l:'Son prénom', ph:'Nala'},
        {k:'naissance', l:'Date de naissance approximative', t:'date'},
        {k:'race', l:'Race ou type', t:'select', opts:[''].concat(RACES.map(r=>r[0]))},
        {k:'sexe', l:'Sexe', t:'select', opts:['','Mâle','Femelle']}
      ], o, 'g2')}`;
    peut = true;
  } else if (o.i === 1){
    titre = 'Qu\'aimerais-tu améliorer ?';
    corps = `<p class="small muted" style="margin-bottom:16px">Choisis-en une ou plusieurs. C'est ce qui déterminera la première priorité.</p>
      <div class="choix">${DIFFICULTES.map(d=>`<button class="opt${o.difficultes.includes(d[0])?' on':''}" data-diff="${d[0]}">${esc(d[1])}</button>`).join('')}</div>`;
  } else if (o.i === 2){
    titre = 'Comment ça se passe avec les autres chiens ?';
    corps = echelleOnb('chiens', [
      'Il réagit fort dès qu\'il en voit un',
      'Il se tend souvent',
      'Ça dépend des jours',
      'Il reste plutôt calme',

  } else if (o.i === 3){
    titre = 'Et son rappel ?';
    corps = echelleOnb('rappel', [
      'Il ne revient pas',
      'Seulement s\'il n\'y a rien autour',
      'Une fois sur deux',
      'Il revient presque toujours',

  } else {
    titre = 'Ton objectif principal';

      ${plain([{k:'objectif', l:'', t:'textarea', rows:3, ph:'Pouvoir le lâcher en forêt sans stresser.'}], o)}`;
  }

  $('#guideHost').innerHTML = `<div class="guide">
    <div class="guide-head">
      ${o.i>0?'<button class="icon-btn" data-prec aria-label="Retour">‹</button>':'<span style="width:36px"></span>'}
      <span class="small muted">Étape ${o.i+1} sur ${N}</span>
      <button class="icon-btn" onclick="fermerOnb()" aria-label="Passer">✕</button>
    </div>
    <div class="guide-mid" style="justify-content:flex-start;text-align:left;padding-top:10px">
      <div style="width:100%;max-width:460px">
        <h2 style="margin-bottom:14px">${esc(titre)}</h2>
        ${corps}
      </div>
    </div>
    <div class="guide-jauge"><i style="width:${(o.i+1)/N*100}%"></i></div>
    <div class="guide-foot">
      <button class="btn ghost" onclick="fermerOnb()">Passer</button>
      <button class="btn" data-suiv>${o.i===N-1?'Créer mon programme':'Continuer'}</button>
    </div>
  </div>`;
  document.body.style.overflow = 'hidden';

  $('#guideHost').querySelectorAll('[data-diff]').forEach(b=> b.onclick = () => {
    const k = b.dataset.diff, i = o.difficultes.indexOf(k);

  $('#guideHost').querySelectorAll('[data-ech]').forEach(b=> b.onclick = () => {

  });
  const pr = $('#guideHost').querySelector('[data-prec]');
  if (pr) pr.onclick = () => { lireOnb(); o.i--; rendreOnb(); };
  $('#guideHost').querySelector('[data-suiv]').onclick = () => {
    lireOnb();
    if (o.i === 0 && !o.nom){ toast('Il manque son prénom.'); return; }

}
function echelleOnb(k, libelles){
  return `<div class="choix col">${libelles.map((l,i)=>
    `<button class="opt${ONB[k]===i+1?' on':''}" data-ech="${k},${i+1}">${esc(l)}</button>`).join('')}</div>`;

function lireOnb(){

}

  S.epingles = S.epingles || [];
  axesVises.forEach(id=>{

  persist(true);

  const reco = recommandation();

      <div class="rond bon"><b>${axesVises.length||1}</b><span>axe${axesVises.length>1?'s':''}</span></div>
      <h2 style="margin:18px 0 6px">Programme créé pour ${esc(o.nom)}</h2>
      ${o.race ? `<p class="tiny muted" style="max-width:34ch;margin:0 0 8px">${esc(groupeChien().t)} · objectif de ${S.objectifs.minutesSem} min par semaine</p>` : ''}
      <p class="small" style="color:var(--ink-2);max-width:36ch">
        ${axesVises.length ? 'Priorité de départ : ' + esc(axesVises.map(a=>axeById(a).lg.toLowerCase()).join(' et ')) + '. Les notes s\u2019ajusteront dès tes premières balades.'
          : 'On commence par les fondations, et le programme s\u2019affinera avec tes premières balades.'}</p>
      ${reco?`<div class="pourquoi" style="text-align:left;max-width:38ch;margin-top:20px">
        <b>Premier exercice</b>
        <p class="small" style="margin:4px 0 2px"><b>${esc(reco.exo.t)}</b> · palier ${reco.palier} · ${esc(reco.exo.duree||'5 min')}</p>
        <p class="small muted" style="margin:0">${esc(reco.exo.obj)}</p></div>`:''}
    </div>
    <div class="guide-foot">
      <button class="btn ghost" onclick="fermerOnb()">Plus tard</button>
      ${reco?`<button class="btn" onclick="ONB=null;$('#guideHost').innerHTML='';lancerSeance('${reco.exo.id}',${reco.palier})">Commencer</button>`:''}
    </div>
  </div>`;
  vibrer(30);
}

  /* ---- 3. Où il en est, axe par axe ---- */

  const al = alertesSante();

  return bloc1 + bloc2 + bloc3 + blocJour + bloc5;

/* Détail d'un axe : d'où vient la note, et quoi faire */
function detailAxe(id){
  const e = etatAxe(id), a = e.axe;
  const W = weeks(8);
  const serie = W.map(w=>{
    const j = daysBetween(w.to, todayISO());
    const m = mesureAxe(id, 7, Math.max(0, j));
    return m.n ? Math.round(m.sc) : null;
  });
  const body = `
    ${e.vide ? `<p class="small">Cet axe se calcule dès que tu auras noté quelques balades ou journées. ${esc(e.conseil)}</p>`
    : `<div class="spread" style="margin-bottom:14px">
        <div><div class="tiny muted">Note sur 14 jours</div>
          <div style="font-size:2.4rem;font-weight:720;letter-spacing:-.03em" class="num">${e.sc}<span class="muted" style="font-size:1rem">/100</span></div></div>
        <span class="pill ${e.sc>=80?'vert':e.sc>=60?'moss':e.sc>=40?'ochre':'rouge'}">${esc(e.verdict)}</span>
      </div>
      <h4>Ce qui est mesuré</h4>
      <p class="small">${esc(e.det[0].toUpperCase()+e.det.slice(1))}.${e.delta!==null?` C'est ${e.delta>0?'+':''}${e.delta} points par rapport aux 14 jours précédents.`:''}</p>
      ${e.lignee?`<div class="pourquoi"><b>Ajusté selon sa lignée</b>
        <p class="small" style="margin:4px 0 0">${esc(e.lignee)}</p></div>`:''}
      <h4>Évolution sur 8 semaines</h4>
      ${lineChart([{name:a.t,data:serie,color:'var(--moss)'}], W.map(w=>w.label), {min:0,max:100})}`}
    <h4>Exercices de cet axe</h4>
    <div class="exo-list">${exosAxe(a).map(x=>{
      const st = statsExo(x.id);
      return `<button class="exo" onclick="closeSheet();setTimeout(()=>ficheExo('${x.id}'),60)">
        <h3 style="font-size:.94rem">${esc(x.t)}</h3>
        <p class="small muted" style="margin:0">${esc(x.obj)}</p>
        <div class="tiny muted">Palier ${st.palier}/${x.paliers.length}${st.n?` · ${st.taux} %`:' · jamais travaillé'}</div>
      </button>`;}).join('')}</div>`;
  openSheet(a.lg, e.vide ? 'Pas encore de données' : `${e.sc}/100 sur 14 jours`, body, null);
}

function objLine(l, v, t){
  const p = t ? Math.min(100, Math.round(v/t*100)) : 0;
  return `<div style="margin-bottom:11px"><div class="spread small" style="margin-bottom:4px"><span>${esc(l)}</span>
    <span class="num muted">${Math.round(v)} / ${t}</span></div><div class="progress"><i style="width:${p}%"></i></div></div>`;
}

function baladeCard(b, compact){
  const s = scoreBalade(b);
  const tags = [];
  if (b.equipement) tags.push(`<span class="pill">${esc(b.equipement)}</span>`);
  if (b.terrain) tags.push(`<span class="pill">${esc(b.terrain)}</span>`);
  if (b.meteo) tags.push(`<span class="pill">${esc(b.meteo)}</span>`);
  if (num(b.incidents)) tags.push(`<span class="pill rouge">${num(b.incidents)} incident${num(b.incidents)>1?'s':''}</span>`);
  const scCls = s>=70?'moss':s>=45?'ochre':'rouge';
  return `<div class="log-head">
      <div><b>${esc(b.lieu||'Balade')}</b> <span class="small muted">${fdate(b.date)}${b.heure?' · '+esc(b.heure):''}</span></div>
      <div class="row" style="gap:6px">
        <span class="pill ${scCls}">${s}/100</span>
        ${compact?'':`<button class="icon-btn" onclick="formBalade('${b.id}')" title="Modifier">✎</button>
        <button class="icon-btn" onclick="del('balades','${b.id}','cette balade')" title="Supprimer">🗑</button>`}
      </div></div>
    <div class="row" style="gap:6px;margin-top:7px">${tags.join('')}</div>
    <div class="stat-line">
      <span>Durée <b>${fmin(b.duree)}</b></span>
      ${num(b.distance)?`<span>Distance <b>${num(b.distance).toFixed(1)} km</b></span>`:''}
      ${num(b.flair)?`<span>Flair <b>${fmin(b.flair)}</b> (${pct(num(b.flair),num(b.duree))} %)</span>`:''}
      ${num(b.rappelsDem)?`<span>Rappels <b>${num(b.rappelsOk)}/${num(b.rappelsDem)}</b></span>`:''}
      ${num(b.retours)?`<span>Retours spontanés <b>${num(b.retours)}</b></span>`:''}
      ${num(b.chiensCroises)?`<span>Chiens croisés <b>${num(b.chiensCroises)}</b> (${num(b.croisCalmes)} calmes)</span>`:''}
      <span>Tirage <b>${num(b.tirage)}/5</b></span>
      ${num(b.recup)?`<span>Retour au calme <b>${fmin(b.recup)}</b></span>`:''}
    </div>
    ${!compact ? ((b.gps && b.gps.length>1)
      ? `<div style="margin-top:12px">${carteHTML(b.gps,{ratio:'4 / 3', anim:true, id:'carte-'+b.id, gestes:true,
           dz:(VUE_CARTE[b.id]||{}).dz, cx:(VUE_CARTE[b.id]||{}).cx, cy:(VUE_CARTE[b.id]||{}).cy,
           sous:`${fmin(num(b.duree))} · ${esc(b.lieu||fdate(b.date))}`})}
         <div class="row no-print" style="margin-top:8px">
           <button class="btn sm" onclick="rejouer('${b.id}')">Revoir ma balade</button>
           <button class="btn ghost sm" onclick="exportGPX('${b.id}')">Exporter en GPX</button></div></div>`
      : `<p class="tiny muted no-print" style="margin:10px 0 0">Pas de tracé : cette balade a été saisie à la main, ou la position n'était pas disponible.</p>`) : ''}
    <div class="grid g3" style="margin-top:11px">
      <div>${scaleBar(b.emoDepart,'Départ')}</div>
      <div>${scaleBar(b.emoPic,'Pic')}</div>
      <div>${scaleBar(b.emoFin,'Fin')}</div>
    </div>
    ${b.signaux?`<p class="small" style="margin-top:10px"><b>Signaux observés :</b> ${esc(b.signaux)}</p>`:''}
    ${b.notes?`<p class="small" style="margin-top:6px">${esc(b.notes)}</p>`:''}`;
}

/* Cadrage choisi à la main, conservé le temps de la consultation */
const VUE_CARTE = {};
function majVueCarte(id, v){
  VUE_CARTE[id] = (v.cx === null) ? undefined : v;
  const b = S.balades.find(x=>x.id===id); if (!b) return;
  const hote = document.getElementById('carte-'+id);
  if (!hote) return;
  const html = carteHTML(b.gps, Object.assign({ratio:'4 / 3', anim:true, id:'carte-'+id, gestes:true,
    sous:`${fmin(num(b.duree))} · ${esc(b.lieu||fdate(b.date))}`}, VUE_CARTE[id]||{}));
  const tmp = document.createElement('div'); tmp.innerHTML = html;
  hote.replaceWith(tmp.firstElementChild);
  brancherCartes();
}
function brancherCartes(){
  document.querySelectorAll('.carte.gestes').forEach(h=>{
    const id = (h.id||'').replace('carte-','');
    if (id) activerGestes(h, v => majVueCarte(id, v));
  });
}
const estEpingle = id => (S.epingles||[]).includes(id);
function epingler(id, ev){
  if (ev) ev.stopPropagation();
  S.epingles = S.epingles || [];
  const i = S.epingles.indexOf(id);
  if (i >= 0) S.epingles.splice(i, 1); else S.epingles.push(id);
  const e = EXOS.find(x=>x.id===id);
  commit(i >= 0 ? 'Retiré des priorités.' : `« ${e?e.t:''} » remonte en tête de liste.`);
}
VIEWS.exercices = () => {

    <h4>Déroulé</h4><ol>${e.etapes.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>

    <div class="branch ko"><h4 style="margin:0 0 5px">Si la séance a échoué</h4>
      <ul>${e.ko.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>

    ${e.stop && e.stop.length?`<h4>Signaux d'arrêt</h4><ul>${e.stop.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}

function consigneSuite(s, ex){
  const v = verdictSession(s);
  if (!ex || !ex.ok) return '';
  if (v.k==='up')   return 'Prochaine étape : ' + (ex.ok[0]||'monter au palier suivant.');

  if (v.k==='hold') return 'Reste sur ce palier jusqu\'à trois séances au-dessus de 80 %.';
  return '';
}
