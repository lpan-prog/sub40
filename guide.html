/* =========================================================================
   7. PANNEAU LATÉRAL
   ========================================================================= */
let sheetSave = null;
function openSheet(title, sub, body, onSave, saveLabel){
  sheetSave = onSave;
  $('#sheetHost').innerHTML = `<div class="sheet-mask" id="mask"><div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <div><h2>${esc(title)}</h2>${sub?`<p class="small muted" style="margin:3px 0 0">${sub}</p>`:''}</div>
      <div class="row" style="flex-wrap:nowrap">
        ${onSave?`<button class="btn sm" id="sheetSaveBtn">${esc(saveLabel||'Enregistrer')}</button>`:''}

      </div>

  document.body.style.overflow = 'hidden';
  document.documentElement.classList.add('sheet-open');

  $('#mask').addEventListener('mousedown', e=>{ if(e.target.id==='mask') closeSheet(); });
  const b = $('#sheetSaveBtn'); if (b) b.onclick = ()=>{ const d = readForm($('#sheetBody')); if (sheetSave(d) !== false) closeSheet(); };
}
function closeSheet(){ $('#sheetHost').innerHTML=''; document.body.style.overflow='';
  document.documentElement.classList.remove('sheet-open'); sheetSave=null; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('#sheetHost').innerHTML) closeSheet(); });

/* Suppression générique */
function del(coll, id, label){
  if (!confirm('Supprimer '+(label||'cet élément')+' ? Cette action est définitive.')) return;
  S[coll] = S[coll].filter(x=>x.id!==id); commit('Supprimé.');
}
function upsert(coll, obj){
  const i = S[coll].findIndex(x=>x.id===obj.id);
  if (i>=0) S[coll][i] = obj; else S[coll].push(obj);
}

  else if (p==='poids')     setFab('Nouvelle pesée','plus', ()=>formPoids());

function empty(titre, txt, btn){
  return `<div class="empty"><h3>${esc(titre)}</h3><p class="small">${txt}</p>${btn||''}</div>`;
}
function kpi(k, v, u, d, cls){
  return `<div class="kpi"><div class="k">${esc(k)}</div><div class="v">${v}${u?`<span class="u">${esc(u)}</span>`:''}</div>
    ${d?`<div class="d ${cls||'flat'}">${d}</div>`:''}</div>`;
}

<script>
/* =========================================================================

const statutPill = v => v==='acquis' ? 'moss' : v==='en-cours' ? 'sky' : v==='a-revoir' ? 'rouge' : '';

/* Base proposée : mot court, geste associé, sens sans ambiguïté */
const ORDRES_BASE = [
  {mot:'Assis',      geste:'Main ouverte qui remonte devant le buste',      sens:"Poser l'arrière-train au sol et attendre", cat:'base',        exoId:'assis'},

/* ---- Détection des incohérences de foyer ---- */
function conflitsOrdres(){
  const O = S.ordres, out = [];
  const normal = t => String(t||'').trim().toLowerCase().replace(/\s+/g,' ');
  const parSens = {}, parMot = {};
  O.forEach(o=>{
    const s = normal(o.sens), m = normal(o.mot);
    if (s){ (parSens[s] = parSens[s] || []).push(o); }
    if (m){ (parMot[m] = parMot[m] || []).push(o); }
  });
  Object.values(parSens).forEach(g=>{
    const mots = [...new Set(g.map(o=>o.mot))];
    if (mots.length > 1) out.push({t:'bad',
      m:`<b>${esc(mots.join(' / '))}</b> désignent la même action. Choisis-en un seul et supprime les autres : le chien n'a aucune raison de comprendre que ces mots veulent dire la même chose.`});
  });
  Object.values(parMot).forEach(g=>{
    const sens = [...new Set(g.map(o=>o.sens).filter(Boolean))];
    if (sens.length > 1) out.push({t:'bad',
      m:`Le mot <b>${esc(g[0].mot)}</b> est enregistré pour ${sens.length} actions différentes. Un mot ne peut avoir qu'un seul sens.`});
  });
  const membres = S.foyer.map(f=>f.nom);
  if (membres.length > 1){
    O.filter(o=>o.statut==='acquis' || o.statut==='en-cours').forEach(o=>{
      const abs = membres.filter(n=>!(o.qui||[]).includes(n));
      if (abs.length && (o.qui||[]).length) out.push({t:'warn',
        m:`<b>${esc(o.mot)}</b> n'est pas employé par ${esc(abs.join(', '))}. Si cette personne s'occupe du chien, elle doit utiliser le même mot.`});
    });
  }
  O.filter(o=>o.mot && !o.geste).forEach(o=> out.push({t:'warn',
    m:`<b>${esc(o.mot)}</b> n'a pas de geste associé. Un geste rend l'ordre lisible à distance et quand il y a du bruit.`}));
  return out;
}

function fiabiliteOrdre(o){
  const e = num(o.essais), r = num(o.reussites);
  return e ? Math.round(r/e*100) : null;
}

/* ---- Vue ---- */
VIEWS.ordres = () => {

  const H = head('Ordres du foyer',

     <button class="btn ghost" onclick="ficheFrigo()">Fiche à afficher</button>
     <button class="btn ghost" onclick="exportOrdres()">Exporter en Markdown</button>`);

  const foyerBloc = `

      <div><h3>Qui s'occupe du chien</h3>

      <button class="btn ghost sm" onclick="formMembre()">Ajouter une personne</button>
    </div>
    ${F.length ? `<div class="row">${F.map(f=>`<span class="pill moss">${esc(f.nom)}${f.role?' · '+esc(f.role):''}
      <button class="x-mini" onclick="event.stopPropagation();del('foyer','${f.id}','${esc(f.nom)}')" aria-label="Retirer ${esc(f.nom)}">✕</button></span>`).join('')}</div>` : ''}
  </div>`;

  if (!O.length) return H + foyerBloc + empty('Aucun ordre enregistré',
    'Charge la base de 20 ordres courants (mot + geste + sens), puis adapte-la à ton vocabulaire réel. Tu peux aussi tout créer à la main.',
    `<div class="row" style="justify-content:center;margin-top:14px">
      <button class="btn" onclick="chargerOrdresBase()">Charger les 20 ordres de base</button>
      <button class="btn ghost" onclick="formOrdre()">Créer le premier</button></div>`);

  const acquis = O.filter(o=>o.statut==='acquis').length;
  const alertes = cf.length ? `<div style="margin-bottom:16px">
    <h3 style="margin-bottom:8px">Cohérence du vocabulaire</h3>
    ${cf.map(c=>`<div class="alert ${c.t==='bad'?'bad':''}">${c.m}</div>`).join('')}</div>`
    : `<div class="alert" style="border-left-color:var(--moss);background:var(--moss-soft);margin-bottom:16px">
        Vocabulaire cohérent : aucun doublon, aucun mot à double sens.</div>`;

  const groupes = CAT_ORDRE.map(([id,t])=>{
    const list = O.filter(o=>o.cat===id);
    if (!list.length) return '';
    return `<h3 style="margin:20px 0 10px">${esc(t)} <span class="small muted">(${list.length})</span></h3>
      <div class="exo-list">${list.map(o=>{
        const f = fiabiliteOrdre(o);
        return `<button class="ordre" onclick="ficheOrdre('${o.id}')">
          <div class="spread"><span class="mot">${esc(o.mot)}</span>
            <span class="pill ${statutPill(o.statut)}">${esc(statutTxt(o.statut))}</span></div>
          <div class="sens">${esc(o.sens||'Sens à préciser')}</div>
          <div class="small muted">${o.geste?'✋ '+esc(o.geste):'<span style="color:var(--ochre)">Geste manquant</span>'}</div>
          ${f!==null?`<div class="small muted">Fiabilité observée : <b>${f} %</b> sur ${num(o.essais)} essais</div>`:''}
          <div class="who">${S.foyer.map(m=>`<span class="${(o.qui||[]).includes(m.nom)?'':'off'}">${esc(m.nom)}</span>`).join('')}</div>
        </button>`;}).join('')}</div>`;
  }).join('');

  return H + foyerBloc + `
    <div class="grid g4" style="margin-bottom:18px">
      ${kpi('Ordres enregistrés', O.length)}
      ${kpi('Acquis', acquis, '/ '+O.length)}
      ${kpi('En cours', O.filter(o=>o.statut==='en-cours').length)}
      ${kpi('Incohérences', cf.filter(c=>c.t==='bad').length, '', cf.length?'à corriger':'aucune', cf.filter(c=>c.t==='bad').length?'down':'up')}
    </div>` + alertes + groupes;
};

/* ---- Fiche détaillée ---- */
function ficheOrdre(id){
  const o = S.ordres.find(x=>x.id===id); if(!o) return;
  const f = fiabiliteOrdre(o);
  const exo = o.exoId ? EXOS.find(e=>e.id===o.exoId) : null;
  const body = `
    <div class="card pad-lg" style="margin-bottom:14px">
      <div class="spread"><h2 style="font-size:1.5rem">${esc(o.mot)}</h2>
        <span class="pill ${statutPill(o.statut)}">${esc(statutTxt(o.statut))}</span></div>
      <p class="small" style="margin-top:8px">${esc(o.sens||'—')}</p>
    </div>
    <h4>Geste associé</h4><p class="small">${esc(o.geste||'Aucun geste défini. Ajoutes-en un : il reste lisible quand le chien est loin ou qu\'il y a du bruit.')}</p>
    <h4>Qui l'emploie</h4>
    <div class="who" style="margin-bottom:10px">${S.foyer.length
      ? S.foyer.map(m=>`<span class="${(o.qui||[]).includes(m.nom)?'':'off'}">${esc(m.nom)}</span>`).join('')
      : '<span class="off">Aucune personne enregistrée dans le foyer</span>'}</div>
    ${o.contexte?`<h4>Dans quel contexte</h4><p class="small">${esc(o.contexte)}</p>`:''}
    ${o.recompense?`<h4>Récompense utilisée</h4><p class="small">${esc(o.recompense)}</p>`:''}
    ${f!==null?`<h4>Fiabilité observée</h4>
      <div class="progress" style="margin-bottom:6px"><i style="width:${f}%"></i></div>
      <p class="small muted">${num(o.reussites)} réussites sur ${num(o.essais)} essais — ${f} %.
      ${f>=90?'Fiable, tu peux durcir le contexte.':f>=70?'Presque acquis : garde le même contexte encore quelques jours.':'Encore fragile : redescends d\'un cran de difficulté.'}</p>`:''}
    ${o.aEviter?`<div class="branch ko"><h4>À ne surtout pas faire</h4><p class="small" style="margin:0">${esc(o.aEviter)}</p></div>`:''}
    ${o.dateAppris?`<p class="small muted">Introduit le ${fdate(o.dateAppris)}.</p>`:''}
    ${o.notes?`<h4>Notes</h4><p class="small">${esc(o.notes)}</p>`:''}
    ${exo?`<div class="card" style="margin-top:14px"><div class="spread">
      <div><b class="small">Fiche d'exercice liée</b><div class="small muted">${esc(exo.t)}</div></div>
      <button class="btn ghost sm" onclick="closeSheet();go('exercices');setTimeout(()=>ficheExo('${exo.id}'),60)">Ouvrir la fiche</button>
    </div></div>`:''}
    <div class="row" style="margin-top:18px">
      <button class="btn" onclick="closeSheet();formOrdre('${o.id}')">Modifier</button>
      <button class="btn danger ghost" onclick="closeSheet();del('ordres','${o.id}','l\\'ordre « ${esc(o.mot)} »')">Supprimer</button>
    </div>`;
  openSheet(o.mot, esc(catOrdre(o.cat)), body, null);
}

/* ---- Formulaires ---- */
function formOrdre(id){
  const o = S.ordres.find(x=>x.id===id) || {id:uid(), cat:'base', statut:'a-apprendre', qui:S.foyer.map(f=>f.nom)};
  const exoOpts = [['','— aucune —']];
  CATS.forEach(c=>{ EXOS.filter(e=>e.cat===c.id).forEach(e=> exoOpts.push([e.id, c.t+' — '+e.t])); });
  const body = `
    ${plain([
      {k:'mot', l:'Mot exact prononcé', hint:'tel quel, avec l\'intonation habituelle', ph:'Ici, Panier, Laisse…'},
      {k:'sens', l:'Ce que le chien doit faire', hint:'une seule action, sans ambiguïté', ph:'Revenir au contact et rester'},
      {k:'geste', l:'Geste associé', hint:'visible de loin', ph:'Bras grand ouvert puis mains sur les cuisses'},
      {k:'cat', l:'Catégorie', t:'select', opts:CAT_ORDRE},
      {k:'statut', l:'Où il en est', t:'select', opts:STATUTS},
      {k:'dateAppris', l:'Introduit le', t:'date'}
    ], o)}
    ${S.foyer.length?`<div class="card" style="margin-bottom:12px"><div class="small" style="font-weight:560;margin-bottom:8px">Qui emploie ce mot</div>
      ${S.foyer.map(m=>`<label class="inline-check"><input type="checkbox" data-qui="${esc(m.nom)}"${(o.qui||[]).includes(m.nom)?' checked':''}> ${esc(m.nom)}</label>`).join('')}
      <p class="tiny muted" style="margin:6px 0 0">Décoche quelqu'un et l'app te signalera l'incohérence.</p></div>`
      :'<p class="small muted">Ajoute d\'abord les personnes du foyer pour cocher qui emploie ce mot.</p>'}
    ${group({t:'Détails et suivi', open:true}, [
      {k:'contexte', l:'Dans quel contexte', hint:'où, quand, avec quel niveau de distraction', t:'textarea', rows:2},
      {k:'recompense', l:'Récompense utilisée', ph:'Poulet séché, jeu de traction…'},
      {k:'essais', l:'Essais observés', hint:'total cumulé', t:'number', min:0},
      {k:'reussites', l:'Réussites', t:'number', min:0},
      {k:'aEviter', l:'À ne pas faire avec ce mot', hint:'l\'erreur à ne pas répéter', t:'textarea', rows:2},
      {k:'notes', l:'Notes', t:'textarea', rows:2}
    ], o)}
    ${plain([{k:'exoId', l:'Fiche d\'exercice liée', t:'select', opts:exoOpts}], o, 'g2')}`;
  openSheet(id?'Modifier l\'ordre':'Nouvel ordre', 'Un mot ne doit désigner qu\'une seule action.', body, d=>{
    if (!d.mot){ toast('Il manque le mot.'); return false; }
    d.id = o.id;
    d.qui = [...document.querySelectorAll('#sheetBody [data-qui]')].filter(c=>c.checked).map(c=>c.dataset.qui);
    if (num(d.reussites) > num(d.essais)) d.reussites = d.essais;
    upsert('ordres', d); commit('Ordre enregistré.');
  });
}

function formMembre(id){
  const m = S.foyer.find(x=>x.id===id) || {id:uid()};
  const body = plain([
    {k:'nom', l:'Prénom', ph:'Léo, Marie, Papa…'},
    {k:'role', l:'Rôle', t:'select', opts:['','Référent principal','Co-référent','Occasionnel','Pension / famille d\'accueil','Éducateur']}
  ], m, 'g2');
  openSheet('Personne du foyer', 'Toute personne qui donne des ordres au chien.', body, d=>{
    if (!d.nom){ toast('Il manque le prénom.'); return false; }
    d.id = m.id; upsert('foyer', d); commit('Personne ajoutée.');
  });
}

function chargerOrdresBaseSilencieux(){
  const ex = new Set(S.ordres.map(o=>String(o.mot).toLowerCase()));
  let n = 0;
  ORDRES_BASE.forEach(b=>{
    if (ex.has(b.mot.toLowerCase())) return;
    S.ordres.push(Object.assign({id:uid(), statut:'a-apprendre', qui:S.foyer.map(f=>f.nom),
      essais:'', reussites:'', contexte:'', recompense:'', aEviter:'', notes:'', dateAppris:''}, b));
    n++;
  });
  return n;
}
function chargerOrdresBase(){
  const n = chargerOrdresBaseSilencieux();
  commit(n ? n+' ordres ajoutés. Adapte les mots à ton vocabulaire réel.' : 'Ils sont déjà tous là.');
}

/* ---- Fiche à afficher (frigo) ---- */
function ficheFrigo(){
  if (!S.ordres.length){ toast('Aucun ordre à afficher.'); return; }
  const rows = CAT_ORDRE.map(([id,t])=>{
    const list = S.ordres.filter(o=>o.cat===id); if(!list.length) return '';
    return `<tr><td colspan="3" style="background:var(--surface-3);font-weight:640;font-size:.8rem">${esc(t)}</td></tr>` +
      list.map(o=>`<tr><td>${esc(o.mot)}</td><td>${esc(o.sens||'—')}</td><td class="small">${esc(o.geste||'—')}</td></tr>`).join('');
  }).join('');
  const body = `
    <p class="small muted">Imprime cette page et colle-la sur le frigo. Tant que tout le monde n'emploie pas exactement ces mots, le chien reçoit des consignes contradictoires.</p>
    <div class="card" style="margin-top:12px">
      <h3 style="margin-bottom:4px">Vocabulaire de ${esc(S.chien.nom||'la maison')}</h3>
      <p class="tiny muted" style="margin-bottom:10px">${S.foyer.length?'Foyer : '+esc(S.foyer.map(f=>f.nom).join(', ')):'Foyer non renseigné'} · mis à jour le ${fdate(todayISO())}</p>
      <div class="table-wrap"><table class="frigo"><thead><tr><th>On dit</th><th>Il doit</th><th>Geste</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>
    <button class="btn no-print" style="margin-top:14px" onclick="window.print()">Imprimer</button>`;
  openSheet('Fiche à afficher', 'Le même vocabulaire pour tout le monde.', body, null);
}

function exportOrdres(){
  if (!S.ordres.length){ toast('Aucun ordre à exporter.'); return; }
  const L = ['# Vocabulaire de '+(S.chien.nom||'la maison'), '',
    'Un mot = une action = un geste. Tout le foyer emploie exactement ces mots.', ''];
  if (S.foyer.length) L.push('**Foyer** : '+S.foyer.map(f=>f.nom+(f.role?' ('+f.role+')':'')).join(', '), '');
  CAT_ORDRE.forEach(([id,t])=>{
    const list = S.ordres.filter(o=>o.cat===id); if(!list.length) return;
    L.push('## '+t, '', '| On dit | Il doit | Geste | Statut | Employé par |', '|---|---|---|---|---|');
    list.forEach(o=>L.push('| **'+o.mot+'** | '+(o.sens||'—')+' | '+(o.geste||'—')+' | '+statutTxt(o.statut)+' | '+((o.qui||[]).join(', ')||'—')+' |'));
    L.push('');
  });
  const cf = conflitsOrdres();
  if (cf.length){ L.push('## Incohérences à corriger', '');
    cf.forEach(c=>L.push('- '+c.m.replace(/<[^>]+>/g,''))); L.push(''); }
  download('ordres-'+stamp()+'.md', L.join('\n'), 'text/markdown;charset=utf-8');
  toast('Vocabulaire exporté.');
}
</script>
<script>
/* =========================================================================
   VUE — MÉTRIQUES
   ========================================================================= */
VIEWS.metriques = () => {
  const n = VIEWS.metriques.n || 12;
  const W = weeks(n), L = W.map(w=>w.label);
  const agg = f => W.map(w=>{ const a = sliceRange(S.balades,w.from,w.to); return a.length ? f(a) : null; });
  const km = W.map(w=>sliceRange(S.balades,w.from,w.to).reduce((a,x)=>a+num(x.distance),0));
  const mn = W.map(w=>sliceRange(S.balades,w.from,w.to).reduce((a,x)=>a+num(x.duree),0));
  const nbBal = W.map(w=>sliceRange(S.balades,w.from,w.to).length);
  const nbSes = W.map(w=>sliceRange(S.sessions,w.from,w.to).length);
  const flairPct = W.map(w=>{ const a = sliceRange(S.balades,w.from,w.to);
    const d = a.reduce((s,x)=>s+num(x.duree),0), f = a.reduce((s,x)=>s+num(x.flair),0); return d?Math.round(f/d*100):null; });
  const rap = W.map(w=>{ const a = sliceRange(S.balades,w.from,w.to);
    const d = a.reduce((s,x)=>s+num(x.rappelsDem),0), o = a.reduce((s,x)=>s+num(x.rappelsOk),0); return d?Math.round(o/d*100):null; });
  const sesTaux = W.map(w=>{ const a = sliceRange(S.sessions,w.from,w.to);
    const e = a.reduce((s,x)=>s+num(x.essais),0), r = a.reduce((s,x)=>s+num(x.reussites),0); return e?Math.round(r/e*100):null; });
  const emoPic = agg(a=>+(a.reduce((s,x)=>s+num(x.emoPic),0)/a.length).toFixed(1));
  const emoFin = agg(a=>+(a.reduce((s,x)=>s+num(x.emoFin),0)/a.length).toFixed(1));
  const tirage = agg(a=>+(a.reduce((s,x)=>s+num(x.tirage),0)/a.length).toFixed(2));
  const react = agg(a=>+(a.reduce((s,x)=>s+num(x.reactivite),0)/a.length).toFixed(2));
  const score = agg(a=>Math.round(a.reduce((s,x)=>s+scoreBalade(x),0)/a.length));
  const recup = agg(a=>+(a.reduce((s,x)=>s+num(x.recup),0)/a.length).toFixed(1));
  const retours = agg(a=>+(a.reduce((s,x)=>s+num(x.retours),0)/a.length).toFixed(1));
  const croisOk = W.map(w=>{ const a = sliceRange(S.balades,w.from,w.to);
    const c = a.reduce((s,x)=>s+num(x.chiensCroises),0), k = a.reduce((s,x)=>s+num(x.croisCalmes),0); return c?Math.round(k/c*100):null; });
  const poidsPts = [...S.poids].sort((a,b)=>a.date.localeCompare(b.date));

  const card = (t, sub, chart) => `<div class="card"><h3>${esc(t)}</h3><p class="small muted" style="margin:2px 0 10px">${esc(sub)}</p>${chart}</div>`;

  return head('Métriques', 'L\'évolution de chaque indicateur, semaine par semaine. Une valeur manquante signifie qu\'il n\'y a eu aucune donnée cette semaine-là.',
    `<div class="seg">${[8,12,26,52].map(x=>`<button class="${n===x?'on':''}" onclick="VIEWS.metriques.n=${x};route()">${x} sem.</button>`).join('')}</div>`) + `
  <div class="grid g2">
    ${card('Volume de sortie','Distance parcourue par semaine.', barChart(km, L, {yfmt:v=>v+' km'}))}
    ${card('Temps dehors','Minutes cumulées par semaine, objectif en pointillé.', barChart(mn, L, {target:S.objectifs.minutesSem, color:'var(--sky)', yfmt:v=>v+' min'}))}
    ${card('Régularité','Nombre de balades et de séances par semaine.',
      lineChart([{name:'Balades',data:nbBal,color:'var(--moss)'},{name:'Séances',data:nbSes,color:'var(--violet)'}], L, {min:0,fill:false}))}
    ${card('Part de flair','Pourcentage du temps de balade passé à renifler. Le guide en fait un besoin fondamental.',
      lineChart([{name:'Flair',data:flairPct,color:'var(--moss)'}], L, {min:0,max:100,yfmt:v=>v+' %'}))}
    ${card('Fiabilité du rappel','Rappels réussis sur rappels demandés, en balade.',
      lineChart([{name:'Rappel',data:rap,color:'var(--ochre)'}], L, {min:0,max:100,yfmt:v=>v+' %'}))}
    ${card('Réussite en séance','Taux de réussite cumulé de tous les exercices travaillés.',
      lineChart([{name:'Séances',data:sesTaux,color:'var(--violet)'}], L, {min:0,max:100,yfmt:v=>v+' %'}))}
    ${card('Échelle émotionnelle','Pic atteint et état de fin de balade. On cherche à faire baisser les deux courbes.',
      lineChart([{name:'Pic',data:emoPic,color:'var(--rouge)'},{name:'Fin',data:emoFin,color:'var(--moss)'}], L, {min:0,max:10,fill:false}))}
    ${card('Tirage et réactivité','Notés de 0 à 5 à chaque balade. Une baisse est un progrès.',
      lineChart([{name:'Tirage',data:tirage,color:'var(--sky)'},{name:'Réactivité',data:react,color:'var(--rouge)'}], L, {min:0,max:5,fill:false}))}
    ${card('Croisements calmes','Part des chiens croisés sans réaction excessive.',
      lineChart([{name:'Croisements calmes',data:croisOk,color:'var(--sky)'}], L, {min:0,max:100,yfmt:v=>v+' %'}))}
    ${card('Connexion','Retours spontanés vers toi, en moyenne par balade. Le meilleur indicateur de lien selon le chapitre 5.',
      lineChart([{name:'Retours',data:retours,color:'var(--moss)'}], L, {min:0}))}
    ${card('Retour au calme','Minutes pour redescendre une fois rentré à la maison.',
      lineChart([{name:'Récupération',data:recup,color:'var(--ochre)'}], L, {min:0,yfmt:v=>v+' min'}))}
    ${card('Score global de balade','Synthèse pondérée : flair, calme, rappel, tirage, incidents.',
      lineChart([{name:'Score',data:score,color:'var(--moss)'}], L, {min:0,max:100}))}
  </div>
  ${poidsPts.length>1?`<div class="card" style="margin-top:14px"><h3>Poids</h3>
    <p class="small muted" style="margin:2px 0 10px">Toutes les pesées enregistrées${S.chien.poidsCible?`, cible ${esc(S.chien.poidsCible)} kg`:''}.</p>
    ${lineChart([{name:'Poids',data:poidsPts.map(p=>num(p.kg)),color:'var(--sky)'}], poidsPts.map(p=>fdateShort(p.date)), {yfmt:v=>v+' kg'})}</div>`:''}

  <div class="card" style="margin-top:14px"><h3>Progression par exercice</h3>
    <p class="small muted" style="margin:2px 0 10px">Palier validé et taux de réussite pour chaque fiche déjà travaillée.</p>
    <div class="table-wrap"><table><tr><th>Exercice</th><th>Catégorie</th><th>Séances</th><th>Palier</th><th>Réussite</th><th>Dernière</th></tr>
    ${EXOS.map(e=>{ const st = statsExo(e.id); if(!st.n) return '';
      return `<tr><td><b>${esc(e.t)}</b></td><td class="muted">${esc(catOf(e.cat).t)}</td><td class="num">${st.n}</td>
      <td class="num">${st.palier}/${e.paliers.length}</td><td class="num">${st.essais?st.taux+' %':'—'}</td><td>${fdateShort(st.derniere)}</td></tr>`;}).join('')
      || '<tr><td colspan="6" class="muted">Aucune séance enregistrée pour le moment.</td></tr>'}
    </table></div></div>`;
};

/* =========================================================================
   VUE — COMPTES RENDUS
   ========================================================================= */
VIEWS.rapports = () => {
  const per = VIEWS.rapports.per || 30;
  const from = addDays(todayISO(), -per+1), to = todayISO();
  const r = rapport(from, to);
  return head('Comptes rendus', 'Une synthèse rédigée de la période, prête à être exportée en Markdown ou imprimée.',
    `<div class="seg">${[7,30,90,365].map(x=>`<button class="${per===x?'on':''}" onclick="VIEWS.rapports.per=${x};route()">${x===7?'7 j':x===30?'30 j':x===90?'3 mois':'1 an'}</button>`).join('')}</div>
     <button class="btn ghost" onclick="exportRapport(${per})">Exporter en Markdown</button>
     <button class="btn ghost" onclick="window.print()">Imprimer</button>`) + r.html;
};
function rapport(from, to){
  const B = sliceRange(S.balades,from,to), Se = sliceRange(S.sessions,from,to),
        J = sliceRange(S.journal,from,to), Sg = sliceRange(S.signaux,from,to), H = sliceRange(S.sante,from,to);
  const km = B.reduce((a,x)=>a+num(x.distance),0), mn = B.reduce((a,x)=>a+num(x.duree),0),
        fl = B.reduce((a,x)=>a+num(x.flair),0);
  const rd = B.reduce((a,x)=>a+num(x.rappelsDem),0), ro = B.reduce((a,x)=>a+num(x.rappelsOk),0);
  const cc = B.reduce((a,x)=>a+num(x.chiensCroises),0), ck = B.reduce((a,x)=>a+num(x.croisCalmes),0);
  const inc = B.reduce((a,x)=>a+num(x.incidents),0);
  const sc = B.length ? Math.round(B.reduce((a,x)=>a+scoreBalade(x),0)/B.length) : 0;
  const emoPic = B.length ? (B.reduce((a,x)=>a+num(x.emoPic),0)/B.length).toFixed(1) : '—';
  const emoFin = B.length ? (B.reduce((a,x)=>a+num(x.emoFin),0)/B.length).toFixed(1) : '—';
  const tir = B.length ? (B.reduce((a,x)=>a+num(x.tirage),0)/B.length).toFixed(1) : '—';
  const es = Se.reduce((a,x)=>a+num(x.essais),0), rs = Se.reduce((a,x)=>a+num(x.reussites),0);
  const parExo = {}; Se.forEach(s=>{ const k = s.exoId; parExo[k] = parExo[k]||{n:0,e:0,r:0}; parExo[k].n++; parExo[k].e+=num(s.essais); parExo[k].r+=num(s.reussites); });
  const lieux = {}; B.forEach(b=>{ if(b.lieu) lieux[b.lieu] = (lieux[b.lieu]||0)+1; });
  const topLieux = Object.entries(lieux).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const progres = J.filter(j=>j.progres).slice(0,10);

  const nom = S.chien.nom || 'Le chien';
  const lignes = [];
  if (B.length) lignes.push(`${B.length} balade${B.length>1?'s':''} pour ${km.toFixed(1)} km et ${fmin(mn)} dehors, dont ${fmin(fl)} de flair (${pct(fl,mn)} % du temps).`);
  if (rd) lignes.push(`${ro} rappels réussis sur ${rd} demandés, soit ${pct(ro,rd)} %.`);
  if (cc) lignes.push(`${cc} chiens croisés, dont ${ck} croisements calmes (${pct(ck,cc)} %).`);
  if (B.length) lignes.push(`Pic émotionnel moyen à ${emoPic}/10, état de fin de balade à ${emoFin}/10, tirage moyen ${tir}/5.`);
  if (Se.length) lignes.push(`${Se.length} séance${Se.length>1?'s':''} d'entraînement sur ${Object.keys(parExo).length} exercice${Object.keys(parExo).length>1?'s':''}, ${es?pct(rs,es)+' % de réussite':'sans score chiffré'}.`);
  if (inc) lignes.push(`${inc} incident${inc>1?'s':''} noté${inc>1?'s':''} sur la période.`);
  if (H.length) lignes.push(`${H.length} entrée${H.length>1?'s':''} de santé enregistrée${H.length>1?'s':''}.`);
  if (!lignes.length) lignes.push('Aucune donnée sur cette période.');

  const html = `
  <div class="card pad-lg" style="margin-bottom:16px">
    <h2>${esc(nom)} — du ${fdate(from)} au ${fdate(to)}</h2>
    <ul style="margin-top:10px">${lignes.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>
  </div>
  <div class="grid g4" style="margin-bottom:16px">
    ${kpi('Balades',B.length)}${kpi('Distance',km.toFixed(1),'km')}${kpi('Temps dehors',fmin(mn))}${kpi('Score moyen',sc||'—',sc?'/100':'')}
  </div>
  ${Object.keys(parExo).length?`<div class="card" style="margin-bottom:16px"><h3 style="margin-bottom:10px">Entraînement de la période</h3>
    <div class="table-wrap"><table><tr><th>Exercice</th><th>Séances</th><th>Réussite</th><th>Palier atteint</th><th>Conduite à tenir</th></tr>
    ${Object.entries(parExo).map(([id,v])=>{ const e = exoById(id)||{t:id,paliers:[],ok:[],ko:[]};
      const taux = v.e?pct(v.r,v.e):null;
      const cond = taux===null ? 'Observation' : taux>=80 ? (e.ok?e.ok[0]:'Monter d\'un palier') : taux>=50 ? 'Consolider ce palier' : (e.ko?e.ko[0]:'Redescendre');
      return `<tr><td><b>${esc(e.t)}</b></td><td class="num">${v.n}</td><td class="num">${taux===null?'—':taux+' %'}</td>
      <td class="num">${palierCourant(id)}/${e.paliers.length||'—'}</td><td class="small">${esc(cond)}</td></tr>`;}).join('')}
    </table></div></div>`:''}
  ${topLieux.length?`<div class="card" style="margin-bottom:16px"><h3 style="margin-bottom:8px">Lieux les plus fréquentés</h3>
    <div class="row">${topLieux.map(l=>`<span class="pill">${esc(l[0])} · ${l[1]}</span>`).join('')}</div></div>`:''}
  ${Sg.length?`<div class="card" style="margin-bottom:16px"><h3 style="margin-bottom:8px">Signaux observés</h3>
    <ul>${Sg.slice(0,12).map(s=>`<li><b>${esc(s.signal)}</b> — ${esc(s.contexte||'')} ${s.action?`(réaction : ${esc(s.action)})`:''}</li>`).join('')}</ul></div>`:''}
  ${progres.length?`<div class="card"><h3 style="margin-bottom:8px">Micro-progrès notés</h3>
    <ul>${progres.map(j=>`<li>${fdateShort(j.date)} — ${esc(j.progres)}</li>`).join('')}</ul></div>`:''}`;

  const md = [`# ${nom} — compte rendu du ${fdate(from)} au ${fdate(to)}`, '', ...lignes.map(l=>'- '+l), '',
    '## Balades', '', '| Date | Lieu | Durée | Distance | Flair | Rappels | Pic | Fin | Score |',
    '|---|---|---|---|---|---|---|---|---|',
    ...sortDesc(B).map(b=>`| ${b.date} | ${b.lieu||''} | ${num(b.duree)} min | ${num(b.distance)} km | ${num(b.flair)} min | ${num(b.rappelsOk)}/${num(b.rappelsDem)} | ${num(b.emoPic)}/10 | ${num(b.emoFin)}/10 | ${scoreBalade(b)}/100 |`),
    '', '## Entraînement', '', '| Exercice | Séances | Essais | Réussites | Taux | Palier |', '|---|---|---|---|---|---|',
    ...Object.entries(parExo).map(([id,v])=>{ const e = exoById(id)||{t:id,paliers:[]};
      return `| ${e.t} | ${v.n} | ${v.e} | ${v.r} | ${v.e?pct(v.r,v.e)+' %':'—'} | ${palierCourant(id)}/${e.paliers.length||'-'} |`;}),
    '', ...(Sg.length?['## Signaux','', ...Sg.map(s=>`- ${s.date} — **${s.signal}** — ${s.contexte||''} ${s.action?`(réaction : ${s.action})`:''}`),'']:[]),
    ...(progres.length?['## Micro-progrès','', ...progres.map(j=>`- ${j.date} — ${j.progres}`),'']:[])
  ].join('\n');
  return {html, md};
}

const TYPES_SANTE = [
  ['vaccin','Vaccin',365],['rappel-vaccin','Rappel de vaccin',365],['vermifuge','Vermifuge',90],
  ['antipara','Antiparasitaire externe',30],['veto','Visite vétérinaire',0],['traitement','Traitement',0],
  ['analyse','Analyse / examen',0],['dentaire','Soin dentaire',180],['toilettage','Toilettage',60],
  ['griffes','Coupe de griffes',30],['incident','Incident / blessure',0],['autre','Autre',0]
];
function alertesSante(){
  const out = [];
  S.sante.forEach(h=>{
    if (!h.rappelJours || !h.date) return;
    const due = addDays(h.date, num(h.rappelJours));
    const d = daysBetween(todayISO(), due);
    if (d <= 30) out.push({t:(TYPES_SANTE.find(t=>t[0]===h.type)||[,h.type])[1]+(h.libelle?' — '+h.libelle:''),
      s:'Échéance le '+fdate(due), q: d<0 ? 'en retard de '+(-d)+' j' : d===0 ? "aujourd'hui" : 'dans '+d+' j',
      c: d<0 ? 'rouge' : d<=7 ? 'ochre' : '', d});
  });
  S.taches.filter(t=>!t.fait && t.date).forEach(t=>{
    const d = daysBetween(todayISO(), t.date);
    if (d <= 14) out.push({t:t.titre, s:'Tâche prévue le '+fdate(t.date),
      q: d<0 ? 'en retard' : d===0 ? "aujourd'hui" : 'dans '+d+' j', c: d<0?'rouge':d<=3?'ochre':'', d});
  });
  return out.sort((a,b)=>a.d-b.d).slice(0,8);
}
VIEWS.sante = () => {
  const list = sortDesc(S.sante);
  const alertes = alertesSante();
  return head('Santé & soins', 'Vaccins, vermifuges, antiparasitaires, visites et traitements. Renseigne un rappel en jours pour recevoir l\'échéance sur le tableau de bord.',
    `<button class="btn" onclick="formSante()">Ajouter un soin</button>
     <button class="btn ghost" onclick="exportCSV('sante')">Exporter en CSV</button>`) +
  (alertes.length?`<div class="card" style="margin-bottom:16px;border-left:3px solid var(--ochre)"><h3 style="margin-bottom:8px">Échéances</h3>
    ${alertes.map(a=>`<div class="warn-row"><span class="pill ${a.c}">${esc(a.q)}</span><div><b>${esc(a.t)}</b><div class="tiny muted">${esc(a.s)}</div></div></div>`).join('')}</div>`:'') +
  (list.length ? `<div class="table-wrap card"><table>
      <tr><th>Date</th><th>Type</th><th>Détail</th><th>Praticien</th><th>Coût</th><th>Prochaine échéance</th><th></th></tr>
      ${list.map(h=>{ const t = TYPES_SANTE.find(x=>x[0]===h.type);
        const due = h.rappelJours ? addDays(h.date, num(h.rappelJours)) : null;
        const d = due ? daysBetween(todayISO(), due) : null;
        return `<tr><td>${fdate(h.date)}</td><td><b>${esc(t?t[1]:h.type)}</b></td>
        <td>${esc(h.libelle||'')}${h.notes?`<div class="tiny muted">${esc(h.notes)}</div>`:''}</td>

        <td><button class="icon-btn" onclick="formSante('${h.id}')">✎</button>
            <button class="icon-btn" onclick="del('sante','${h.id}','ce soin')">🗑</button></td></tr>`;}).join('')}

function ligne(l, v){ return `<div class="spread" style="padding:6px 0;border-bottom:1px solid var(--line)">

function bloc(l, v){ return `<div style="margin-bottom:10px"><div class="small muted">${esc(l)}</div>

/* =========================================================================
   VUE — DONNÉES

VIEWS.donnees = () => {

      <div class="row">

git branch -M main

git push -u origin main</code></pre>
    <p class="small muted">Active ensuite GitHub Pages sur la branche <code class="k">main</code> : l'app sera accessible depuis ton téléphone. Pense à recommitter <code class="k">donnees.json</code> après chaque export pour garder un historique versionné.</p>
  </div>

  <div class="card pad-lg" style="margin-top:14px;border-left:3px solid var(--rouge)">

<script>
/* =========================================================================
   MODE TERRAIN
   Chrono + compteurs en un tap pendant la balade. À l'arrêt, le formulaire
   de balade arrive pré-rempli : il ne reste que le ressenti à saisir.
   La session est sauvegardée à chaque tap : si le téléphone se verrouille
   ou que la page recharge, on reprend exactement où on en était.
   ========================================================================= */

const TAPS = [
  {g:'Rappel et connexion', k:'rappelsDem',       l:'Rappel demandé'},
  {g:'Rappel et connexion', k:'rappelsOk',        l:'Rappel réussi',        c:'moss'},
  {g:'Rappel et connexion', k:'retours',          l:'Retour spontané',      c:'moss'},
  {g:'Rappel et connexion', k:'regards',          l:'Regard offert',        c:'moss'},
  {g:'Croisements',         k:'chiensCroises',    l:'Chien croisé'},
  {g:'Croisements',         k:'croisCalmes',      l:'Croisement calme',     c:'moss'},
  {g:'Croisements',         k:'rencontres',       l:'Rencontre, contact'},
  {g:'Croisements',         k:'rencontresTendues',l:'Rencontre tendue',     c:'rouge'},
  {g:'Croisements',         k:'humains',          l:'Personne de près'},
  {g:'Croisements',         k:'velos',            l:'Vélo, joggeur'},
  {g:'Croisements',         k:'enfants',          l:'Enfant'},
  {g:'Croisements',         k:'animaux',          l:'Autre animal'},
  {g:'Besoins et incidents',k:'pauses',           l:'Pause d\'observation'},
  {g:'Besoins et incidents',k:'pipi',             l:'Pipi'},
  {g:'Besoins et incidents',k:'selles',           l:'Selles'},
  {g:'Besoins et incidents',k:'incidents',        l:'Incident',             c:'rouge'}
];

let _tTick = null;

/* ---- Chronométrage : basé sur des horodatages, juste même en arrière-plan ---- */
function tElapsed(){
  const t = S.terrain; if (!t) return 0;
  const end = t.pauseAt || Date.now();
  return Math.max(0, end - t.t0 - (t.pauseMs||0));
}
function tFlair(){
  const t = S.terrain; if (!t) return 0;
  let ms = t.flairMs || 0;
  if (t.flairAt && !t.pauseAt) ms += Date.now() - t.flairAt;
  return ms;
}
function hms(ms){
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  return (h?h+':'+String(m).padStart(2,'0'):String(m)) + ':' + String(s%60).padStart(2,'0');
}

/* ---- Démarrer / reprendre ---- */
function terrainStart(){
  if (S.terrain){ openTerrain(); return; }
  S.terrain = {id:uid(), t0:Date.now(), pauseAt:null, pauseMs:0, flairAt:null, flairMs:0,
    date:todayISO(), heure:nowHM(), lieu:'', terrain:'', equipement:'', c:{}, sig:[]};
  persist(true); openTerrain();
  toast('Chrono lancé. Tape les compteurs au fur et à mesure.');
}
function terrainAnnuler(){
  if (!confirm('Abandonner cette balade en cours ? Les compteurs seront perdus.')) return;
  S.terrain = null; closeTerrain(); commit('Balade en cours abandonnée.');
}

/* ---- Rendu ---- */
function openTerrain(){
  if (!S.terrain) return;
  const t = S.terrain;
  const lieux = [...new Set(S.balades.map(b=>b.lieu).filter(Boolean))].slice(0,20);
  let groupes = '', last = '';
  TAPS.forEach(x=>{
    if (x.g !== last){ groupes += (last?'</div>':'') + `<div class="tsec">${esc(x.g)}</div><div class="tgrid">`; last = x.g; }
    groupes += `<button class="tap ${x.c||''}" data-tap="${x.k}">
      <span class="ct" id="ct-${x.k}">${num(t.c[x.k])||0}</span><span class="lb">${esc(x.l)}</span></button>`;
  });
  groupes += '</div>';

  $('#terrainHost').innerHTML = `<div class="terrain" role="dialog" aria-modal="true">
    <div class="terrain-head">
      <div>
        <div class="chrono ${t.pauseAt?'pause':''}" id="chronoV">${hms(tElapsed())}</div>
        <div class="chrono-sub" id="chronoSub">Départ ${esc(t.heure)} · flair <b id="flairV" class="num">${hms(tFlair())}</b></div>
      </div>
      <div class="row" style="flex-wrap:nowrap">
        <button class="btn ghost sm" id="tPause">${t.pauseAt?'Reprendre':'Pause'}</button>
        <button class="icon-btn" id="tMin" title="Réduire" aria-label="Réduire">▾</button>
      </div>
    </div>
    <div class="terrain-body">
      <button class="tap wide big" id="tFlair">
        <span class="lb" style="font-size:.95rem;font-weight:640">${t.flairAt?'Flair en cours, taper pour arrêter':'Il renifle : démarrer le chrono flair'}</span>
        <span class="ct" id="flairV2">${hms(tFlair())}</span></button>
      ${groupes}
      <details class="acc" style="margin-top:20px"${t.lieu?' open':''}>
        <summary>Lieu et équipement${t.lieu?' — '+esc(t.lieu):''}</summary>
        <div class="in"><div class="grid g3">
          <label class="f"><span>Lieu</span><input type="text" id="tLieu" list="tLieux" value="${esc(t.lieu)}" placeholder="Parc, chemin…"></label>
          <label class="f"><span>Terrain</span><select id="tTerrain">${OPT_TERRAIN.map(o=>`<option${t.terrain===o?' selected':''}>${esc(o)}</option>`).join('')}</select></label>
          <label class="f"><span>Équipement</span><select id="tEquip">${OPT_EQUIP.map(o=>`<option${t.equipement===o?' selected':''}>${esc(o)}</option>`).join('')}</select></label>
        </div></div>
      </details>
      <datalist id="tLieux">${lieux.map(l=>`<option value="${esc(l)}">`).join('')}</datalist>
      <div class="tsec">Signaux observés ${t.sig.length?`<span class="pill ochre">${t.sig.length}</span>`:''}</div>
      <button class="tap wide" id="tSignal"><span class="lb">Noter un signal d'inconfort</span><span class="ct">${ico('signaux')}</span></button>
      ${t.sig.length?`<div class="row" style="margin-top:9px">${t.sig.map((x,i)=>`<span class="pill ochre">${esc(x)}
        <button class="x-mini" data-unsig="${i}" aria-label="Retirer ce signal">✕</button></span>`).join('')}</div>`:''}
    </div>
    <div class="terrain-foot">
      <button class="btn ghost" id="tCancel">Abandonner</button>
      <button class="btn" id="tStop">Terminer la balade</button>
    </div></div>`;

  document.body.style.overflow = 'hidden';
  $('#tMin').onclick = () => { closeTerrain(); route(); };
  $('#tCancel').onclick = terrainAnnuler;
  $('#tStop').onclick = terrainStop;
  $('#tPause').onclick = terrainPause;
  $('#tFlair').onclick = terrainFlairToggle;
  $('#tSignal').onclick = terrainSignal;
  ['tLieu','tTerrain','tEquip'].forEach(id=>{
    const el = document.getElementById(id); if(!el) return;
    el.onchange = el.oninput = () => {
      if (!S.terrain) return;
      S.terrain.lieu = $('#tLieu').value; S.terrain.terrain = $('#tTerrain').value;
      S.terrain.equipement = $('#tEquip').value; persistSoon();
    };
  });
  $('#terrainHost').querySelectorAll('[data-tap]').forEach(b=> b.onclick = () => bump(b.dataset.tap, b));
  $('#terrainHost').querySelectorAll('[data-unsig]').forEach(b=> b.onclick = () => {
    S.terrain.sig.splice(num(b.dataset.unsig),1); persist(true); openTerrain(); });

  clearInterval(_tTick);
  _tTick = setInterval(terrainTick, 1000);
}
function closeTerrain(){
  clearInterval(_tTick); _tTick = null;
  $('#terrainHost').innerHTML = ''; document.body.style.overflow = '';
}
function terrainTick(){
  if (!S.terrain || !$('#chronoV')){ clearInterval(_tTick); return; }
  $('#chronoV').textContent = hms(tElapsed());
  const f = hms(tFlair());
  if ($('#flairV')) $('#flairV').textContent = f;
  if ($('#flairV2')) $('#flairV2').textContent = f;
}
function terrainPause(){
  const t = S.terrain; if(!t) return;
  if (t.pauseAt){ t.pauseMs += Date.now() - t.pauseAt; t.pauseAt = null;
    if (t.flairWasOn){ t.flairAt = Date.now(); t.flairWasOn = false; } }
  else { if (t.flairAt){ t.flairMs += Date.now() - t.flairAt; t.flairAt = null; t.flairWasOn = true; }
    t.pauseAt = Date.now(); }
  persist(true); openTerrain();
}
function terrainFlairToggle(){
  const t = S.terrain; if(!t || t.pauseAt) return;
  if (t.flairAt){ t.flairMs += Date.now() - t.flairAt; t.flairAt = null; }
  else t.flairAt = Date.now();
  persist(true); openTerrain();
}
function bump(k, btn){
  const t = S.terrain; if(!t) return;
  t.c[k] = (num(t.c[k])||0) + 1;
  const el = document.getElementById('ct-'+k); if (el) el.textContent = t.c[k];
  if (btn){ btn.classList.add('hit'); setTimeout(()=>btn.classList.remove('hit'), 260); }
  try { if (navigator.vibrate) navigator.vibrate(12); } catch(e){}
  persistSoon();
}
function terrainSignal(){
  const t = S.terrain; if(!t) return;
  const body = `<p class="small muted">Les signaux sont classés du plus discret au plus net. Plus tu réagis tôt, moins il monte.</p>
    <div class="tgrid" style="margin-top:12px">${SIGNAUX_REF.map((s,i)=>
      `<button class="tap" data-sg="${i}"><span class="lb" style="font-weight:600;color:var(--ink)">${esc(s.n)}</span>
        <span class="lb">Niveau ${s.niv} — ${esc(s.a)}</span></button>`).join('')}</div>`;
  openSheet('Signal observé', 'Ajouté à la balade et au carnet de signaux.', body, null);
  document.querySelectorAll('#sheetBody [data-sg]').forEach(b=> b.onclick = () => {
    const s = SIGNAUX_REF[num(b.dataset.sg)];
    S.terrain.sig.push(s.n);
    S.signaux.push({id:uid(), date:todayISO(), heure:nowHM(), signal:s.n, niveau:s.niv,
      contexte:'Relevé en balade' + (S.terrain.lieu?' — '+S.terrain.lieu:''), action:s.a, resultat:''});
    persist(true); closeSheet(); openTerrain(); toast('Signal noté.');
  });
}

/* ---- Terminer : bascule vers le formulaire pré-rempli ---- */
function terrainStop(){
  const t = S.terrain; if(!t) return;
  if (t.flairAt){ t.flairMs += Date.now() - t.flairAt; t.flairAt = null; }
  const mins = Math.max(1, Math.round(tElapsed()/60000));
  const pre = Object.assign({}, t.c, {
    date: t.date, heure: t.heure, lieu: t.lieu, terrain: t.terrain, equipement: t.equipement,
    duree: mins, flair: Math.round(tFlair()/60000),
    signaux: t.sig.join(' · '), _live: true
  });
  closeTerrain();
  formBalade(null, pre);
}

/* ---- Bandeau de reprise, affiché en haut de toutes les vues ---- */
function liveBar(){
  const t = S.terrain; if(!t) return '';
  const n = Object.values(t.c).reduce((a,b)=>a+num(b),0);
  return `<div class="livebar no-print">
    <div><b>Balade en cours</b> — ${hms(tElapsed())}${t.pauseAt?' (en pause)':''} · ${n} événement${n>1?'s':''} noté${n>1?'s':''}${t.lieu?' · '+esc(t.lieu):''}</div>
    <div class="row" style="flex-wrap:nowrap">
      <button class="btn sm" onclick="openTerrain()">Reprendre</button>
      <button class="btn ghost sm" onclick="terrainStop()">Terminer</button>
    </div></div>`;
}
</script>
<script>

    ${group('Rappel et connexion', [
      {k:'rappelsDem', l:'Rappels demandés', t:'number', min:0},
      {k:'rappelsOk', l:'Rappels réussis', t:'number', min:0},
      {k:'retours', l:'Retours spontanés récompensés', t:'number', min:0},
      {k:'regards', l:'Regards offerts', t:'number', min:0}
    ], b)}

    ${group('Besoins et incidents', [

      {k:'incidents', l:'Incidents', hint:'aboiement en rafale, conflit, fugue…', t:'number', min:0},

    ${plain([

function formSession(id, exoPre){

    ], s)}

      {k:'reussites', l:'Nombre de réussites', t:'number', min:0}
    ], s)}
    ${plain([
      {k:'distraction', l:'Niveau de distraction', t:'range', min:0, max:5, lo:'aucune', hi:'maximale'}
    ], s, 'g2')}

      {k:'lieu', l:'Lieu', ph:'Salon, jardin, parking, parc…'},

function stamp(){ return (S.chien.nom||'chien').toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-' + todayISO(); }

function exportCSV(coll){
  const rows = S[coll]; if(!rows.length){ toast('Rien à exporter dans '+coll+'.'); return; }
  const keys = [...new Set(rows.flatMap(r=>Object.keys(r)))];
  const cell = v => { const s = v===undefined||v===null?'':String(v);
    return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const csv = [keys.join(';'), ...sortDesc(rows).map(r=>keys.map(k=>cell(r[k])).join(';'))].join('\n');
  download(coll+'-'+stamp()+'.csv', '\uFEFF'+csv, 'text/csv;charset=utf-8');
  toast('CSV téléchargé.');
}

  CATS.forEach(c=>{
    const list = EXOS.filter(e=>e.cat===c.id); if(!list.length) return;
    L.push('## '+c.t, '');
    list.forEach(e=>{
      const st = statsExo(e.id);
      L.push('### '+e.t, '');
      L.push('- **Source** : '+(e.ch?'guide, chapitre '+e.ch:'fiche de base'));
      L.push('- **Objectif** : '+e.obj);
      L.push('- **Pourquoi** : '+e.why);
      L.push('- **Matériel** : '+e.mat.join(', '));
      L.push('- **Environnement** : '+e.env+' — **Durée** : '+e.duree);
      if (st.n) L.push('- **Mon suivi** : '+st.n+' séances, palier '+st.palier+'/'+e.paliers.length+', '+st.taux+' % de réussite');
      L.push('', '**Déroulé**', '');
      e.etapes.forEach((x,i)=>L.push((i+1)+'. '+x));
      L.push('', '**Paliers**', '');
      e.paliers.forEach(p=>L.push('- Palier '+p.n+' — '+p.t+' *(critère : '+p.crit+')*'));
      L.push('', '**Si la séance a réussi**', '');
      e.ok.forEach(x=>L.push('- '+x));
      L.push('', '**Si la séance a échoué**', '');
      e.ko.forEach(x=>L.push('- '+x));
      if (e.err.length){ L.push('', '**Erreurs fréquentes**', ''); e.err.forEach(x=>L.push('- '+x)); }
      if (e.stop && e.stop.length){ L.push('', '**Signaux d\'arrêt**', ''); e.stop.forEach(x=>L.push('- '+x)); }
      L.push('');
    });
  });
  download('fiches-exercices.md', L.join('\n'), 'text/markdown;charset=utf-8');
  toast('Fiches exportées.');
}
function importJSON(mode){
  const f = $('#fileIn'); if(!f || !f.files[0]){ toast('Choisis d\'abord un fichier.'); return; }
  if (mode==='remplace' && !confirm('Remplacer toutes les données actuelles ? Cette action est définitive.')) return;
  const rd = new FileReader();
  rd.onload = () => {
    let d; try { d = JSON.parse(rd.result); } catch(e){ toast('Fichier illisible : ce n\'est pas du JSON valide.'); return; }
    if (!d || typeof d !== 'object'){ toast('Fichier inattendu.'); return; }
    if (mode==='remplace') S = Object.assign(blank(), d);
    else {
      COLLS.forEach(k=>{
        if (!Array.isArray(d[k])) return;
        const ids = new Set(S[k].map(x=>x.id));
        d[k].forEach(x=>{ if(!ids.has(x.id)) S[k].push(x); });
      });
      if (d.chien) Object.keys(d.chien).forEach(k=>{ if(!S.chien[k]) S.chien[k] = d.chien[k]; });
    }
    commit(mode==='remplace' ? 'Données remplacées.' : 'Données fusionnées.');
  };
  rd.readAsText(f.files[0]);
}
function wipe(){
  if (!confirm('Effacer toutes les données de cet appareil ? Exporte d\'abord si tu veux les garder.')) return;
  if (!confirm('Confirmation : tout sera perdu.')) return;
  S = blank(); commit('Données effacées.');
}

function seed(){
  if (S.balades.length && !confirm('Cela ajoutera des données d\'exemple aux tiennes. Continuer ?')) return;
  const R = (a,b)=>Math.round(a+Math.random()*(b-a));
  const F = (a,b)=>+(a+Math.random()*(b-a)).toFixed(1);
  S.chien = Object.assign(S.chien, {nom:S.chien.nom||'Nala', sexe:'Femelle', race:'Croisée berger', taille:'Moyen (10-25 kg)',
    naissance:addDays(todayISO(),-540), adoption:addDays(todayISO(),-70), origine:'Refuge', poidsCible:'18',
    peurs:'Vélos qui arrivent de derrière, gros chiens qui foncent', motivations:'Poulet séché, jeu de traction'});
  const lieux = ['Parc de la Tête d\'Or','Berges du Rhône','Chemin des vignes','Bois de la Cerisaie','Quartier, tour du pâté de maisons'];
  for (let i=55;i>=0;i--){
    if (Math.random()<0.18) continue;
    const p = (55-i)/55;                              // progression dans le temps
    const duree = R(30,80), flair = Math.round(duree*(0.18+p*0.30));
    const rd = R(2,7), ro = Math.min(rd, Math.round(rd*(0.5+p*0.45)));
    const cc = R(0,6);
    S.balades.push({id:uid(), date:addDays(todayISO(),-i), heure:['08:15','12:30','18:45','19:30'][R(0,3)],
      lieu:lieux[R(0,lieux.length-1)], terrain:OPT_TERRAIN[R(1,5)], meteo:OPT_METEO[R(1,4)],
      equipement:p>0.6?OPT_EQUIP[R(3,6)]:OPT_EQUIP[R(1,4)],
      duree, distance:F(duree*0.045, duree*0.075), flair, jeu:R(0,10), pauses:R(0,3),
      emoDepart:R(1,4), emoPic:Math.max(2,R(8,9)-Math.round(p*3)), emoFin:Math.max(1,R(4,6)-Math.round(p*3)),
      tirage:Math.max(0,R(3,5)-Math.round(p*3)), reactivite:Math.max(0,R(2,4)-Math.round(p*2)),
      chiensCroises:cc, croisCalmes:Math.round(cc*(0.4+p*0.55)), rencontres:R(0,2), rencontresTendues:Math.random()<0.12?1:0,
      humains:R(2,14), velos:R(0,5), enfants:R(0,4), animaux:R(0,3),
      rappelsDem:rd, rappelsOk:ro, retours:R(1,4)+Math.round(p*5), regards:R(2,9),
      pipi:R(2,6), selles:R(1,2), sellesQualite:'Normales',
      incidents:Math.random()<0.08?1:0, recup:Math.max(2,R(20,35)-Math.round(p*22)),
      signaux:['Détournement de regard à l\'approche d\'un chien','Bâillement avant le croisement','Corps un peu raide, puis relâché','',''][R(0,4)],
      notes:''});
  }
  const plan = ['rappel-positif','croisement-calme','marche-laisse','banc-obs','valoriser-calme','tapis','regard-volontaire','longe'];
  for (let i=50;i>=0;i-=2){
    const p = (50-i)/50, exo = plan[R(0,plan.length-1)];
    const essais = R(6,12), reussites = Math.min(essais, Math.round(essais*(0.45+p*0.5)));
    S.sessions.push({id:uid(), date:addDays(todayISO(),-i), exoId:exo, palier:1+Math.round(p*3),
      duree:R(3,12), essais, reussites, distraction:R(0,4), lieu:['Salon','Jardin','Parking','Chemin','Parc'][R(0,4)],
      recompense:['Friandises haute valeur','Croquettes','Jouet','Jackpot'][R(0,3)],
      emoAvant:R(1,4), emoApres:R(1,4), notes:''});
  }
  for (let i=60;i>=0;i-=10) S.poids.push({id:uid(), date:addDays(todayISO(),-i), kg:+(16.4+ (60-i)/60*1.4 + Math.random()*0.3).toFixed(1), nec:5});
  S.sante.push({id:uid(), date:addDays(todayISO(),-62), type:'vaccin', libelle:'CHPPiL + rage', praticien:'Clinique du Parc', rappelJours:365, cout:78});
  S.sante.push({id:uid(), date:addDays(todayISO(),-40), type:'vermifuge', libelle:'Milbemax', rappelJours:90, cout:12.5});
  S.sante.push({id:uid(), date:addDays(todayISO(),-15), type:'antipara', libelle:'Pipette', rappelJours:30, cout:14});
  S.taches.push({id:uid(), titre:'Racheter des friandises haute valeur', date:addDays(todayISO(),3), fait:false});
  S.taches.push({id:uid(), titre:'Prendre rendez-vous pour le rappel de vaccin', date:addDays(todayISO(),20), fait:false});
  S.contacts.push({id:uid(), nom:'Clinique du Parc', role:'Vétérinaire', tel:'04 78 00 00 00'});
  S.contacts.push({id:uid(), nom:'Gus, le beagle du voisin', role:'Chien copain', eval:'À privilégier', notes:'Fait des pauses, respecte les signaux.'});
  for (let i=6;i>=0;i--) S.journal.push({id:uid(), date:addDays(todayISO(),-i), humeur:R(3,5), emo:R(2,5),
    sommeil:R(12,17), calme:R(30,120), proprete:'Parfaite', mordillements:R(0,2), seul:R(60,180), seulOk:true,
    progres:['Elle a décroché seule d\'un chien à 15 m','Retour au calme en 6 minutes au lieu de 20','Trois retours spontanés sans rappel','Elle est allée sur son tapis toute seule'][R(0,3)]});
  S.signaux.push({id:uid(), date:addDays(todayISO(),-4), signal:'Détournement de regard', contexte:'Gros chien de face sur un chemin étroit', action:'Demi-tour positif, récompense', resultat:'Elle a suivi tout de suite, pas de fixation'});
  if (!S.foyer.length){ S.foyer.push({id:uid(), nom:'Léo', role:'Référent principal'},
    {id:uid(), nom:'Marie', role:'Co-référent'}); }
  if (!S.ordres.length){
    chargerOrdresBaseSilencieux();
    const o = S.ordres;
    const set = (mot, patch) => { const x = o.find(y=>y.mot===mot); if (x) Object.assign(x, patch); };
    set('Ici',   {statut:'en-cours', essais:120, reussites:88, qui:['Léo','Marie'], recompense:'Poulet séché', contexte:'Longe de 10 m, chemin peu fréquenté'});
    set('Assis', {statut:'acquis', essais:200, reussites:194, qui:['Léo','Marie']});
    set('Panier',{statut:'en-cours', essais:60, reussites:41, qui:['Léo']});
    set('Laisse',{statut:'a-revoir', essais:45, reussites:19, qui:['Léo','Marie'], aEviter:'Tirer sur la laisse en même temps : il associe le mot à la contrainte.'});
    o.push({id:uid(), mot:'Viens', sens:"Revenir jusqu\u2019au contact et rester", geste:'Main qui fait signe',
      cat:'securite', statut:'en-cours', qui:['Marie'], essais:20, reussites:9,
      notes:"Doublon volontaire pour l'exemple : deux mots pour le même rappel, l'app le signale."});
  }
  S.signaux.push({id:uid(), date:addDays(todayISO(),-2), signal:'Corps qui se raidit', contexte:'Chien qui fonce sans retenue', action:'Écart de 10 m et changement de trottoir', resultat:'Redescendue en moins d\'une minute'});
  commit('Jeu d\'exemple chargé.');
}
