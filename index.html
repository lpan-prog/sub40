<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root{
  --paper:#FBFAF7;
  --grid:#DFE6EF;
  --rule:#D0564E;
  --ink:#1F3557;
  --ink-soft:#4A6183;
  --graphite:#232830;
  --muted:#79828F;
  --hair:#DCDAD2;
  --ok:#2C7150;
  --ok-bg:#E4F0E8;
  --no:#B4382F;
  --no-bg:#FAE6E3;
  --mark:#F6E27A;
  --card:#FFFFFF;
  --shadow:0 1px 0 rgba(35,40,48,.06);
  --r:10px;
  --fs:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
  background-position:-1px -1px;
  color:var(--graphite);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:var(--fs);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
}
#app{
  max-width:600px;margin:0 auto;
  background:rgba(251,250,247,.93);
  border-left:2px solid var(--rule);
  min-height:100vh;
  padding:0 16px 32px 18px;
}
@media(min-width:640px){#app{border-right:1px solid var(--hair)}}

h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.15}
h1{font-size:27px}
h2{font-size:20px;margin:26px 0 10px}
h3{font-size:16px;margin:18px 0 6px;font-weight:500}
p{margin:.55em 0}
a{color:var(--ink)}

.en{font-family:"Newsreader",Georgia,serif;font-size:1.06em;line-height:1.5}
.fr-gloss{color:var(--muted);font-size:.9em}

header.top{padding:18px 0 4px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top .sub{color:var(--muted);font-size:13px;margin-top:3px}
.badge{background:var(--ink);color:#fff;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;white-space:nowrap}

.panel{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.panel.tight{padding:13px}
.panel.flat{box-shadow:none;background:transparent;border-style:dashed}

button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;border-radius:8px;padding:13px 18px;font-weight:600;font-size:15px;width:100%;transition:opacity .12s}
.btn:active{opacity:.75}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--hair)}
.btn.sm{padding:9px 13px;font-size:14px;width:auto}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn:focus-visible,.opt:focus-visible,.tab:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}

.row{display:flex;gap:9px}
.row>*{flex:1}

/* answer-sheet options */
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--hair);border-radius:8px;padding:12px 13px;margin:8px 0;transition:border-color .1s,background .1s}
.opt:active{background:#F4F5F3}
.opt .lz{flex:0 0 26px;height:26px;border:1.5px solid var(--ink-soft);border-radius:999px;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-top:1px}
.opt.sel{border-color:var(--ink)}
.opt.sel .lz{background:var(--ink);border-color:var(--ink);color:#fff}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.good .lz{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--no);background:var(--no-bg)}
.opt.bad .lz{background:var(--no);border-color:var(--no);color:#fff}
.opt .txt{flex:1}

.verdict{border-radius:8px;padding:13px;margin:12px 0;font-size:14.5px;border:1px solid}
.verdict.y{background:var(--ok-bg);border-color:#BEDCC9;color:#1E5438}
.verdict.n{background:var(--no-bg);border-color:#EEC6C0;color:#8C2A22}
.verdict b{display:block;margin-bottom:3px}

mark{background:linear-gradient(transparent 58%, var(--mark) 58%);padding:0 1px;color:inherit}

.q{font-size:17px;margin:6px 0 14px}

/* progress */
.bar{height:7px;background:#E8E7E1;border-radius:99px;overflow:hidden;margin:9px 0}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(251,250,247,.97);border-top:1px solid var(--hair);display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:50;backdrop-filter:blur(8px)}
nav.tabs .in{max-width:600px;margin:0 auto;display:flex;width:100%}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;font-size:10.5px;color:var(--muted);font-weight:500;border-radius:7px}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}

/* tables */
table{width:100%;border-collapse:collapse;margin:11px 0;font-size:14.5px}
th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--hair);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12.5px}
tbody tr:last-child td{border-bottom:none}

ul,ol{padding-left:20px;margin:.5em 0}
li{margin:.3em 0}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0}
.chip{border:1px solid var(--hair);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{opacity:.6;font-size:12px;margin-left:4px}

.stat{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--hair)}
.stat:last-child{border-bottom:none}
.stat b{font-family:"Bricolage Grotesque",sans-serif;font-size:19px}

.steps{list-style:none;padding:0;margin:8px 0}
.steps li{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--hair)}
.steps li:last-child{border-bottom:none}
.steps .mk{flex:0 0 22px;height:22px;border-radius:999px;border:1.5px solid var(--hair);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.steps li.done .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.done .lb{color:var(--muted);text-decoration:line-through}
.steps .lb{flex:1;font-size:14.5px}
.steps .tm{color:var(--muted);font-size:12.5px}

.note{font-size:13.5px;color:var(--muted);margin:9px 0}
.warn{background:#FFF6DF;border:1px solid #EBD79B;border-radius:8px;padding:12px;font-size:14px;margin:13px 0;color:#6B5312}

textarea{width:100%;min-height:130px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;border:1px solid var(--hair);border-radius:8px;padding:11px;background:var(--card);color:var(--graphite);resize:vertical}

.grade{display:flex;gap:8px;margin-top:12px}
.grade button{flex:1;padding:14px 6px;border-radius:8px;border:1.5px solid var(--hair);background:var(--card);font-size:13.5px;font-weight:600;line-height:1.25}
.grade .g0{color:var(--no);border-color:#EEC6C0}
.grade .g1{color:#8A6A12;border-color:#EBD79B}
.grade .g2{color:var(--ok);border-color:#BEDCC9}

.audio-btn{width:100%;padding:22px;border:1.5px dashed var(--ink-soft);border-radius:var(--r);background:var(--card);color:var(--ink);font-weight:600;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:10px}
.audio-btn:active{background:#F1F4F8}
.speed{display:flex;gap:7px;margin:11px 0}
.speed button{flex:1;padding:8px;border:1px solid var(--hair);border-radius:7px;background:var(--card);font-size:13px;font-weight:500}
.speed button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.hidden{display:none!important}
.center{text-align:center}
.mt0{margin-top:0}
.script{background:#F4F5F3;border-left:3px solid var(--hair);padding:11px 13px;border-radius:0 7px 7px 0;margin:11px 0}
.script p{margin:.35em 0}
.spk{color:var(--muted);font-size:12.5px;font-weight:600}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<p class="en"><b>Never, Rarely, Seldom, Hardly, Scarcely, No sooner, Not only, Only after, Only when, Only then, Under no circumstances, At no time, Little</b></p>
<table><tbody>
<tr><td class="fr-gloss">Normal</td><td class="en">We have <b>rarely</b> seen such a candidate.</td></tr>
<tr><td class="fr-gloss">Inversé</td><td class="en"><b>Rarely</b> <mark>have we</mark> seen such a candidate.</td></tr>
<tr><td class="fr-gloss">Normal</td><td class="en">They <b>not only</b> missed the deadline…</td></tr>
<tr><td class="fr-gloss">Inversé</td><td class="en"><b>Not only</b> <mark>did they</mark> miss the deadline…</td></tr>
</tbody></table>
<h3>La mécanique</h3>
<ol>
<li>S'il y a déjà un auxiliaire (<span class="en">have, will, can, is</span>), il passe devant le sujet.</li>
<li>S'il n'y en a pas, on en fabrique un avec <span class="en">do / does / did</span>, et le verbe repasse à la <b>base verbale</b>.</li>
</ol>
<div class="warn"><b>Piège classique</b> : <span class="en">did we <b>saw</b></span> est toujours faux. Après <span class="en">do / does / did</span>, le verbe est nu : <span class="en">did we <b>see</b></span>.</div>
<p><b>Cas particulier</b> : <span class="en">No sooner … <b>than</b></span> et <span class="en">Hardly … <b>when</b></span>.<br>

/* ═══════════════════════════════════════════════════════════
   5. ÉTAT & PERSISTANCE
   ═══════════════════════════════════════════════════════════ */

const KEY="toeic800_v1";
const DEFAULT={
  v:{}, g:{}, p5:{}, l:{},
  err:{},
  days:{},
  streak:0, lastDay:null,
  sess:null,
  lastExport:null,
  created:Date.now()
};
let S=JSON.parse(JSON.stringify(DEFAULT));
let dirty=false;

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){ S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(raw)); }
  }catch(e){ console.warn("Lecture impossible",e); }
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); dirty=false; }
  catch(e){ dirty=true; console.warn("Écriture impossible",e); }
}
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

function touchDay(){
  const t=today();
  if(S.lastDay!==t){
    if(S.lastDay && daysBetween(S.lastDay,t)===1) S.streak++;
    else if(S.lastDay) S.streak=1;
    else S.streak=1;
    S.lastDay=t;
  }
  if(!S.days[t]) S.days[t]={v:0,p5:0,g:0,l:0,ok:0,tot:0};
  return S.days[t];
}
function logAnswer(kind,ok,tag){
  const d=touchDay();
  d[kind]=(d[kind]||0)+1; d.tot++; if(ok)d.ok++;
  if(!ok&&tag){ S.err[tag]=(S.err[tag]||0)+1; }
  save();
}

/* ── Répétition espacée (SM-2 simplifié) ── */
function vKey(theme,i){ return theme+"|"+i; }
function vState(k){ return S.v[k]||(S.v[k]={ease:2.4,int:0,due:today(),reps:0,lapses:0}); }
function addDays(dstr,n){ const d=new Date(dstr); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function grade(k,g){
  const s=vState(k);
  if(g===0){ s.lapses++; s.reps=0; s.int=0; s.ease=Math.max(1.4,s.ease-0.22); s.due=today(); }
  else if(g===1){ s.reps++; s.ease=Math.max(1.4,s.ease-0.14); s.int=s.int<1?1:Math.max(1,Math.round(s.int*1.25)); s.due=addDays(today(),s.int); }
  else { s.reps++; s.ease=Math.min(3.0,s.ease+0.1); s.int=s.reps===1?1:(s.reps===2?3:Math.round(s.int*s.ease)); s.due=addDays(today(),s.int); }
  save();
}
function allCards(){
  const a=[];
  for(const th in VOCAB) VOCAB[th].forEach((w,i)=>a.push({th,i,w,k:vKey(th,i)}));
  return a;
}
function dueCards(){
  const t=today();
  return allCards().filter(c=>{ const s=S.v[c.k]; return s && s.due<=t; });
}
function newCards(n){
  const seen=allCards().filter(c=>!S.v[c.k]);
  // ordre thématique, puis on prend les n premières
  return seen.slice(0,n);
}

const app=document.getElementById("app");
let view="home", ctx={};

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function blank(t){ return esc(t).split("___").join("<mark>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</mark>"); }
function go(v,c){ view=v; ctx=c||{}; window.scrollTo(0,0); render(); }
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.go));

const TABOF={p5:"read",p5Run:"read",p6Run:"read",p7Run:"read",sim:"read",vocabRun:"vocab",
  gramLesson:"gram",gramEx:"gram",p2Run:"listen",p3Run:"listen",p4Run:"listen",stats:"home"};
function setTabs(){ const cur=TABOF[view]||view;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.go===cur)); }

function render(){
  setTabs();
  const fn={home:vHome,vocab:vVocab,vocabRun:vVocabRun,gram:vGram,gramLesson:vGramLesson,gramEx:vGramEx,
            read:vRead,p5:vP5,p5Run:vP5Run,p6Run:vP6Run,p7Run:vP7Run,sim:vSim,
            listen:vListen,p2Run:vP2Run,p3Run:vP3Run,p4Run:vP4Run,save:vSave,stats:vStats}[view];
  app.innerHTML=fn?fn():"<p>Écran introuvable.</p>";
  bind();
}
function bind(){
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go,b.dataset.ctx?JSON.parse(b.dataset.ctx):null));
  app.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>ACT[b.dataset.act](b));
}
const ACT={};

/* ── Bandeau de sauvegarde ── */
function backupBanner(){
  const n=Object.keys(S.v).length+Object.keys(S.p5).length;
  if(n<25) return "";
  const days=S.lastExport?daysBetween(S.lastExport,today()):999;
  if(days<10) return "";
  return `<div class="warn"><b>Pense à exporter ta progression.</b><br>
  ${S.lastExport?"Dernière sauvegarde il y a "+days+" jours.":"Tu n'as encore jamais exporté."}
  Si ton navigateur vide ses données, tout repart à zéro.
  <div style="margin-top:9px"><button class="btn sm sec" data-go="save">Exporter maintenant</button></div></div>`;
}

/* ── ACCUEIL / SÉANCE DU JOUR ── */
function plan(){
  const t=today();
  if(S.sess && S.sess.day===t) return S.sess;
  const due=dueCards().length;
  const nw=Math.max(0,Math.min(12, 20-due));
  // prochain cours de grammaire non terminé, par priorité
  const g=GRAM.slice().sort((a,b)=>a.prio-b.prio).find(x=>!(S.g[x.id]&&S.g[x.id].done)) || GRAM[0];
  S.sess={day:t,steps:{vocab:false,gram:false,p5:false,listen:false},gid:g.id,due,nw};
  save();
  return S.sess;
}
function vHome(){
  const s=plan();
  const g=GRAM.find(x=>x.id===s.gid);
  const d=S.days[today()]||{tot:0,ok:0};
  const done=Object.values(s.steps).filter(Boolean).length;
  const known=allCards().filter(c=>S.v[c.k]&&S.v[c.k].int>=7).length;
  const total=allCards().length;
  return `
<header class="top"><div>
  <h1>Séance du jour</h1>
  <div class="sub">${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</div>
</div><div class="badge">${S.streak} jour${S.streak>1?"s":""}</div></header>

${backupBanner()}

<div class="panel">
  <div class="meta"><span>${done} bloc${done>1?"s":""} sur 4</span><span>≈ 35 min</span></div>
  <div class="bar"><i style="width:${done/4*100}%"></i></div>
  <ul class="steps">
    <li class="${s.steps.vocab?"done":""}"><span class="mk">${s.steps.vocab?"✓":"1"}</span>
      <span class="lb">Vocabulaire — ${s.due} à revoir, ${s.nw} nouveaux</span><span class="tm">10 min</span></li>
    <li class="${s.steps.gram?"done":""}"><span class="mk">${s.steps.gram?"✓":"2"}</span>
      <span class="lb">Grammaire — ${esc(g.title)}</span><span class="tm">12 min</span></li>
    <li class="${s.steps.p5?"done":""}"><span class="mk">${s.steps.p5?"✓":"3"}</span>
      <span class="lb">Part 5 — 10 questions chronométrées</span><span class="tm">7 min</span></li>
    <li class="${s.steps.listen?"done":""}"><span class="mk">${s.steps.listen?"✓":"4"}</span>
      <span class="lb">Écoute — Part 2</span><span class="tm">6 min</span></li>
  </ul>
  ${done<4?`<button class="btn" data-act="startSess">${done===0?"Commencer la séance":"Continuer"}</button>`
   :`<div class="verdict y"><b>Séance terminée.</b>${d.tot?" "+d.ok+" bonnes réponses sur "+d.tot+" aujourd'hui.":""}</div>`}
</div>

ACT.startSess=()=>{
  const s=plan();
  if(!s.steps.vocab) return go("vocabRun",{sess:true});
  if(!s.steps.gram) return go("gramLesson",{id:s.gid,sess:true});
  if(!s.steps.p5) return go("p5Run",{n:10,timed:true,sess:true});
  if(!s.steps.listen) return go("p2Run",{n:5,sess:true});
  go("home");
};
function stepDone(k){ const s=plan(); s.steps[k]=true; save(); }

/* ── VOCABULAIRE ── */
function vVocab(){
  const due=dueCards().length, nw=allCards().filter(c=>!S.v[c.k]).length;
  const rows=Object.keys(VOCAB).map(th=>{
    const cards=VOCAB[th].map((w,i)=>vKey(th,i));
    const seen=cards.filter(k=>S.v[k]).length;
    const solid=cards.filter(k=>S.v[k]&&S.v[k].int>=7).length;
    return `<div class="stat"><span>${esc(th)}<br><span class="fr-gloss">${solid} solides · ${seen}/${cards.length} vus</span></span>
      <button class="btn sm ghost" data-go="vocabRun" data-ctx='{"theme":"${th.replace(/&/g,"&amp;")}"}'>Réviser</button></div>`;
  }).join("");
  return `
<header class="top"><div><h1>Vocabulaire</h1>
<div class="sub">${allCards().length} mots · répétition espacée</div></div></header>
${backupBanner()}
<div class="panel">
  <div class="stat"><span>À revoir aujourd'hui</span><b>${due}</b></div>
  <div class="stat"><span>Jamais vus</span><b>${nw}</b></div>
  <div style="margin-top:13px" class="row">
    <button class="btn" data-go="vocabRun">Session du jour</button>
  </div>
  <p class="note">La session mélange les mots dus et jusqu'à 12 nouveaux, plafonnée à 20 cartes.</p>
</div>
<h2>Par thème</h2>
<div class="panel tight">${rows}</div>`;
}

ACT.vocabFlip=()=>{ ctx.shown=true; render(); };
ACT.vocabGrade=(b)=>{
  const g=+b.dataset.g, c=ctx.queue[ctx.idx];
  grade(c.k,g); logAnswer("v",g>0,null);
  if(g===0) ctx.queue.push(c);
  ctx.idx++; ctx.shown=false;
  if(ctx.idx>=ctx.queue.length){
    if(ctx.sess){ stepDone("vocab"); return go("home"); }
    return go("vocab");
  }
  render();
};
function vVocabRun(){
  if(!ctx.queue){
    let q;
    if(ctx.theme && VOCAB[ctx.theme]) q=VOCAB[ctx.theme].map((w,i)=>({th:ctx.theme,i,w,k:vKey(ctx.theme,i)}));
    else q=dueCards().concat(newCards(Math.max(0,20-dueCards().length))).slice(0,20);
    if(!q.length) q=newCards(12);
    ctx.queue=q; ctx.idx=0; ctx.shown=false;
  }
  if(!ctx.queue.length) return `<header class="top"><h1>Vocabulaire</h1></header>
    <div class="panel center"><p>Rien à réviser aujourd'hui.</p><button class="btn sec" data-go="vocab">Retour</button></div>`;
  const c=ctx.queue[ctx.idx], w=c.w;
  const st=S.v[c.k];
  return `
<header class="top"><div><h1>${esc(c.th)}</h1>
<div class="sub">${ctx.idx+1} / ${ctx.queue.length}${st?" · revu "+st.reps+"×":" · nouveau"}</div></div>
<button class="btn sm ghost" data-go="vocab">Quitter</button></header>
<div class="bar"><i style="width:${ctx.idx/ctx.queue.length*100}%"></i></div>

<div class="panel" style="min-height:240px">
  <p class="en" style="font-size:30px;font-weight:500;margin:14px 0 4px">${esc(w[0])}</p>
  ${ctx.shown?`
  <p style="font-size:19px;margin:0 0 16px"><mark>${esc(w[1])}</mark></p>
  <div class="script">
    <p class="en">${esc(w[2])}</p>
    <p class="fr-gloss">${esc(w[3])}</p>
  </div>
  <button class="btn sm ghost" data-act="sayWord" style="width:100%;margin-top:6px">Écouter l'exemple</button>
  `:`<p class="note" style="margin-top:40px">Traduis mentalement, puis retourne la carte.</p>`}
</div>

${ctx.shown?`<div class="grade">
  <button class="g0" data-act="vocabGrade" data-g="0">Je ne savais pas</button>
  <button class="g1" data-act="vocabGrade" data-g="1">Difficile</button>
  <button class="g2" data-act="vocabGrade" data-g="2">Facile</button>

/* ── GRAMMAIRE ── */
function vGram(){
  const items=GRAM.map(g=>{
    const st=S.g[g.id]||{};
    const sc=st.best!=null?`${st.best}/${g.ex.length}`:"—";
    return `<div class="stat"><span>${esc(g.title)}<br><span class="fr-gloss">${esc(g.why)}</span></span>
      <span style="text-align:right"><b>${sc}</b><br><button class="btn sm ghost" data-go="gramLesson" data-ctx='{"id":"${g.id}"}'>Ouvrir</button></span></div>`;
  }).join("");
  return `<header class="top"><div><h1>Grammaire</h1>
  <div class="sub">${GRAM.length} cours, classés par priorité pour toi</div></div></header>
  ${backupBanner()}
  <div class="panel tight">${items}</div>`;
}
function vGramLesson(){
  const g=GRAM.find(x=>x.id===ctx.id);
  return `<header class="top"><div><h1>${esc(g.title)}</h1>
  <div class="sub">${esc(g.why)}</div></div>
  <button class="btn sm ghost" data-go="gram">Liste</button></header>
  <div class="panel">${g.lesson}</div>
  <button class="btn" data-go="gramEx" data-ctx='{"id":"${g.id}","sess":${ctx.sess?true:false}}'>Passer aux exercices (${g.ex.length})</button>`;
}
ACT.gramPick=(b)=>{
  if(ctx.answered) return;
  const g=GRAM.find(x=>x.id===ctx.id), q=ctx.ex[ctx.idx];
  ctx.pick=+b.dataset.i; ctx.answered=true;
  const ok=ctx.pick===q[2];
  if(ok) ctx.score=(ctx.score||0)+1;
  logAnswer("g",ok,g.id);
  render();
};
ACT.gramNext=()=>{
  const g=GRAM.find(x=>x.id===ctx.id);
  ctx.idx++; ctx.answered=false; ctx.pick=null;
  if(ctx.idx>=ctx.ex.length){
    const st=S.g[g.id]||(S.g[g.id]={});
    st.best=Math.max(st.best||0,ctx.score||0);
    st.done=(ctx.score||0)>=Math.ceil(ctx.ex.length*0.8);
    st.last=today();
    save();
    ctx.finished=true;
  }
  render();
};
function vGramEx(){
  const g=GRAM.find(x=>x.id===ctx.id);
  if(ctx.idx==null){ ctx.idx=0; ctx.score=0; ctx.answered=false; ctx.ex=g.ex.map(q=>shufQ(q,1,2)); }
  if(ctx.finished){
    const pc=Math.round(ctx.score/ctx.ex.length*100);
    const good=pc>=80;
    return `<header class="top"><h1>${esc(g.title)}</h1></header>
    <div class="panel center">
      <p style="font-size:38px;font-family:Bricolage Grotesque,sans-serif;font-weight:700;margin:6px 0">${ctx.score}/${ctx.ex.length}</p>
      <div class="verdict ${good?"y":"n"}"><b>${good?"Notion validée.":"À retravailler."}</b>
      ${good?"Elle reviendra dans quelques séances pour vérifier que c'est tenu.":"Relis le cours et refais les exercices. Une seule bonne série ne suffit pas."}</div>
      <div class="row">
        <button class="btn sec" data-go="gramLesson" data-ctx='{"id":"${g.id}"}'>Relire</button>
        <button class="btn" data-act="gramRestart">Refaire</button>
      </div>
      <div style="margin-top:9px"><button class="btn ghost" data-act="gramExit">${ctx.sess?"Continuer la séance":"Retour"}</button></div>
    </div>`;
  }
  const q=ctx.ex[ctx.idx];
  return `<header class="top"><div><h1>${esc(g.title)}</h1>
  <div class="sub">Question ${ctx.idx+1} / ${ctx.ex.length}</div></div>
  <button class="btn sm ghost" data-go="gram">Quitter</button></header>
  <div class="bar"><i style="width:${ctx.idx/ctx.ex.length*100}%"></i></div>
  <div class="panel">
    <p class="q en">${blank(q[0])}</p>
    ${q[1].map((o,i)=>{
      let cls="opt";
      if(ctx.answered){ if(i===q[2])cls+=" good"; else if(i===ctx.pick)cls+=" bad"; }
      return `<button class="${cls}" data-act="gramPick" data-i="${i}">
        <span class="lz">${"ABCD"[i]}</span><span class="txt en">${esc(o)}</span></button>`;
    }).join("")}
    ${ctx.answered?`<div class="verdict ${ctx.pick===q[2]?"y":"n"}">
      <b>${ctx.pick===q[2]?"Correct":"Réponse : "+"ABCD"[q[2]]+" — "+esc(q[1][q[2]])}</b>${esc(q[3])}</div>
      <button class="btn" data-act="gramNext">${ctx.idx+1>=ctx.ex.length?"Terminer":"Suivante"}</button>`:""}

ACT.gramRestart=()=>{ const g=GRAM.find(x=>x.id===ctx.id); ctx.idx=0; ctx.score=0; ctx.answered=false; ctx.finished=false; ctx.ex=g.ex.map(q=>shufQ(q,1,2)); render(); };
ACT.gramExit=()=>{ if(ctx.sess){ stepDone("gram"); go("home"); } else go("gram"); };

/* ── PART 5 ── */
function pickP5(n){
  const weak=Object.entries(S.err).sort((a,b)=>b[1]-a[1]).slice(0,4).map(e=>e[0]);
  const pool=P5.map((q,i)=>({q,i}));
  const fresh=pool.filter(x=>!S.p5[x.i]);
  const wrong=pool.filter(x=>S.p5[x.i]&&S.p5[x.i].ko>0);
  const weakOnes=pool.filter(x=>weak.includes(x.q[3]));
  const bag=[];
  const push=arr=>arr.forEach(x=>{ if(!bag.find(y=>y.i===x.i)) bag.push(x); });
  push(shuffle(wrong).slice(0,Math.ceil(n*0.3)));
  push(shuffle(weakOnes).slice(0,Math.ceil(n*0.3)));
  push(shuffle(fresh));
  push(shuffle(pool));
  return bag.slice(0,n).map(x=>({i:x.i,q:shufQ(x.q,1,2)}));
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// mélange les options pour que la bonne réponse ne tombe pas toujours au même endroit
function shufOpts(opts,corr){ const idx=shuffle(opts.map((_,i)=>i)); return [idx.map(i=>opts[i]),idx.indexOf(corr)]; }
function shufQ(q,oi,ci){ const c=q.slice(); const [o,k]=shufOpts(q[oi],q[ci]); c[oi]=o; c[ci]=k; return c; }

function vP5(){
  const done=Object.keys(S.p5).length;
  const ko=Object.values(S.p5).filter(x=>x.ko>0).length;
  const weak=Object.entries(S.err).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const names={passive:"Voix passive",perfect:"Present perfect",prep:"Prépositions",wordfam:"Familles de mots",
    calque:"Calques du français",count:"Indénombrables",invers:"Inversions",rel:"Relatifs",cond:"Conditionnels",
    ing:"Gérondif/infinitif",compar:"Comparatifs",agree:"Accord sujet-verbe"};
  return `<header class="top"><div><h1>Part 5</h1>
  <div class="sub">${P5.length} questions · 24 s par question au rythme cible</div></div></header>
  ${backupBanner()}
  <div class="panel">
    <div class="stat"><span>Questions vues</span><b>${done} / ${P5.length}</b></div>
    <div class="stat"><span>Encore ratées</span><b>${ko}</b></div>
    <div class="row" style="margin-top:13px">
      <button class="btn" data-go="p5Run" data-ctx='{"n":10,"timed":true}'>10 chronométrées</button>
    </div>
    <div class="row" style="margin-top:9px">
      <button class="btn sec" data-go="p5Run" data-ctx='{"n":20,"timed":true}'>20 questions</button>
      <button class="btn sec" data-go="p5Run" data-ctx='{"n":10,"timed":false}'>Sans chrono</button>
    </div>
    <p class="note">La sélection est pondérée : tes erreurs passées et tes points faibles reviennent en priorité.</p>
  </div>
  ${weak.length?`<h2>Tes points faibles</h2><div class="panel tight">
  ${weak.map(([t,n])=>`<div class="stat"><span>${names[t]||t}</span><b>${n} erreur${n>1?"s":""}</b></div>`).join("")}</div>`:""}`;
}
ACT.p5Pick=(b)=>{
  if(ctx.answered) return;
  const it=ctx.list[ctx.idx], q=it.q;
  ctx.pick=+b.dataset.i; ctx.answered=true;
  const ok=ctx.pick===q[2];
  if(ok) ctx.score=(ctx.score||0)+1;
  const st=S.p5[it.i]||(S.p5[it.i]={ok:0,ko:0});
  if(ok){st.ok++; if(st.ko>0)st.ko--;} else st.ko++;
  logAnswer("p5",ok,q[3]);
  render();
};
ACT.p5Next=()=>{
  ctx.idx++; ctx.answered=false; ctx.pick=null;
  if(ctx.idx>=ctx.list.length){ ctx.finished=true; ctx.elapsed=Math.round((Date.now()-ctx.t0)/1000); }
  render();
};
function vP5Run(){
  if(!ctx.list){ ctx.list=pickP5(ctx.n||10); ctx.idx=0; ctx.score=0; ctx.answered=false; ctx.t0=Date.now(); }
  if(ctx.finished){
    const pc=Math.round(ctx.score/ctx.list.length*100);
    const per=(ctx.elapsed/ctx.list.length).toFixed(1);
    const fast=per<=24;
    return `<header class="top"><h1>Part 5</h1></header>
    <div class="panel center">
      <p style="font-size:38px;font-family:Bricolage Grotesque,sans-serif;font-weight:700;margin:6px 0">${ctx.score}/${ctx.list.length}</p>
      <div class="stat"><span>Temps total</span><b>${Math.floor(ctx.elapsed/60)} min ${ctx.elapsed%60} s</b></div>
      <div class="stat"><span>Par question</span><b>${per} s</b></div>
      <div class="verdict ${pc>=80?"y":"n"}" style="text-align:left">
        <b>${pc>=80?"Bon score.":"En dessous de la cible."}</b>
        Pour 800, il faut viser 85% en 24 s par question. Tu es à ${pc}% en ${per} s.
        ${!fast?"La vitesse viendra avec le vocabulaire, ne force pas encore.":""}
      </div>
      <div class="row">
        <button class="btn sec" data-act="p5Restart">Relancer</button>
        <button class="btn" data-act="p5Exit">${ctx.sess?"Continuer":"Retour"}</button>
      </div>
    </div>`;
  }
  const it=ctx.list[ctx.idx], q=it.q;
  return `<header class="top"><div><h1>Part 5</h1>
  <div class="sub">Question ${ctx.idx+1} / ${ctx.list.length}${ctx.timed?" · vise 24 s":""}</div></div>
  <button class="btn sm ghost" data-go="p5">Quitter</button></header>
  <div class="bar"><i style="width:${ctx.idx/ctx.list.length*100}%"></i></div>
  <div class="panel">
    <p class="q en">${blank(q[0])}</p>
    ${q[1].map((o,i)=>{
      let cls="opt";
      if(ctx.answered){ if(i===q[2])cls+=" good"; else if(i===ctx.pick)cls+=" bad"; }
      return `<button class="${cls}" data-act="p5Pick" data-i="${i}">
        <span class="lz">${"ABCD"[i]}</span><span class="txt en">${esc(o)}</span></button>`;
    }).join("")}
    ${ctx.answered?`<div class="verdict ${ctx.pick===q[2]?"y":"n"}">
      <b>${ctx.pick===q[2]?"Correct":"Réponse : "+"ABCD"[q[2]]+" — "+esc(q[1][q[2]])}</b>${esc(q[4])}</div>
      <button class="btn" data-act="p5Next">${ctx.idx+1>=ctx.list.length?"Terminer":"Suivante"}</button>`:""}
  </div>`;
}
ACT.p5Restart=()=>{ ctx.list=null; ctx.finished=false; render(); };
ACT.p5Exit=()=>{ if(ctx.sess){ stepDone("p5"); go("home"); } else go("p5"); };

/* ── ÉCOUTE (Web Speech API) ── */
let RATE=parseFloat(localStorage.getItem("toeic_rate")||"0.92");
let voice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>/en-US/i.test(v.lang)&&/Samantha|Google US|Microsoft Aria/i.test(v.name))
      ||vs.find(v=>/en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(text,cb){
  if(!("speechSynthesis" in window)){ alert("Ton navigateur ne gère pas la synthèse vocale."); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US"; u.rate=RATE; if(voice)u.voice=voice;
  if(cb)u.onend=cb;
  speechSynthesis.speak(u);
}
function speakSeq(arr,i,cb){
  i=i||0;
  if(i>=arr.length){ if(cb)cb(); return; }
  speak(arr[i],()=>setTimeout(()=>speakSeq(arr,i+1,cb),420));
}
ACT.setRate=(b)=>{ RATE=parseFloat(b.dataset.r); localStorage.setItem("toeic_rate",RATE); render(); };

function vListen(){
  const ok="speechSynthesis" in window;
  return `<header class="top"><div><h1>Écoute</h1>
  <div class="sub">Voix de synthèse · ${P2.length} Part 2, ${P3.length} Part 3</div></div></header>
  ${backupBanner()}
  ${!ok?`<div class="warn">Ton navigateur ne gère pas la synthèse vocale. Utilise Chrome ou Safari.</div>`:""}
  <div class="panel">
    <h3 class="mt0">Vitesse de lecture</h3>
    <div class="speed">
      ${[["0.8","Lente"],["0.92","Normale"],["1.05","TOEIC"],["1.15","Rapide"]].map(([r,l])=>
      `<button class="${Math.abs(RATE-parseFloat(r))<0.02?"on":""}" data-act="setRate" data-r="${r}">${l}</button>`).join("")}
    </div>
    <p class="note">Commence en « Lente ». Le vrai TOEIC tourne autour de « TOEIC ». Monte d'un cran quand tu tiens 80%.</p>
  </div>
  <div class="panel">
    <h3 class="mt0">Part 2 — Question / réponse</h3>
    <p style="font-size:14.5px;margin-bottom:12px">Tu entends une question puis trois réponses. Tu choisis la bonne. C'est la partie la moins chère du test en points.</p>

    <h3 class="mt0">Part 3 — Conversations</h3>

ACT.p2Play=()=>{
  const it=ctx.list[ctx.idx];
  const seq=[it[0],"A.",it[1][0],"B.",it[1][1],"C.",it[1][2]];
  speakSeq(seq);
};
ACT.p2Repeat=()=>{ speak(ctx.list[ctx.idx][0]); };
ACT.p2Pick=(b)=>{
  if(ctx.answered) return;
  const it=ctx.list[ctx.idx];
  ctx.pick=+b.dataset.i; ctx.answered=true;
  const ok=ctx.pick===it[2];
  if(ok) ctx.score=(ctx.score||0)+1;
  logAnswer("l",ok,"listen");

};

  if(!ctx.list){ ctx.list=shuffle(P2).slice(0,ctx.n||10).map(q=>shufQ(q,1,2)); ctx.idx=0; ctx.score=0; ctx.answered=false; }

    const pc=Math.round(ctx.score/ctx.list.length*100);
    return `<header class="top"><h1>Part 2</h1></header>

        <button class="btn sec" data-act="p2Restart">Relancer</button>

function p6Render(d,upTo,picks){
  let html=esc(d.body);
  for(let i=0;i<d.gaps.length;i++){
    const tag="___"+(i+1)+"___";
    let rep;
    if(picks[i]!=null){
      const good=picks[i]===d.gaps[i][1];
      const txt=d.gaps[i][0][d.gaps[i][1]];
      rep='<b style="color:'+(good?"var(--ok)":"var(--no)")+'">'+esc(txt.length>60?txt.slice(0,58)+"…":txt)+'</b>';
    } else if(i===upTo){ rep='<mark><b>['+(i+1)+']</b></mark>'; }
    else { rep='<b>['+(i+1)+']</b>'; }
    html=html.replace(tag,rep);
  }
  return html;
}

  const d=ctx.d, i=ctx.gi;
  if(ctx.picks[i]!=null) return;
  ctx.picks[i]=+b.dataset.i;

};

function simBuild(){
  const items=[];
  pickP5(10).forEach(x=>items.push({t:"p5",q:x.q}));
  const i6=Math.floor(Math.random()*P6.length), d6=P6[i6];
  d6.gaps.forEach((g,gi)=>{const sg=shufQ(g,0,1); items.push({t:"p6",d:d6,gi,q:[null,sg[0],sg[1],null,sg[2]]});});
  const idx=shuffle(P7.map((d,i)=>i)).slice(0,2);
  idx.forEach(i=>{ const d=P7[i]; d.qs.forEach((q,qi)=>{const sq=shufQ(q,1,2); items.push({t:"p7",d,qi,q:[sq[0],sq[1],sq[2],null,sq[3]]});}); });
  return items;
}

  const max=Math.max(1,...last14.map(d=>S.days[d].tot));
  return `<header class="top"><div><h1>Progression</h1>
  <div class="sub">${days.length} jour${days.length>1?"s":""} d'activité</div></div>
  <button class="btn sm ghost" data-go="home">Séance</button></header>
  <div class="panel tight">
    <div class="stat"><span>Réponses au total</span><b>${tot}</b></div>
    <div class="stat"><span>Taux de réussite</span><b>${tot?Math.round(ok/tot*100):0}%</b></div>
    <div class="stat"><span>Série en cours</span><b>${S.streak} j</b></div>
    <div class="stat"><span>Mots solides</span><b>${allCards().filter(c=>S.v[c.k]&&S.v[c.k].int>=7).length}</b></div>
  </div>
  ${last14.length?`<h2>Ces deux dernières semaines</h2>
  <div class="panel tight">
    <div style="display:flex;align-items:flex-end;gap:4px;height:90px;margin:6px 0 10px">
    ${last14.map(d=>{const v=S.days[d];const h=Math.max(4,v.tot/max*84);
      return `<div style="flex:1;background:var(--ink);height:${h}px;border-radius:3px 3px 0 0;opacity:${v.tot?1:.15}" title="${d} : ${v.tot}"></div>`;}).join("")}
    </div>
    <div class="meta"><span>${last14[0]}</span><span>${last14[last14.length-1]}</span></div>
  </div>`:""}
  ${errs.length?`<h2>Tes erreurs par notion</h2>
  <div class="panel tight">
  ${errs.map(([t,n])=>`<div class="stat"><span>${names[t]||t}</span><b>${n}</b></div>`).join("")}
  </div>
  <p class="note">Ces notions reviennent automatiquement plus souvent dans les tirages Part 5.</p>`:""}`;
}

/* ── SAUVEGARDE ── */
function vSave(){
  const size=(()=>{ try{ return Math.round((localStorage.getItem(KEY)||"").length/1024*10)/10; }catch(e){ return 0; } })();
  return `<header class="top"><div><h1>Données</h1>
  <div class="sub">Ta progression vit dans ce navigateur</div></div></header>
  <div class="warn">
    <b>Important</b><br>
    Ce site ne stocke rien sur un serveur. Tout est dans la mémoire locale de ton navigateur.
    Si tu vides les données du site, changes de téléphone ou passes en navigation privée, tout disparaît.
    <br><br>Sur iPhone, Safari efface ce stockage après 7 jours sans visite, sauf si tu ajoutes le site à l'écran d'accueil.
    Fais-le : bouton Partager, puis « Sur l'écran d'accueil ».
  </div>
  <div class="panel">
    <h3 class="mt0">Exporter</h3>
    <p style="font-size:14.5px">Récupère un fichier que tu peux garder dans tes notes, ton Drive, ou à côté du dépôt.</p>
    <div class="row">
      <button class="btn" data-act="dl">Télécharger le fichier</button>
      <button class="btn sec" data-act="copy">Copier</button>
    </div>
    <div class="stat" style="margin-top:12px"><span>Taille des données</span><b>${size} Ko</b></div>
    <div class="stat"><span>Dernier export</span><b>${S.lastExport||"jamais"}</b></div>
  </div>
  <div class="panel">
    <h3 class="mt0">Importer</h3>
    <p style="font-size:14.5px">Colle une sauvegarde, ou charge le fichier téléchargé.</p>
    <input type="file" accept=".json,application/json" id="fileIn" style="margin:8px 0;font-size:14px">
    <textarea id="imp" placeholder='Colle ici le contenu de ta sauvegarde…'></textarea>
    <button class="btn sec" data-act="imp" style="margin-top:9px">Restaurer</button>
    <p class="note">La restauration remplace la progression actuelle.</p>
  </div>
  <div class="panel flat">
    <h3 class="mt0">Tout effacer</h3>
    <p style="font-size:14.5px">Remet le compteur à zéro. Irréversible.</p>
    <button class="btn ghost" data-act="wipe">Effacer ma progression</button>
  </div>`;
}
function exportStr(){ S.lastExport=today(); save(); return JSON.stringify(S); }
ACT.dl=()=>{
  const blob=new Blob([exportStr()],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="toeic800-"+today()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  render();
};
ACT.copy=async()=>{
  const s=exportStr();
  try{ await navigator.clipboard.writeText(s); alert("Sauvegarde copiée. Colle-la dans tes notes."); }
  catch(e){ const t=document.getElementById("imp"); if(t){t.value=s;t.select();} alert("Copie automatique refusée. Le texte est dans le champ du bas, copie-le à la main."); }
  render();
};
ACT.imp=()=>{
  const t=document.getElementById("imp").value.trim();
  if(!t) return alert("Colle d'abord une sauvegarde.");
  try{
    const o=JSON.parse(t);
    if(!o||typeof o!=="object"||!("v" in o)) throw 0;
    S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),o);
    save(); alert("Progression restaurée."); go("home");
  }catch(e){ alert("Ce contenu n'est pas une sauvegarde valide."); }
};
ACT.wipe=()=>{
  if(!confirm("Effacer toute ta progression ? Cette action est définitive.")) return;
  S=JSON.parse(JSON.stringify(DEFAULT)); save(); go("home");
};

/* ═══════════════════════════════════════════════════════════
   7. DÉMARRAGE
   ═══════════════════════════════════════════════════════════ */
load();
touchDay();
save();
render();

document.addEventListener("change",e=>{
  if(e.target&&e.target.id==="fileIn"&&e.target.files[0]){
    const r=new FileReader();
    r.onload=()=>{ const t=document.getElementById("imp"); if(t) t.value=r.result; };
    r.readAsText(e.target.files[0]);
  }
});
window.addEventListener("beforeunload",()=>{ if(dirty) save(); });
</script>
